<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firmen-Cockpit</title>
<style>
  :root{
    --bg:#0a1622; --bg2:#0f2034; --card:#13283f; --card2:#16314c;
    --teal:#2fd4bd; --gold:#e3b765; --ink:#eaf2f8; --mut:#8aa3b8;
    --line:rgba(255,255,255,.08); --red:#ff6b63; --amber:#f0b54e; --green:#43e08f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#16314c,#0a1622 60%);color:var(--ink);
    min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:90px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  button{font-family:inherit}
  .top{position:sticky;top:0;z-index:30;background:rgba(10,22,34,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topin{max-width:1080px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:11px}
  .iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:all .15s;flex:0 0 auto}
  .iconbtn:hover{border-color:rgba(47,212,189,.45);background:var(--card2)}
  .iconbtn.hidden{visibility:hidden;pointer-events:none}
  .iconbtn.act{background:var(--teal);color:#06241f;border-color:var(--teal);font-weight:800}
  .brand{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal)}
  .crumb{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
  .crumb a{color:var(--teal);cursor:pointer;text-decoration:none;white-space:nowrap}
  .crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gpill{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;flex:0 0 auto}
  .gpill b{font-size:13.5px;color:var(--teal)}
  .editbar{background:linear-gradient(90deg,rgba(47,212,189,.14),rgba(47,212,189,.04));border-bottom:1px solid rgba(47,212,189,.25);text-align:center;font-size:12.5px;color:var(--teal);padding:7px;font-weight:700;display:none}
  body.edit .editbar{display:block}
  .hero{padding:24px 0 4px;text-align:center}
  .hero .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .hero h1{font-size:24px;font-weight:800;margin-top:6px}
  .tabs{display:flex;gap:11px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 22px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:800;font-size:15px;cursor:pointer;transition:all .15s}
  .tab:hover{border-color:rgba(47,212,189,.45)}
  .tab.active{background:linear-gradient(135deg,var(--teal),#1f9e8f);color:#06241f;border-color:var(--teal);box-shadow:0 8px 22px rgba(47,212,189,.22)}
  .tab .tp{font-size:11.5px;font-weight:800;opacity:.8}
  .task.q{cursor:pointer;border-style:dashed;border-color:rgba(227,183,101,.4);opacity:1}
  .task.q:hover{border-color:var(--gold)}
  .task.q .ind{border-color:var(--gold);background:rgba(227,183,101,.08)}
  .task.q .ind b{color:var(--gold);font-size:15px;font-weight:800}
  .task.q label{color:var(--ink)}
  .task.q .qlabel{font-size:10.5px;color:var(--gold);font-weight:800;letter-spacing:.06em;margin-top:5px;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:15px;margin-top:18px}
  .tile{position:relative;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;animation:rise .4s ease backwards}
  .tile:hover{transform:translateY(-4px);border-color:rgba(47,212,189,.4);box-shadow:0 14px 34px rgba(0,0,0,.4)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
  .thumb{height:104px;background:linear-gradient(135deg,#1c3a5a,#15485f);background-size:cover;background-position:center;position:relative}
  .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,22,34,.05),rgba(10,22,34,.78))}
  .thumb .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;z-index:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
  .ring{position:absolute;top:10px;right:10px;z-index:2}
  .tbody{padding:13px 15px 15px}
  .tbody h3{font-size:15.5px;font-weight:800;line-height:1.25}
  .tbody .desc{font-size:12.5px;color:var(--mut);margin-top:3px;min-height:16px}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--mut)}
  .bar{height:7px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;margin-top:8px}
  .bar>div{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .pct{font-weight:800;font-size:13.5px}
  .editctl{position:absolute;top:9px;left:9px;display:none;gap:6px;z-index:5}
  body.edit .editctl{display:flex}
  .minibtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(10,22,34,.8);color:var(--ink);font-size:13px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px);transition:all .15s}
  .minibtn:hover{border-color:var(--teal)}
  .minibtn.del:hover{border-color:var(--red);color:var(--red)}
  .addtile{display:none;align-items:center;justify-content:center;gap:9px;min-height:200px;border:2px dashed rgba(47,212,189,.35);border-radius:18px;color:var(--teal);font-weight:700;cursor:pointer;background:rgba(47,212,189,.04);transition:all .15s;font-size:15px}
  .addtile:hover{background:rgba(47,212,189,.1);border-color:var(--teal)}
  body.edit .addtile{display:flex}
  .syslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
  .syscard{position:relative;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px 17px;cursor:pointer;transition:transform .12s,border-color .12s;animation:rise .35s ease backwards}
  .syscard:hover{transform:translateY(-3px);border-color:rgba(47,212,189,.35)}
  .syscard .sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .syscard h4{font-size:15.5px;font-weight:800;padding-right:56px}
  .syscard .done{font-size:12.5px;color:var(--mut);margin-top:7px}
  .addrow{display:none;align-items:center;justify-content:center;gap:8px;padding:15px;border:2px dashed rgba(47,212,189,.35);border-radius:14px;color:var(--teal);font-weight:700;cursor:pointer;background:rgba(47,212,189,.04);transition:all .15s;margin-top:12px}
  .addrow:hover{background:rgba(47,212,189,.1)}
  body.edit .addrow{display:flex}
  .tasks{margin-top:16px;display:flex;flex-direction:column;gap:11px}
  .task{position:relative;display:flex;align-items:center;gap:15px;padding:15px 18px;font-size:15px;cursor:pointer;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;transition:transform .14s,border-color .18s,box-shadow .18s,opacity .25s;animation:rise .3s ease backwards}
  .task:hover{transform:translateY(-2px);border-color:rgba(47,212,189,.4);box-shadow:0 8px 22px rgba(0,0,0,.28)}
  .task .ind{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);flex:0 0 auto;display:grid;place-items:center;transition:all .22s;background:rgba(255,255,255,.02)}
  .task .ind svg{opacity:0;transform:scale(.4);transition:all .22s}
  .task .body{flex:1;min-width:0}
  .task label{cursor:pointer;color:var(--ink);font-weight:600;line-height:1.35;transition:color .25s;display:block}
  .task .pbar{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:8px}
  .task .pbar>div{height:100%;border-radius:4px;transition:width .4s}
  .task .pnum{font-size:12px;color:var(--mut);margin-top:5px;font-weight:700}
  .task .donebadge{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--green);border:1px solid rgba(67,224,143,.35);border-radius:999px;padding:3px 9px;opacity:0;transition:opacity .25s;white-space:nowrap;flex:0 0 auto}
  .task.done{border-color:rgba(67,224,143,.28);opacity:.74}
  .task.done .ind{background:var(--green);border-color:var(--green);box-shadow:0 0 14px rgba(67,224,143,.4)}
  .task.done .ind svg{opacity:1;transform:scale(1)}
  .task.done label{color:var(--mut)}
  .task.done .donebadge{opacity:1}
  .task .tctl{display:none;gap:6px;flex:0 0 auto}
  body.edit .task .tctl{display:flex}
  body.edit .task .donebadge{display:none}
  .vhead{display:flex;align-items:center;gap:16px;margin-top:20px}
  .vhead .vic{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#1c3a5a,#15485f);display:grid;place-items:center;font-size:30px;flex:0 0 auto;background-size:cover;background-position:center}
  .vhead h2{font-size:22px;font-weight:800}
  .vhead .vd{font-size:13.5px;color:var(--mut);margin-top:2px}
  .vhead .vpct{margin-left:auto;text-align:right}
  .vhead .vpct .n{font-size:26px;font-weight:800}
  .ideebtn{margin-top:14px;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(160deg,rgba(227,183,101,.1),rgba(227,183,101,.03));border:1px solid rgba(227,183,101,.28);border-radius:14px;padding:14px 16px;color:var(--gold);font-weight:700;cursor:pointer;font-size:14.5px;transition:all .15s}
  .ideebtn:hover{background:rgba(227,183,101,.16);border-color:rgba(227,183,101,.5)}
  .ideebtn .arrow{margin-left:auto;color:var(--mut)}
  .ov{position:fixed;inset:0;background:rgba(6,14,22,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
  .ov.on{display:flex}
  .dlg{background:linear-gradient(160deg,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1}}
  .dlg h3{padding:18px 20px 4px;font-size:17px;font-weight:800}
  .dlg .dbody{padding:8px 20px 4px}
  .fld{margin-top:12px}
  .fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600}
  .fld input,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 13px;font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
  .fld input:focus,.fld textarea:focus{border-color:var(--teal)}
  .fld textarea{resize:vertical;min-height:72px;line-height:1.5}
  .fld textarea.big{min-height:240px}
  .hintsmall{font-size:11.5px;color:var(--mut);margin-top:4px}
  .dlgfoot{display:flex;gap:10px;padding:16px 20px 20px;justify-content:flex-end;flex-wrap:wrap}
  .btn{padding:11px 18px;border-radius:11px;font-size:14.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:all .15s}
  .btn:hover{border-color:var(--teal)}
  .btn.prim{background:var(--teal);color:#06241f;border-color:var(--teal)}
  .btn.danger{background:rgba(255,107,99,.15);border-color:rgba(255,107,99,.4);color:var(--red)}
  .ideeview{white-space:pre-wrap;line-height:1.6;font-size:14.5px;color:#cfe0ee}
  .slider{width:100%;margin-top:10px;accent-color:var(--teal)}
  .footnote{text-align:center;color:var(--mut);font-size:12px;margin-top:24px;padding:0 16px}
  .err{margin-top:30px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--mut);text-align:center;font-size:14px}
</style>
</head>
<body>
<div class="top">
  <div class="topin">
    <button class="iconbtn" id="backBtn" onclick="goBack()" title="Zurück">←</button>
    <div class="brand"><span class="dot"></span><span>Cockpit</span></div>
    <div class="crumb" id="crumb"></div>
    <div class="gpill"><b id="gpct">–</b><svg width="30" height="30" viewBox="0 0 36 36" id="gring"></svg></div>
    <button class="iconbtn" id="editBtn" onclick="toggleEdit()" title="Bearbeiten">✏️</button>
    <button class="iconbtn" onclick="openMenu()" title="Menü">⋯</button>
  </div>
</div>
<div class="editbar">✏️ Bearbeiten-Modus aktiv — hinzufügen, umbenennen, %-Wert setzen, löschen</div>
<div class="wrap" id="app"></div>
<p class="footnote" id="foot"></p>
<div class="ov" id="ov"><div class="dlg"><h3 id="dlgTitle"></h3><div class="dbody" id="dlgBody"></div><div class="dlgfoot" id="dlgFoot"></div></div></div>

<script>
let DATA=null, view="home", areaIdx=null, sysIdx=null, editMode=false, firmTab="zentrum";
const KEY="cockpit_full_v4";
const FIRMS={zentrum:{name:"Zentrum für Gesundheitsmedizin",icon:"🏢"},praxis:{name:"Praxis El-Sobhi",icon:"🏥"}};
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){} }
const esc=(s)=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Punkt-Typen: Haken (done) · Teil-Fortschritt (pct) · Ausklügeln (q = offener Baustein, zählt als 0) */
function isQ(t){ return t.q===true; }
function tProg(t){ if(isQ(t)) return 0; return (typeof t.pct==='number') ? t.pct : (t.done?100:0); }
function isPct(t){ return typeof t.pct==='number'; }
function sysPct(s){ if(!s.tasks.length) return 0; return Math.round(s.tasks.reduce((n,t)=>n+tProg(t),0)/s.tasks.length); }
function areaPct(a){ let tot=0,n=0; a.systems.forEach(s=>s.tasks.forEach(t=>{tot+=tProg(t);n++;})); return n?Math.round(tot/n):0; }
function areaCount(a){ let n=0; a.systems.forEach(s=>n+=s.tasks.length); return n; }
function sysDoneCount(s){ return s.tasks.filter(t=>tProg(t)>=100).length; }
function col(p){ return p>=66?'var(--green)':p>=33?'var(--amber)':'var(--red)'; }
function rcol(p){ return p>=66?'#43e08f':p>=33?'#f0b54e':'#ff6b63'; }
function ringSVG(p,size){ const r=15.5,c=2*Math.PI*r,off=c*(1-p/100);
  return `<svg class="ring" viewBox="0 0 36 36" style="width:${size}px;height:${size}px">
    <circle cx="18" cy="18" r="${r}" fill="rgba(10,22,34,.55)" stroke="rgba(255,255,255,.12)" stroke-width="3"/>
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="${rcol(p)}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 18 18)" style="transition:stroke-dashoffset .6s"/>
    <text x="18" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">${p>=100?'✓':p}</text></svg>`; }
function gring(p){ const r=15.5,c=2*Math.PI*r,off=c*(1-p/100);
  document.getElementById('gring').innerHTML=`<circle cx="18" cy="18" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="${rcol(p)}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 18 18)"/>`; }

/* ---------- Navigation mit Browser-History ---------- */
function applyState(st){ view=st.view; areaIdx=st.areaIdx; sysIdx=st.sysIdx; render(); }
function nav(v,a,s){ view=v;areaIdx=(a==null?areaIdx:a);sysIdx=(s==null?sysIdx:s);
  history.pushState({view,areaIdx,sysIdx},'', '#'+v); window.scrollTo(0,0); render(); }
function go(v){ nav(v,null,null); }
function goArea(i){ nav('area',i,null); }
function goSys(a,s){ nav('system',a,s); }
function goBack(){ if(view==='home') return; history.back(); }
window.onpopstate=(e)=>{ if(e.state){ applyState(e.state); } else { view='home'; render(); } window.scrollTo(0,0); };
function toggleEdit(){ editMode=!editMode; document.body.classList.toggle('edit',editMode); document.getElementById('editBtn').classList.toggle('act',editMode); render(); }

/* ---------- Modal-Helfer ---------- */
function openOv(){ document.getElementById('ov').classList.add('on'); }
function closeModal(){ document.getElementById('ov').classList.remove('on'); }
document.getElementById('ov').onclick=(e)=>{ if(e.target.id==='ov') closeModal(); };
function modal(title, fields, onSave){
  document.getElementById('dlgTitle').textContent=title;
  const body=document.getElementById('dlgBody'); body.innerHTML='';
  fields.forEach((f,i)=>{ const w=document.createElement('div'); w.className='fld';
    let inp = f.type==='ta'?`<textarea id="f${i}">${esc(f.value)}</textarea>`
            : f.type==='big'?`<textarea id="f${i}" class="big">${esc(f.value)}</textarea>`
            : `<input id="f${i}" value="${esc(f.value)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
    w.innerHTML=`<label>${f.label}</label>`+inp+(f.hint?`<div class="hintsmall">${f.hint}</div>`:''); body.appendChild(w); });
  document.getElementById('dlgFoot').innerHTML=`<button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn prim" id="okBtn">Speichern</button>`;
  document.getElementById('okBtn').onclick=()=>{ const vals=fields.map((f,i)=>document.getElementById('f'+i).value.trim());
    if(fields[0].req!==false && vals[0]===''){ document.getElementById('f0').focus(); return; } closeModal(); onSave(vals); };
  openOv(); setTimeout(()=>{const el=document.getElementById('f0'); if(el){el.focus();}},50);
}
function confirmModal(title,msg,onYes){ document.getElementById('dlgTitle').textContent=title;
  document.getElementById('dlgBody').innerHTML=`<p style="color:var(--mut);font-size:14.5px;padding:6px 0">${esc(msg)}</p>`;
  document.getElementById('dlgFoot').innerHTML=`<button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn danger" id="okBtn">Löschen</button>`;
  document.getElementById('okBtn').onclick=()=>{closeModal();onYes();}; openOv(); }

/* Idee-Dokument anzeigen/bearbeiten */
function openIdee(level){
  const obj = level==='area'?DATA.areas[areaIdx]:DATA.areas[areaIdx].systems[sysIdx];
  const txt = obj.idee||'';
  document.getElementById('dlgTitle').textContent='💡 Idee dahinter — '+(level==='area'?DATA.areas[areaIdx].name:DATA.areas[areaIdx].systems[sysIdx].name);
  document.getElementById('dlgBody').innerHTML = txt
    ? `<div class="ideeview">${esc(txt)}</div>` : `<p style="color:var(--mut);padding:8px 0">Noch keine ausgearbeitete Idee hinterlegt.</p>`;
  document.getElementById('dlgFoot').innerHTML=`<button class="btn" onclick="closeModal()">Schließen</button><button class="btn prim" id="okBtn">✏️ Bearbeiten</button>`;
  document.getElementById('okBtn').onclick=()=>{ closeModal();
    modal('Idee dahinter bearbeiten',[{label:'Die komplette Idee (wird gespeichert & immer wieder aktualisiert)',value:txt,type:'big',req:false}],
      v=>{ obj.idee=v[0]; persist(); render(); }); };
  openOv();
}
/* %-Steller für Teil-Fortschritt */
function openPct(ti){
  const t=DATA.areas[areaIdx].systems[sysIdx].tasks[ti];
  document.getElementById('dlgTitle').textContent='Fortschritt setzen';
  document.getElementById('dlgBody').innerHTML=`<p style="font-weight:700;font-size:15px;padding:4px 0 2px">${esc(t.t)}</p>
    <div style="display:flex;align-items:center;gap:14px;margin-top:6px"><span id="pv" style="font-size:30px;font-weight:800;color:var(--teal);min-width:74px">${tProg(t)}%</span>
    <input type="range" class="slider" id="pr" min="0" max="100" step="5" value="${tProg(t)}"></div>`;
  document.getElementById('pr').oninput=(e)=>{ document.getElementById('pv').textContent=e.target.value+'%'; };
  document.getElementById('dlgFoot').innerHTML=`<button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn prim" id="okBtn">Speichern</button>`;
  document.getElementById('okBtn').onclick=()=>{ t.pct=parseInt(document.getElementById('pr').value,10); delete t.done; persist(); closeModal(); render(); };
  openOv();
}
function openMenu(){ document.getElementById('dlgTitle').textContent='Menü';
  document.getElementById('dlgBody').innerHTML=`<p style="color:var(--mut);font-size:13.5px;padding:4px 0 8px">Stand: ${esc(DATA.updated||'')} · ${DATA.areas.length} Bereiche</p>`;
  document.getElementById('dlgFoot').innerHTML=`<button class="btn danger" id="rb">Auf Original zurücksetzen</button><button class="btn" onclick="closeModal()">Schließen</button>`;
  document.getElementById('rb').onclick=()=>{closeModal();confirmModal('Zurücksetzen?','Deine Änderungen gehen verloren, Original-Stand wird geladen.',()=>{localStorage.removeItem(KEY);location.reload();});}; openOv(); }

/* ---------- Edit-Aktionen ---------- */
function uid(p){ return p+Math.random().toString(36).slice(2,8); }
function addArea(){ modal('Neuer Bereich',[{label:'Name',value:''},{label:'Symbol (Emoji)',value:'📌'},{label:'Kurzbeschreibung',value:'',type:'ta',req:false}],
  v=>{ DATA.areas.push({id:uid('a'),firm:firmTab,name:v[0],icon:v[1]||'📌',img:'',desc:v[2],idee:'',systems:[]});persist();render(); }); }
function editArea(i,ev){ ev&&ev.stopPropagation(); const a=DATA.areas[i];
  modal('Bereich bearbeiten',[{label:'Name',value:a.name},{label:'Symbol',value:a.icon},{label:'Kurzbeschreibung',value:a.desc||'',type:'ta',req:false}],
  v=>{a.name=v[0];a.icon=v[1]||'📌';a.desc=v[2];persist();render();}); }
function delArea(i,ev){ ev&&ev.stopPropagation(); confirmModal('Bereich löschen?','„'+DATA.areas[i].name+'" mit allem Inhalt wird gelöscht.',()=>{DATA.areas.splice(i,1);persist();if(view!=='home')go('home');else render();}); }
function addSys(){ modal('Neues System',[{label:'Name',value:''}],v=>{DATA.areas[areaIdx].systems.push({name:v[0],idee:'',tasks:[]});persist();render();}); }
function editSys(si,ev){ ev&&ev.stopPropagation(); const s=DATA.areas[areaIdx].systems[si];
  modal('System bearbeiten',[{label:'Name',value:s.name}],v=>{s.name=v[0];persist();render();}); }
function delSys(si,ev){ ev&&ev.stopPropagation(); confirmModal('System löschen?','„'+DATA.areas[areaIdx].systems[si].name+'" wird gelöscht.',()=>{DATA.areas[areaIdx].systems.splice(si,1);persist();if(view==='system')go('area');else render();}); }
function addTask(){ modal('Neuer Punkt',[{label:'Text',value:''},{label:'% (leer = Abhaken · Zahl = Teil-Fortschritt · ? = noch auszuklügeln)',value:'',req:false,ph:'z.B. 40 oder ?'}],
  v=>{ const t={t:v[0]}; const x=(v[1]||'').trim(); if(x==='?'){t.q=true;} else if(x!==''){t.pct=Math.max(0,Math.min(100,parseInt(x,10)||0));} else {t.done=false;} DATA.areas[areaIdx].systems[sysIdx].tasks.push(t);persist();render(); }); }
function editTask(ti,ev){ ev&&ev.stopPropagation(); const t=DATA.areas[areaIdx].systems[sysIdx].tasks[ti];
  modal('Punkt bearbeiten',[{label:'Text',value:t.t},{label:'% (leer=Abhaken · Zahl=% · ?=auszuklügeln)',value:isQ(t)?'?':(isPct(t)?String(t.pct):''),req:false}],
  v=>{ t.t=v[0]; const x=(v[1]||'').trim(); delete t.q; delete t.pct; if(x==='?'){t.q=true;delete t.done;} else if(x!==''){t.pct=Math.max(0,Math.min(100,parseInt(x,10)||0));delete t.done;} else {if(typeof t.done!=='boolean')t.done=false;} persist();render(); }); }
function delTask(ti,ev){ ev&&ev.stopPropagation(); DATA.areas[areaIdx].systems[sysIdx].tasks.splice(ti,1);persist();render(); }
function clickTask(ti){ const t=DATA.areas[areaIdx].systems[sysIdx].tasks[ti]; if(isQ(t)){ editTask(ti); } else if(isPct(t)){ openPct(ti); } else { t.done=!t.done; persist(); render(); } }
function setFirm(f){ firmTab=f; render(); }

/* ---------- Render ---------- */
function crumb(){ const c=document.getElementById('crumb');
  document.getElementById('backBtn').classList.toggle('hidden',view==='home');
  if(view==='home'){c.innerHTML='';return;}
  const a=DATA.areas[areaIdx];
  if(view==='area'){ c.innerHTML=`<a onclick="go('home')">Übersicht</a> ▸ <span>${esc(a.icon)} ${esc(a.name)}</span>`; }
  else{ const s=a.systems[sysIdx]; c.innerHTML=`<a onclick="go('home')">Übersicht</a> ▸ <a onclick="goArea(${areaIdx})">${esc(a.name)}</a> ▸ <span>${esc(s.name)}</span>`; }
}
function render(){
  const app=document.getElementById('app');
  let tot=0,n=0; DATA.areas.forEach(a=>a.systems.forEach(s=>s.tasks.forEach(t=>{tot+=tProg(t);n++;})));
  const g=n?Math.round(tot/n):0; document.getElementById('gpct').textContent=g+'%'; gring(g); crumb();
  if(view==='home'){
    const firmPct=(f)=>{ let tot=0,n=0; DATA.areas.forEach(a=>{ if((a.firm||'zentrum')!==f)return; a.systems.forEach(s=>s.tasks.forEach(t=>{tot+=tProg(t);n++;})); }); return n?Math.round(tot/n):0; };
    let h=`<div class="hero"><div class="k">Persönliches Cockpit</div><h1>Woran wir gerade bauen</h1></div><div class="tabs">`;
    Object.keys(FIRMS).forEach(f=>{ const fc=DATA.areas.filter(a=>(a.firm||'zentrum')===f).length;
      h+=`<div class="tab ${firmTab===f?'active':''}" onclick="setFirm('${f}')">${FIRMS[f].icon} ${esc(FIRMS[f].name)}<span class="tp">${firmPct(f)}% · ${fc} Bereiche</span></div>`; });
    h+=`</div><div class="grid">`;
    DATA.areas.forEach((a,i)=>{ if((a.firm||'zentrum')!==firmTab) return; const p=areaPct(a);
      const thumb=a.img?`<div class="thumb" style="background-image:url('${a.img}')">${ringSVG(p,50)}</div>`:`<div class="thumb"><div class="ic">${esc(a.icon)}</div>${ringSVG(p,50)}</div>`;
      h+=`<div class="tile" style="animation-delay:${i*0.02}s" onclick="goArea(${i})">
        <div class="editctl"><button class="minibtn" onclick="editArea(${i},event)">✏️</button><button class="minibtn del" onclick="delArea(${i},event)">🗑</button></div>
        ${thumb}<div class="tbody"><h3>${esc(a.name)}</h3><div class="desc">${esc(a.desc||'')}</div>
        <div class="meta"><span>${a.systems.length} Systeme${a.idee?' · 💡':''}</span><span class="pct" style="color:${col(p)}">${p}%</span></div>
        <div class="bar"><div style="width:${p}%;background:${col(p)}"></div></div></div></div>`; });
    h+=`<div class="addtile" onclick="addArea()">➕ Bereich hinzufügen</div></div>`; app.innerHTML=h;
    document.getElementById('foot').textContent=editMode?'':'Oben die zwei Firmen · Bereich antippen → Systeme → Punkte. ✏️ zum Bearbeiten.';
  } else if(view==='area'){
    const a=DATA.areas[areaIdx], p=areaPct(a);
    const vic=a.img?`<div class="vic" style="background-image:url('${a.img}')"></div>`:`<div class="vic">${esc(a.icon)}</div>`;
    let h=`<div class="vhead">${vic}<div><h2>${esc(a.name)}</h2><div class="vd">${esc(a.desc||'')}</div></div>
      <div class="vpct"><div class="n" style="color:${col(p)}">${p}%</div><div class="vd">${areaCount(a)} Punkte</div></div></div>
      <button class="ideebtn" onclick="openIdee('area')">💡 Idee dahinter ${a.idee?'lesen':'hinzufügen'}<span class="arrow">›</span></button>
      <div class="syslist">`;
    a.systems.forEach((s,si)=>{ const sp=sysPct(s);
      h+=`<div class="syscard" style="animation-delay:${si*0.04}s" onclick="goSys(${areaIdx},${si})">
        <div class="editctl" style="position:absolute;top:11px;right:11px;left:auto"><button class="minibtn" onclick="editSys(${si},event)">✏️</button><button class="minibtn del" onclick="delSys(${si},event)">🗑</button></div>
        <div class="sh"><h4>${esc(s.name)}</h4>${ringSVG(sp,46)}</div>
        <div class="bar"><div style="width:${sp}%;background:${col(sp)}"></div></div>
        <div class="done">${sysDoneCount(s)}/${s.tasks.length} fertig · ${sp}%</div></div>`; });
    h+=`</div><div class="addrow" onclick="addSys()">➕ System hinzufügen</div>`; app.innerHTML=h; document.getElementById('foot').textContent='';
  } else {
    const a=DATA.areas[areaIdx], s=a.systems[sysIdx], sp=sysPct(s);
    let h=`<div class="vhead"><div class="vic">${esc(a.icon)}</div><div><h2>${esc(s.name)}</h2><div class="vd">${esc(a.name)}</div></div>
      <div class="vpct"><div class="n" style="color:${col(sp)}">${sp}%</div><div class="vd">${sysDoneCount(s)}/${s.tasks.length} fertig</div></div></div>
      <button class="ideebtn" onclick="openIdee('system')">💡 Idee dahinter ${s.idee?'lesen':'hinzufügen'}<span class="arrow">›</span></button>
      <div class="tasks">`;
    s.tasks.forEach((t,ti)=>{ const p=tProg(t); let cls='',indHTML='',bodyUI='';
      if(isQ(t)){ cls='q';
        indHTML=`<span class="ind"><b>?</b></span>`;
        bodyUI=`<div class="body"><label>${esc(t.t)}</label><div class="qlabel">❓ noch auszuklügeln</div></div>`;
      } else if(isPct(t)){
        indHTML=`<span class="ind" style="border-color:${col(p)}"><b style="font-size:10px;color:${col(p)}">${p}</b></span>`;
        bodyUI=`<div class="body"><label>${esc(t.t)}</label><div class="pbar"><div style="width:${p}%;background:${col(p)}"></div></div><div class="pnum" style="color:${col(p)}">${p}% fertig</div></div>`;
      } else { cls=t.done?'done':'';
        indHTML=`<span class="ind"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#06301c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
        bodyUI=`<div class="body"><label>${esc(t.t)}</label></div><span class="donebadge">ERLEDIGT</span>`;
      }
      h+=`<div class="task ${cls}" style="animation-delay:${ti*0.03}s" onclick="clickTask(${ti})">
        ${indHTML}${bodyUI}
        <span class="tctl"><button class="minibtn" onclick="editTask(${ti},event)">✏️</button><button class="minibtn del" onclick="delTask(${ti},event)">🗑</button></span></div>`; });
    h+=`</div><div class="addrow" onclick="addTask()">➕ Punkt hinzufügen</div>`; app.innerHTML=h; document.getElementById('foot').textContent='';
  }
}
function startApp(d){ DATA=d; if(!DATA.areas)DATA.areas=[]; history.replaceState({view:'home',areaIdx:null,sysIdx:null},'','#home'); render(); }
const forceFresh=location.search.indexOf('fresh')>=0;
const cached=forceFresh?null:localStorage.getItem(KEY);
if(cached){ try{ startApp(JSON.parse(cached)); }catch(e){ loadFresh(); } } else loadFresh();
function loadFresh(){ fetch('cockpit-data.json?v='+Date.now()).then(r=>r.json()).then(d=>{startApp(d);persist();})
  .catch(e=>{ document.getElementById('app').innerHTML=`<div class="err">⚠️ Daten konnten nicht geladen werden.<br>Bitte über den <b>Link</b> öffnen (nicht per Doppelklick).<br><small>${e}</small></div>`; }); }
Object.assign(window,{goBack,go,goArea,goSys,toggle:clickTask,clickTask,toggleEdit,addArea,editArea,delArea,addSys,editSys,delSys,addTask,editTask,delTask,openMenu,closeModal,openIdee,setFirm});
</script>
</body>
</html>
