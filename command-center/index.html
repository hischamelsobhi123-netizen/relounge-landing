<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0e1016" />
<title>Ramy · Command Center</title>
<style>
  :root {
    --bg: #0b0d13;
    --bg-2: #11141d;
    --panel: rgba(255,255,255,0.045);
    --panel-solid: #161a24;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --text: #eef1f7;
    --muted: #8b93a7;
    --muted-2: #5d6478;
    --accent: #7c5cff;
    --accent-2: #2dd4bf;
    --accent-grad: linear-gradient(135deg, #7c5cff 0%, #5b8cff 50%, #2dd4bf 100%);
    --hoch: #ff5d6c;
    --mittel: #ffb340;
    --niedrig: #38d39f;
    --shadow: 0 20px 60px rgba(0,0,0,0.55);
    --radius: 18px;
    font-synthesis: none;
  }
  [data-theme="light"] {
    --bg: #f4f5f9;
    --bg-2: #e9ebf2;
    --panel: rgba(20,24,40,0.035);
    --panel-solid: #ffffff;
    --border: rgba(20,24,40,0.10);
    --border-strong: rgba(20,24,40,0.18);
    --text: #161a24;
    --muted: #5f6678;
    --muted-2: #9aa1b3;
    --shadow: 0 18px 50px rgba(40,50,90,0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
    background:
      radial-gradient(1200px 700px at 12% -8%, rgba(124,92,255,0.20), transparent 55%),
      radial-gradient(1000px 600px at 105% 0%, rgba(45,212,191,0.14), transparent 50%),
      var(--bg);
    color: var(--text);
    min-height: 100%;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    transition: background .4s ease, color .3s ease;
    padding: clamp(16px, 3vw, 40px);
    padding-bottom: 120px;
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header { margin-bottom: 26px; }
  .topline { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:13px; flex:1; min-width: 220px; }
  .logo {
    width: 46px; height: 46px; border-radius: 14px; background: var(--accent-grad);
    display:grid; place-items:center; font-size: 24px; box-shadow: 0 8px 24px rgba(124,92,255,0.45);
    flex-shrink:0;
  }
  .brand h1 { font-size: clamp(20px, 3.4vw, 28px); font-weight: 800; letter-spacing:-0.5px; }
  .brand .sub { color: var(--muted); font-size: 13px; font-weight: 500; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 18px;
    display:grid; place-items:center; transition: .2s; flex-shrink:0;
  }
  .icon-btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }

  /* ---------- Hero / progress ---------- */
  .hero {
    margin-top: 22px; display:flex; gap: 24px; align-items:center; flex-wrap: wrap;
    background: var(--panel); border:1px solid var(--border); border-radius: var(--radius);
    padding: 22px 24px; backdrop-filter: blur(14px); box-shadow: var(--shadow);
  }
  .ring { position: relative; width: 92px; height: 92px; flex-shrink:0; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: var(--border-strong); }
  .ring .val { stroke: url(#grad); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
  .ring .pct { position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-size:20px; }
  .hero-info { flex:1; min-width: 180px; }
  .hero-info .greet { font-size: 18px; font-weight: 700; }
  .hero-info .line { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
  .stats { display:flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    background: var(--panel); border:1px solid var(--border); border-radius: 14px;
    padding: 12px 16px; min-width: 86px;
  }
  .stat b { display:block; font-size: 22px; font-weight: 800; line-height:1; }
  .stat span { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; font-weight:600; }
  .stat.hoch b { color: var(--hoch); }

  /* ---------- Controls ---------- */
  .controls { display:flex; gap: 10px; margin: 24px 0 10px; flex-wrap: wrap; align-items:center; }
  .search {
    flex:1; min-width: 180px; display:flex; align-items:center; gap:8px;
    background: var(--panel); border:1px solid var(--border); border-radius: 12px; padding: 0 14px;
  }
  .search input { background: transparent; border:0; outline:0; color: var(--text); font-size: 14px; padding: 11px 0; width:100%; font-family: inherit; }
  .search input::placeholder { color: var(--muted-2); }
  .segment { display:flex; background: var(--panel); border:1px solid var(--border); border-radius: 12px; padding: 4px; gap:3px; }
  .segment button {
    border:0; background: transparent; color: var(--muted); font-size: 13px; font-weight:600;
    padding: 7px 13px; border-radius: 9px; cursor:pointer; transition: .18s; font-family: inherit;
  }
  .segment button.active { background: var(--panel-solid); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.18); }

  /* ---------- Sections ---------- */
  .section { margin-top: 18px; }
  .sec-head {
    display:flex; align-items:center; gap: 11px; cursor: pointer; padding: 8px 4px; user-select:none;
  }
  .sec-head .emoji { font-size: 19px; }
  .sec-head h2 { font-size: 16px; font-weight: 700; letter-spacing:-0.2px; }
  .sec-head .count { color: var(--muted); font-size: 12.5px; font-weight:600; }
  .sec-head .chev { margin-left:auto; color: var(--muted); transition: transform .25s; font-size:13px; }
  .section.collapsed .chev { transform: rotate(-90deg); }
  .sec-bar { height: 4px; border-radius: 4px; background: var(--border-strong); overflow:hidden; margin: 2px 4px 10px; }
  .sec-bar i { display:block; height:100%; background: var(--accent-grad); border-radius:4px; transition: width .5s; }
  .sec-body { display:flex; flex-direction: column; gap: 8px; }
  .section.collapsed .sec-body, .section.collapsed .sec-bar, .section.collapsed .adder { display:none; }

  /* ---------- Task ---------- */
  .task {
    display:flex; align-items:flex-start; gap: 13px; background: var(--panel); border:1px solid var(--border);
    border-radius: 14px; padding: 14px 15px; transition: .18s; position: relative;
    border-left: 3px solid transparent;
  }
  .task:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .task[data-prio="hoch"] { border-left-color: var(--hoch); }
  .task[data-prio="mittel"] { border-left-color: var(--mittel); }
  .task[data-prio="niedrig"] { border-left-color: var(--niedrig); }
  .check {
    width: 23px; height: 23px; border-radius: 50%; border: 2px solid var(--muted-2);
    flex-shrink:0; cursor:pointer; margin-top: 1px; position: relative; transition: .2s;
  }
  .check:hover { border-color: var(--accent); }
  .check::after {
    content:"✓"; position:absolute; inset:0; display:grid; place-items:center; color:#fff;
    font-size: 13px; font-weight: 800; opacity:0; transform: scale(.4); transition: .2s;
  }
  .task.done .check { background: var(--accent-grad); border-color: transparent; }
  .task.done .check::after { opacity:1; transform: scale(1); }
  .t-main { flex:1; min-width:0; }
  .t-title { font-size: 14.5px; font-weight: 600; outline:none; word-wrap: break-word; }
  .task.done .t-title { text-decoration: line-through; color: var(--muted); }
  .t-note { font-size: 12.5px; color: var(--muted); margin-top: 4px; outline:none; }
  .t-note:empty::before { content:"Notiz hinzufügen…"; color: var(--muted-2); }
  .t-meta { display:flex; align-items:center; gap:8px; margin-top: 9px; flex-wrap:wrap; }
  .prio {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; cursor:pointer;
    border:1px solid var(--border-strong); transition:.15s; user-select:none; white-space:nowrap;
  }
  .prio[data-p="hoch"] { color: var(--hoch); background: rgba(255,93,108,.12); border-color: rgba(255,93,108,.3); }
  .prio[data-p="mittel"] { color: var(--mittel); background: rgba(255,179,64,.12); border-color: rgba(255,179,64,.3); }
  .prio[data-p="niedrig"] { color: var(--niedrig); background: rgba(56,211,159,.12); border-color: rgba(56,211,159,.3); }
  .prio:hover { transform: scale(1.05); }
  .del {
    opacity: 0; background: transparent; border:0; color: var(--muted-2); cursor:pointer; font-size: 16px;
    padding: 4px 6px; border-radius: 8px; transition: .15s; flex-shrink:0;
  }
  .task:hover .del { opacity: 1; }
  .del:hover { color: var(--hoch); background: rgba(255,93,108,.1); }

  /* ---------- Adder ---------- */
  .adder { display:flex; gap:8px; margin-top:9px; padding: 0 2px; }
  .adder input {
    flex:1; background: var(--panel); border:1px dashed var(--border-strong); border-radius: 12px;
    padding: 11px 14px; color: var(--text); font-size: 13.5px; outline:none; font-family: inherit;
  }
  .adder input::placeholder { color: var(--muted-2); }
  .adder input:focus { border-style: solid; border-color: var(--accent); }

  /* ---------- New section / footer actions ---------- */
  .foot { margin-top: 30px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .foot button {
    background: var(--panel); border:1px solid var(--border); color: var(--muted); cursor:pointer;
    font-size: 13px; font-weight:600; padding: 10px 16px; border-radius: 12px; transition:.18s; font-family:inherit;
  }
  .foot button:hover { color: var(--text); border-color: var(--border-strong); }
  .foot .primary { background: var(--accent-grad); color:#fff; border-color: transparent; }

  .empty { text-align:center; color: var(--muted-2); padding: 40px 0; font-size: 14px; }

  /* ---------- Confetti ---------- */
  .conf { position: fixed; pointer-events:none; font-size: 18px; z-index: 999; will-change: transform, opacity; }
  @keyframes pop { 0%{ transform: translate(0,0) scale(.4); opacity:1;} 100%{ opacity:0; } }

  .saved-tag { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(40px);
    background: var(--panel-solid); border:1px solid var(--border-strong); color: var(--text);
    padding: 9px 18px; border-radius: 30px; font-size: 13px; font-weight:600; box-shadow: var(--shadow);
    opacity:0; transition:.3s; z-index: 50; }
  .saved-tag.show { opacity:1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

  /* ---------- Feedback-Widget ---------- */
  .fab { position: fixed; right: 22px; bottom: 22px; width: 60px; height: 60px; border-radius: 50%;
    background: var(--accent-grad); color:#fff; border:0; cursor:pointer; font-size:28px; font-weight:800;
    z-index: 60; box-shadow: 0 12px 30px rgba(124,92,255,.5); display:grid; place-items:center; transition:.2s; }
  .fab:hover { transform: translateY(-3px) scale(1.06); }
  .fab span { position: relative; z-index:2; }
  .fab::after { content:""; position:absolute; inset:0; border-radius:50%; animation: fpulse 2.6s infinite; }
  @keyframes fpulse { 0%{box-shadow:0 0 0 0 rgba(124,92,255,.5);} 70%{box-shadow:0 0 0 18px rgba(124,92,255,0);} 100%{box-shadow:0 0 0 0 rgba(124,92,255,0);} }
  .fb-overlay { position: fixed; inset:0; background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
    z-index: 70; display:none; align-items:flex-end; justify-content:flex-end; padding: clamp(14px,3vw,28px); }
  .fb-overlay.open { display:flex; animation: ffade .2s; }
  @keyframes ffade { from{opacity:0;} to{opacity:1;} }
  .fb-panel { width: min(430px, 100%); max-height: 90vh; overflow:auto; background: var(--panel-solid);
    border:1px solid var(--border-strong); border-radius: 20px; box-shadow: var(--shadow); padding: 22px;
    animation: fslide .25s cubic-bezier(.2,.7,.3,1); }
  @keyframes fslide { from{transform: translateY(22px); opacity:0;} to{transform:none; opacity:1;} }
  .fb-head { display:flex; gap:12px; align-items:flex-start; margin-bottom: 14px; }
  .fb-title { font-size: 17px; font-weight: 800; }
  .fb-sub { font-size: 12.5px; color: var(--muted); margin-top:3px; }
  .fb-head .icon-btn { margin-left:auto; width:34px; height:34px; font-size:15px; }
  #fbText { width:100%; min-height: 92px; resize: vertical; background: var(--panel); color: var(--text);
    border:1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-family: inherit; outline:none; }
  #fbText:focus { border-color: var(--accent); }
  .fb-rec { display:flex; align-items:center; gap:12px; margin-top: 12px; }
  .fb-mic { background: var(--panel); border:1px solid var(--border-strong); color: var(--text); cursor:pointer;
    padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight:600; font-family:inherit; transition:.18s; }
  .fb-mic:hover { border-color: var(--accent); }
  .fb-mic.rec { background: rgba(255,93,108,.15); border-color: var(--hoch); color: var(--hoch); }
  .fb-timer { font-size: 13px; color: var(--hoch); font-variant-numeric: tabular-nums; font-weight:600; }
  .fb-send { width:100%; margin-top: 14px; background: var(--accent-grad); color:#fff; border:0; cursor:pointer;
    padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 700; font-family:inherit; transition:.18s; }
  .fb-send:hover { transform: translateY(-1px); }
  .fb-send:disabled { opacity:.55; cursor: default; transform:none; }
  .fb-done { display:none; text-align:center; color: var(--niedrig); font-weight:700; margin-top: 14px; }
  .fb-hint { font-size: 11.5px; color: var(--muted-2); margin-top: 10px; text-align:center; min-height: 14px; }
</style>
</head>
<body>
<svg width="0" height="0"><defs>
  <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7c5cff"/><stop offset="50%" stop-color="#5b8cff"/><stop offset="100%" stop-color="#2dd4bf"/>
  </linearGradient>
</defs></svg>

<div class="wrap">
  <header>
    <div class="topline">
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>Command Center</h1>
          <div class="sub" id="dateLine">—</div>
        </div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Hell / Dunkel">🌙</button>
    </div>

    <div class="hero">
      <div class="ring">
        <svg width="92" height="92">
          <circle class="track" cx="46" cy="46" r="40" fill="none" stroke-width="8"/>
          <circle class="val" id="ring" cx="46" cy="46" r="40" fill="none" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="251.2"/>
        </svg>
        <div class="pct" id="pct">0%</div>
      </div>
      <div class="hero-info">
        <div class="greet" id="greet">Leg los, Ramy 💪</div>
        <div class="line" id="motivate">—</div>
      </div>
      <div class="stats">
        <div class="stat"><b id="sOpen">0</b><span>Offen</span></div>
        <div class="stat"><b id="sDone">0</b><span>Erledigt</span></div>
        <div class="stat hoch"><b id="sHoch">0</b><span>Hoch</span></div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="search">
      🔍 <input id="search" type="text" placeholder="To-dos durchsuchen…" />
    </div>
    <div class="segment" id="filter">
      <button data-f="alle" class="active">Alle</button>
      <button data-f="offen">Offen</button>
      <button data-f="erledigt">Erledigt</button>
    </div>
  </div>

  <div id="board"></div>

  <div class="foot">
    <button class="primary" id="addSection">＋ Neue Liste</button>
    <button id="exportBtn">⬇ Sichern (JSON)</button>
    <button id="importBtn">⬆ Laden</button>
    <button id="resetBtn">↺ Zurücksetzen</button>
  </div>
</div>

<button class="fab" id="fbBtn" title="Verbesserung vorschlagen" aria-label="Verbesserung vorschlagen"><span>?</span></button>
<div class="fb-overlay" id="fbOverlay">
  <div class="fb-panel" role="dialog" aria-label="Verbesserung vorschlagen">
    <div class="fb-head">
      <div>
        <div class="fb-title">💡 Verbesserung vorschlagen</div>
        <div class="fb-sub">Was fehlt oder nervt? Sag's uns – am liebsten als Sprachnachricht.</div>
      </div>
      <button class="icon-btn" id="fbClose" aria-label="Schließen">✕</button>
    </div>
    <textarea id="fbText" placeholder="Kurz tippen … oder unten eine Sprachnachricht aufnehmen."></textarea>
    <div class="fb-rec">
      <button class="fb-mic" id="fbMic">🎤 Aufnehmen</button>
      <span class="fb-timer" id="fbTimer"></span>
    </div>
    <audio id="fbAudio" controls style="display:none; width:100%; margin-top:10px;"></audio>
    <button class="fb-send" id="fbSend">Senden</button>
    <div class="fb-done" id="fbDone">✓ Danke! Dein Vorschlag ist angekommen.</div>
    <div class="fb-hint" id="fbHint"></div>
  </div>
</div>

<div class="saved-tag" id="savedTag">✓ Gespeichert</div>
<input type="file" id="fileInput" accept="application/json" style="display:none" />

<script>
const STORE = "ramy-command-center-v2";
const PRIOS = ["hoch","mittel","niedrig"];
const PRIO_LABEL = { hoch:"🔴 Hoch", mittel:"🟡 Mittel", niedrig:"🟢 Niedrig" };
const PRIO_RANK = { hoch:0, mittel:1, niedrig:2 };

const uid = () => "id" + Math.random().toString(36).slice(2,9) + (performance.now()|0);

const SEED = {
  theme: "dark",
  sections: [
    { id: uid(), emoji:"🎯", name:"Großes Ziel", collapsed:true, tasks:[
      { id:uid(), title:"Digitaler Zwilling beider Firmen + KI-Optimierung", note:"Nordstern (nicht abhaken): Wissen aus den Köpfen (Fragebögen + Sprachnotizen) → Mindmap → KI verbessert Abläufe, Kundenerlebnis, Vertrieb, Finanzen & Menschen.", prio:"niedrig", done:false },
    ]},
    { id: uid(), emoji:"🔥", name:"Fragebögen sammeln", collapsed:false, tasks:[
      { id:uid(), title:"Hischam – Fragebogen 1 erhalten", note:"Liegt vor. Noch bei Claude einpflegen.", prio:"niedrig", done:true },
      { id:uid(), title:"Alex – Fragebogen erhalten", note:"Liegt vor.", prio:"niedrig", done:true },
      { id:uid(), title:"Emine – Fragebogen anfordern", note:"", prio:"hoch", done:false },
      { id:uid(), title:"Patricia – Fragebogen anfordern", note:"", prio:"hoch", done:false },
      { id:uid(), title:"Vincent – Fragebogen anfordern", note:"", prio:"hoch", done:false },
      { id:uid(), title:"Fragebögen bei Claude einpflegen", note:"Sobald gesammelt → Kundenservice & System bauen.", prio:"mittel", done:false },
    ]},
    { id: uid(), emoji:"🤖", name:"Was wir bauen", collapsed:false, tasks:[
      { id:uid(), title:"Command Center (To-do-Tool) – live", note:"Diese Seite 😎", prio:"niedrig", done:true },
      { id:uid(), title:"Feedback-Knopf (Sprachnachricht)", note:"Unten rechts.", prio:"niedrig", done:true },
      { id:uid(), title:"Feedback-Backend (Telegram)", note:"Audio → Transkript → Team. Herzstück des Verbesserungs-Loops.", prio:"hoch", done:false },
      { id:uid(), title:"Monitoring-Bot", note:"Überwacht alle anderen Bots.", prio:"mittel", done:false },
      { id:uid(), title:"KI-Erinnerung aufs Handy (ohne Kalender)", note:"Konzept klären – Telegram-Push statt Kalender.", prio:"mittel", done:false },
      { id:uid(), title:"Rückgängig-Knopf (bewusst später)", note:"Wird fürs Mitarbeiter-Tutorial gebraucht – absichtlich noch nicht drin.", prio:"niedrig", done:false },
      { id:uid(), title:"Profile + Login + Server-Speicher", note:"Erst beim Team-Rollout.", prio:"niedrig", done:false },
    ]},
  ]
};

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return structuredClone(SEED);
}
let saveTimer;
function save() {
  localStorage.setItem(STORE, JSON.stringify(state));
  clearTimeout(saveTimer);
  const tag = document.getElementById("savedTag");
  tag.classList.add("show");
  saveTimer = setTimeout(()=> tag.classList.remove("show"), 1100);
}

let filter = "alle";
let query = "";

const board = document.getElementById("board");

function visibleTasks(tasks) {
  return tasks.filter(t => {
    if (filter === "offen" && t.done) return false;
    if (filter === "erledigt" && !t.done) return false;
    if (query) {
      const hay = (t.title + " " + (t.note||"")).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });
}

function render() {
  board.innerHTML = "";
  let anyVisible = false;

  state.sections.forEach(sec => {
    const sorted = [...sec.tasks].sort((a,b) =>
      (a.done - b.done) || (PRIO_RANK[a.prio] - PRIO_RANK[b.prio])
    );
    const vis = visibleTasks(sorted);
    const doneCount = sec.tasks.filter(t=>t.done).length;

    const secEl = document.createElement("div");
    secEl.className = "section" + (sec.collapsed ? " collapsed" : "");

    const head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML = `<span class="emoji">${sec.emoji}</span>
      <h2></h2>
      <span class="count">${doneCount}/${sec.tasks.length}</span>
      <span class="chev">▼</span>`;
    head.querySelector("h2").textContent = sec.name;
    head.onclick = (e) => {
      if (e.target.closest("h2") && e.detail === 2) return;
      sec.collapsed = !sec.collapsed; save(); render();
    };
    head.querySelector("h2").ondblclick = (e) => {
      e.stopPropagation();
      const n = prompt("Listenname:", sec.name);
      if (n && n.trim()) { sec.name = n.trim(); save(); render(); }
    };
    secEl.appendChild(head);

    const bar = document.createElement("div");
    bar.className = "sec-bar";
    const pct = sec.tasks.length ? Math.round(doneCount/sec.tasks.length*100) : 0;
    bar.innerHTML = `<i style="width:${pct}%"></i>`;
    secEl.appendChild(bar);

    const body = document.createElement("div");
    body.className = "sec-body";
    if (vis.length) anyVisible = true;
    vis.forEach(t => body.appendChild(taskEl(sec, t)));
    secEl.appendChild(body);

    const adder = document.createElement("div");
    adder.className = "adder";
    const inp = document.createElement("input");
    inp.placeholder = "＋ Neue Aufgabe… (Enter)";
    inp.onkeydown = (e) => {
      if (e.key === "Enter" && inp.value.trim()) {
        sec.tasks.push({ id:uid(), title: inp.value.trim(), note:"", prio:"mittel", done:false });
        inp.value = ""; save(); render();
        requestAnimationFrame(()=> {
          const sameSec = [...board.querySelectorAll(".section")].find(s => s.contains(s));
        });
      }
    };
    adder.appendChild(inp);
    secEl.appendChild(adder);

    board.appendChild(secEl);
  });

  if (!anyVisible) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = filter === "erledigt" ? "Noch nichts erledigt – das ändern wir gleich 😏"
      : query ? "Nichts gefunden."
      : "Alles erledigt – stark! 🎉";
    board.appendChild(e);
  }
  updateHero();
}

function taskEl(sec, t) {
  const el = document.createElement("div");
  el.className = "task" + (t.done ? " done" : "");
  el.dataset.prio = t.prio;

  const check = document.createElement("div");
  check.className = "check";
  check.title = "Abhaken";
  check.onclick = () => {
    t.done = !t.done;
    if (t.done) confetti(check);
    save(); render();
  };
  el.appendChild(check);

  const main = document.createElement("div");
  main.className = "t-main";

  const title = document.createElement("div");
  title.className = "t-title";
  title.contentEditable = "true";
  title.spellcheck = false;
  title.textContent = t.title;
  title.onblur = () => { const v = title.textContent.trim(); if (v) { t.title = v; save(); } else { title.textContent = t.title; } };
  title.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); title.blur(); } };
  main.appendChild(title);

  const note = document.createElement("div");
  note.className = "t-note";
  note.contentEditable = "true";
  note.spellcheck = false;
  note.textContent = t.note || "";
  note.onblur = () => { t.note = note.textContent.trim(); save(); };
  main.appendChild(note);

  const meta = document.createElement("div");
  meta.className = "t-meta";
  const prio = document.createElement("span");
  prio.className = "prio";
  prio.dataset.p = t.prio;
  prio.textContent = PRIO_LABEL[t.prio];
  prio.title = "Klicken zum Wechseln";
  prio.onclick = () => {
    const i = PRIOS.indexOf(t.prio);
    t.prio = PRIOS[(i+1) % PRIOS.length];
    save(); render();
  };
  meta.appendChild(prio);
  main.appendChild(meta);

  el.appendChild(main);

  const del = document.createElement("button");
  del.className = "del";
  del.innerHTML = "🗑";
  del.title = "Löschen";
  del.onclick = () => {
    if (confirm("Diese Aufgabe löschen?")) {
      sec.tasks = sec.tasks.filter(x => x.id !== t.id);
      save(); render();
    }
  };
  el.appendChild(del);

  return el;
}

function updateHero() {
  const all = state.sections.flatMap(s => s.tasks);
  const done = all.filter(t=>t.done).length;
  const open = all.length - done;
  const hoch = all.filter(t=>!t.done && t.prio==="hoch").length;
  const pct = all.length ? Math.round(done/all.length*100) : 0;

  document.getElementById("sOpen").textContent = open;
  document.getElementById("sDone").textContent = done;
  document.getElementById("sHoch").textContent = hoch;
  document.getElementById("pct").textContent = pct + "%";

  const C = 251.2;
  document.getElementById("ring").style.strokeDashoffset = C - (C * pct/100);

  const greet = document.getElementById("greet");
  const motiv = document.getElementById("motivate");
  if (open === 0 && all.length) { greet.textContent = "Alles erledigt! 🏆"; motiv.textContent = "Brutal stark. Genieß den Moment."; }
  else if (hoch > 0) { greet.textContent = `${hoch} heiße Aufgabe${hoch>1?"n":""} 🔥`; motiv.textContent = "Zieh die hohen Prioritäten zuerst – dann läuft der Rest."; }
  else { greet.textContent = "Auf geht's, Ramy 💪"; motiv.textContent = `Noch ${open} offen · ${pct}% geschafft. Weiter so.`; }
}

/* ---------- Confetti ---------- */
function confetti(anchor) {
  const r = anchor.getBoundingClientRect();
  const emojis = ["🎉","✨","⭐","💪","🔥","✅"];
  for (let i=0;i<10;i++){
    const p = document.createElement("div");
    p.className = "conf";
    p.textContent = emojis[(Math.random()*emojis.length)|0];
    p.style.left = (r.left + r.width/2) + "px";
    p.style.top = (r.top + r.height/2) + "px";
    const dx = (Math.random()-0.5)*220, dy = -(Math.random()*180+60);
    const rot = (Math.random()-0.5)*120;
    p.animate([
      { transform:"translate(0,0) rotate(0) scale(.5)", opacity:1 },
      { transform:`translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(1.1)`, opacity:0 }
    ], { duration: 850 + Math.random()*350, easing:"cubic-bezier(.2,.6,.3,1)" });
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1300);
  }
}

/* ---------- Controls ---------- */
document.getElementById("filter").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  [...e.currentTarget.children].forEach(c => c.classList.toggle("active", c===b));
  render();
};
document.getElementById("search").oninput = (e) => { query = e.target.value.trim().toLowerCase(); render(); };

document.getElementById("addSection").onclick = () => {
  const name = prompt("Name der neuen Liste:", "");
  if (name && name.trim()) {
    state.sections.push({ id:uid(), emoji:"📌", name:name.trim(), collapsed:false, tasks:[] });
    save(); render();
  }
};

document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "command-center-backup.json";
  a.click();
};
document.getElementById("importBtn").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { state = JSON.parse(rd.result); applyTheme(); save(); render(); } catch(err){ alert("Datei konnte nicht gelesen werden."); } };
  rd.readAsText(f);
};
document.getElementById("resetBtn").onclick = () => {
  if (confirm("Alles auf die Start-To-dos zurücksetzen? Deine Änderungen gehen verloren.")) {
    state = structuredClone(SEED); applyTheme(); save(); render();
  }
};

/* ---------- Theme ---------- */
function applyTheme() {
  document.documentElement.dataset.theme = state.theme === "light" ? "light" : "";
  document.getElementById("themeBtn").textContent = state.theme === "light" ? "☀️" : "🌙";
}
document.getElementById("themeBtn").onclick = () => {
  state.theme = state.theme === "light" ? "dark" : "light";
  applyTheme(); save();
};

/* ---------- Date ---------- */
function setDate() {
  const d = new Date();
  const opt = { weekday:"long", day:"numeric", month:"long", year:"numeric" };
  document.getElementById("dateLine").textContent = d.toLocaleDateString("de-DE", opt);
}

setDate();
applyTheme();
render();
</script>

<script>
/* ---------- Feedback-Widget ---------- */
(function(){
  // Endpoint später eintragen (z.B. URL des Bot-/Server-Endpoints). Leer = lokal speichern.
  const FEEDBACK_ENDPOINT = "";
  const FB_STORE = "ramy-cc-feedback";
  const $ = id => document.getElementById(id);
  const overlay = $("fbOverlay");
  let rec = null, chunks = [], audioBlob = null, secs = 0, timer = null;

  function openFb(){ overlay.classList.add("open"); $("fbText").focus(); }
  function closeFb(){ overlay.classList.remove("open"); stopRec(true); }
  $("fbBtn").onclick = openFb;
  $("fbClose").onclick = closeFb;
  overlay.onclick = e => { if (e.target === overlay) closeFb(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("open")) closeFb(); });

  $("fbMic").onclick = async () => {
    if (rec && rec.state === "recording") { stopRec(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      rec = new MediaRecorder(stream); chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => {
        audioBlob = new Blob(chunks, { type: "audio/webm" });
        stream.getTracks().forEach(t => t.stop());
        const a = $("fbAudio"); a.src = URL.createObjectURL(audioBlob); a.style.display = "block";
      };
      rec.start(); secs = 0;
      $("fbMic").classList.add("rec"); $("fbMic").textContent = "⏹ Stop";
      $("fbTimer").textContent = "● 00:00";
      timer = setInterval(() => {
        secs++;
        $("fbTimer").textContent = "● " + String((secs/60|0)).padStart(2,"0") + ":" + String(secs%60).padStart(2,"0");
      }, 1000);
    } catch (err) {
      $("fbHint").textContent = "Mikrofon nicht verfügbar – bitte tippe deinen Vorschlag.";
    }
  };

  function stopRec(silent){
    if (rec && rec.state === "recording") rec.stop();
    clearInterval(timer);
    $("fbMic").classList.remove("rec"); $("fbMic").textContent = "🎤 Aufnehmen";
    if (silent) $("fbTimer").textContent = "";
  }

  $("fbSend").onclick = async () => {
    const text = $("fbText").value.trim();
    if (!text && !audioBlob) { $("fbHint").textContent = "Bitte tippe etwas oder nimm eine Sprachnachricht auf."; return; }
    $("fbSend").disabled = true; $("fbSend").textContent = "Wird gesendet …";
    const meta = { text, hasAudio: !!audioBlob, when: new Date().toISOString(), page: location.href };
    let ok = false;
    if (FEEDBACK_ENDPOINT) {
      try {
        const fd = new FormData();
        fd.append("text", text); fd.append("page", meta.page);
        if (audioBlob) fd.append("audio", audioBlob, "feedback.webm");
        const r = await fetch(FEEDBACK_ENDPOINT, { method: "POST", body: fd });
        ok = r.ok;
      } catch (e) { ok = false; }
    }
    if (!ok) {
      try {
        const list = JSON.parse(localStorage.getItem(FB_STORE) || "[]");
        list.push(meta); localStorage.setItem(FB_STORE, JSON.stringify(list));
      } catch (e) {}
    }
    $("fbSend").style.display = "none"; $("fbDone").style.display = "block"; $("fbHint").textContent = "";
    if (typeof confetti === "function") confetti($("fbDone"));
    setTimeout(() => {
      $("fbText").value = ""; audioBlob = null; chunks = [];
      $("fbAudio").style.display = "none"; $("fbAudio").removeAttribute("src");
      $("fbTimer").textContent = "";
      $("fbSend").style.display = "block"; $("fbSend").disabled = false; $("fbSend").textContent = "Senden";
      $("fbDone").style.display = "none";
      closeFb();
    }, 1900);
  };
})();
</script>
