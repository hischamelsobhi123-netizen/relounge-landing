hirn': Wissen aus Köpfen wird über Fragebögen, Sprachnotizen und Bots automatisch in die Mindmap geschrieben. Darüber liegt eine KI-Schicht, die jeden Bereich messbar verbessert — Abläufe, Vertrieb, Kundenerlebnis, Finanzen. Bild: '200 Ramys gleichzeitig' bei der Auswertung der ganzen Firma. Alles wird hier gebaut, bevor es in die operativen Bereiche integriert wird."}, {"id": "video", "name": "Video-Automatisierung", "icon": "🎬", "img": "", "desc": "Geplantes Projekt · organischer Traffic, fast vollautomatisch", "idee": "DIE GROSSE IDEE: Ein selbst-lernender Content-Kreislauf, der organischen Traffic für die Workshops bringt — fast vollautomatisch, mit nur 3 menschlichen Checks.\n\nSO LÄUFT DER KREISLAUF:\n1) DATEN-GEHIRN sammelt laufend, was zieht: Workshop-Auswertungen, die best-laufenden Facebook-Ads, die viralen Hooks der Branche (Konkurrenz-Accounts via Apify) und die eigene Video-Performance.\n2) Daraus leitet die KI die besten Content-Ideen ab. Ramy gibt nur die RICHTUNG vor (z.B. Serie 'Eine Minute Medizin'), die KI baut das Script (Hook + Inhalt + Call-to-Action).\n3) Hischam dreht das Video nach Script ab und lädt das Rohvideo an einen festen Ort.\n4) Die KI (Reap) schneidet automatisch: Hook vorne, deutsche Untertitel, mehrere Varianten.\n5) Ein Mensch überfliegt nur die markierten Aussprache-Stellen (Schwachstelle der Automatik bei Fachbegriffen).\n6) Das geprüfte Video geht per 1 Freigabe-Klick automatisch auf alle Plattformen (Insta, TikTok, YouTube, FB).\n7) Die Performance fließt zurück ins Daten-Gehirn — die KI lernt, was zieht, die nächsten Ideen werden besser.\n\nZIEL: Den teuren Cutter (~5.000 €/Monat) zum Großteil ersetzen. Nur 2-3 Hero-Ads beim Cutter, der Rest über die Maschine.\n\nTOOLS: Reap (Auto-Schnitt, steuerbar über Schnittstelle) · Creatify (viele Ad-Varianten) · Apify + n8n (Daten ziehen + Klebstoff) · Whisper (Transkripte, schon vorhanden).\n\nDIE NUR 3 MENSCH-CHECKS: 1) Script-Freigabe · 2) Aussprache-Check · 3) Upload-Freigabe. So wenig wie möglich, Qualität hoch.\n\n❓ NOCH VON RAMY ZU KLÄREN: Wohin genau lädt Hischam die Rohvideos (Drive-Ordner)? · Wer macht den Aussprache-Check (Cutter/Team)? · Welche Serie/Format zuerst? · Welcher Upload-Planer (Metricool/Buffer)?", "systems": [{"name": "1 · Daten-Gehirn (was drehen?)", "idee": "Die KI weiß aus allen Daten, was funktioniert, und schlägt die besten Content-Ideen vor. Quellen: Workshop-Auswertungen, FB-Top-Performer, virale Hooks der Branche (Apify zieht Konkurrenz-Videos, Whisper transkribiert), eigene Performance. Schnittstelle: Apify + n8n (entschieden).", "tasks": [{"t": "Schnittstelle entschieden: Apify + n8n", "done": true, "idee": "Apify ist ein Service, der Videos und Metadaten (Views, Likes, Captions, Hashtags) von Instagram, TikTok und Co. automatisch abruft — legal über offizielle Wege, ca. 0,30 $ pro 1.000 TikToks. n8n (das Team nutzt es schon) verbindet Apify mit der restlichen Pipeline. Entscheidung gefallen: kein manuelles Suchen mehr, die Maschine zieht die Daten selbst."}, {"t": "Branchen-Accounts kartiert (Bahmann, van den Boom, Easylife, DAA, Quantum Leap)", "done": true, "idee": "Die wichtigsten Konkurrenz- und Vorbilder in der Nische (Abnehmen / Stoffwechsel / Hormone, Frauen 40+) sind identifiziert und dokumentiert. Jan Bahmann = Blaupause (40-köpfiges Team, 4.600+ Frauen, fast identisches Modell). Aktive Werber (live in Meta-Werbebibliothek): van den Boom, Easylife (177 aktive Anzeigen), DAA Weiden, Quantum Leap. Details: outputs/branchen-accounts-tracking.md. Diese Accounts werden die erste Datenquelle für Apify."}, {"t": "Konkurrenz tief analysiert (4 Player, Hook-Muster)", "done": true, "idee": "Tiefe Analyse der 4 aktivsten Werber + ~10 Coaches ergab klare Muster: ALLE nutzen einen kostenlosen Quiz/Test als Lead-Magnet, Video-Ads dominieren überall, Einzeltestimonials als eigene Anzeigen, stärkste Hooks: Wechseljahre/Menopause + 'Bauchfett ab 40', Verknappung/Deadline treibt Anmeldungen. Wichtigstes Ergebnis: fast niemand in der Nische ist ein echter Arzt — das ist Hischams unbesetzte Position. Details: outputs/branchen-accounts-tracking.md + outputs/konkurrenz-deepdive.md."}, {"t": "Apify-Konto anlegen + API-Token", "done": false, "idee": "Apify braucht ein eigenes Konto (apify.com), damit die Maschine loslegen kann. Nach der Anmeldung gibt es einen API-Token — dieser kommt in n8n als 'Credential', sodass n8n jederzeit automatisch Daten ziehen kann. Einmaliger Schritt, dann läuft alles selbst."}, {"t": "Branchen-Videos ziehen → per Whisper transkribieren", "done": false, "idee": "Apify zieht die Top-Videos der kartierten Branchen-Accounts (Views, Caption, Hashtag). Whisper (das Transkriptions-Tool ist schon lokal gebaut) wandelt die Audio-Spur in Text um. Ergebnis: eine Sammlung von echten, bewährten Hooks und Skripten aus der Nische — als Rohmaterial für die KI-Analyse."}, {"t": "KI analysiert Hooks → konkrete Content-Ideen", "done": false, "idee": "Claude liest die transkribierten Videos und erkennt Muster: welche Hooks die meisten Views bekommen, welche Einstiegssätze bei Frauen 40+ funktionieren, welche Themen gerade viral gehen. Daraus entstehen konkrete Content-Vorschläge für @einfacharzt und @hischamelsobhi — immer mit Hischams Arzt-Vorteil als Unterschied zur Konkurrenz (echte Laborwerte, medizinische Autorität)."}, {"t": "Eigene Accounts anbinden (@einfacharzt, @hischamelsobhi)", "done": false, "idee": "Die eigenen Accounts werden auf zwei Wegen eingebunden: (1) Performance rein — Views, Likes, Reichweite der eigenen Videos fließen ins Daten-Gehirn, damit die KI auch aus eigenen Erfolgen lernt. (2) Upload raus — fertige Videos gehen über den Upload-Planer (Metricool/Buffer) direkt auf diese Accounts. Voraussetzung: Instagram muss ein Business- oder Creator-Account sein, sonst blockiert die API den automatischen Upload."}]}, {"name": "2 · Idee → Script", "idee": "Ramy gibt die Richtung/Serie vor, die KI baut daraus schaltfertige Scripts (Hook + Inhalt + CTA zur Landingpage). Mensch-Check 1: Script-Freigabe vor dem Dreh.", "tasks": [{"t": "Format/Serie festlegen (z.B. 'Eine Minute Medizin')", "pct": 40, "idee": "Ramy denkt in Serien und Formaten — nicht in Einzelvideos. 'Eine Minute Medizin' ist das Leitformat: kurze Aufklärungsvideos (ca. 60 Sek.), die ein konkretes medizinisches Thema verständlich erklären und am Ende auf den Workshop/die Landingpage führen. Format einmal festlegen (Länge, Stil, Hook-Struktur, CTA), dann kann Claude auf Vorrat viele Scripts bauen. Stand 40% — Idee klar, finale Entscheidung noch offen."}, {"t": "KI schreibt schaltfertiges Script (Hook + Inhalt + CTA)", "done": false, "idee": "Claude bekommt das Format, das Thema und die aktuellen Top-Hooks aus dem Daten-Gehirn — und schreibt ein komplettes Script: der erste Satz (Hook, entscheidet ob jemand weiterschaut), der Inhalt (kurz, medizinisch korrekt, kein Fachjargon), der Call-to-Action am Ende (z.B. 'Kostenloses Stoffwechsel-Quiz im Link'). Hischam bekommt das Script fertig — er muss nur noch ablesen und abdrehen."}, {"t": "✅ Check 1: Script-Freigabe durch Ramy/Hischam", "done": false, "idee": "Vor dem Dreh liest Ramy oder Hischam das Script einmal durch — ca. 2 Minuten. Ziel: sicherstellen, dass der Ton stimmt, keine problematischen Aussagen (HWG, Heilversprechen) drin sind und Hischam den Inhalt auch wirklich so vertreten kann. Das ist der erste der nur 3 menschlichen Eingriffe im gesamten Kreislauf."}]}, {"name": "3 · Produktion (drehen)", "idee": "Hischam soll nur noch abdrehen müssen. Rohvideo landet an einem festen Ort, von wo die KI es automatisch zieht.", "tasks": [{"t": "Hischam dreht nach Script ab", "done": false, "idee": "Hischam öffnet das fertige Script (z.B. in einer Notiz-App oder ausgedruckt), stellt sich vor die Kamera und dreht. Mehr braucht er nicht zu tun — kein Nachdenken über Thema, kein Montieren, kein Hochladen auf viele Plattformen. Das System trägt alles außer dem Drehen selbst."}, {"t": "Rohvideo an festen Ort hochladen ❓ wohin (Drive-Watch-Ordner)", "done": false, "idee": "Damit die Automatik anspringen kann, muss Hischam das Rohvideo an einen festen Ablage-Ort hochladen — ein bestimmter Google-Drive-Ordner (Watch-Ordner). n8n überwacht diesen Ordner und erkennt automatisch, wenn ein neues Video darin landet. Dann startet die nächste Stufe (KI-Schnitt) ohne weiteren manuellen Schritt. Noch zu klären: welcher Drive-Ordner genau, und hat Hischam darauf Zugriff vom Handy aus."}]}, {"name": "4 · KI-Schnitt (Reap)", "idee": "Reap schneidet automatisch: Hook vorne, deutsche Untertitel, mehrere Varianten. n8n erkennt das neue Video im Ordner und startet den Schnitt.", "tasks": [{"t": "Tool gewählt: Reap (Auto-Schnitt) + Creatify (Varianten)", "done": true, "idee": "Reap wurde nach einer frischen Recherche (Stand Juni 2026) als bestes Auto-Schnitt-Tool gewählt — als einziges hat es einen nativen MCP-Server + API + Webhooks, kann also direkt von n8n oder Claude angesteuert werden. Ergebnis: Rohvideo rein, fertig geschnittene Clips raus, ohne Handarbeit. Creatify ergänzt für Varianten-Testing (50+ Ad-Varianten/Woche für A/B-Tests). Teurer Cutter bleibt nur für 2–3 Hero-Ads. Details: outputs/ki-video-schnitt-toolauswahl.md."}, {"t": "Reap-Konto + erster Test mit echtem Rohvideo", "done": false, "idee": "Reap kostet ab 9,99 $/Monat und bietet eine Gratis-Stunde zum Testen. Der erste Schritt ist praktisch: ein echtes Rohvideo von Hischam (bereits freigegeben, kein Patientenmaterial) in Reap hochladen und prüfen, was rauskommt. Schneidet Reap sinnvolle Clips? Sind die deutschen Untertitel lesbar und korrekt? Wie sieht der automatische Hook-Schnitt aus? Erst wenn dieser Test zufriedenstellend ist, lohnt sich die Automatisierung drumherum."}, {"t": "Deutsche Untertitel-Qualität prüfen", "done": false, "idee": "Reap unterstützt laut Benchmark 98 Sprachen für Untertitel. Aber: bei medizinischen Fachbegriffen auf Deutsch (z.B. 'Schilddrüsenunterfunktion', 'Metabolismus', 'Cortisol') kann die Automatik Fehler machen — falsch geschrieben oder falsch erkannt. Dieser Test prüft konkret, wie gut die deutschen Untertitel bei Hischams Vokabular sind. Das Ergebnis entscheidet auch, wie umfangreich der Aussprache-Check in Stufe 5 sein muss."}, {"t": "n8n-Flow: neues Video → Reap → fertig", "done": false, "idee": "Das ist der Herzstück-Schritt der ganzen Automatik: n8n überwacht den Drive-Watch-Ordner. Sobald Hischam ein neues Rohvideo hochlädt, schickt n8n es automatisch an Reap (über die API/Webhook). Reap schneidet und gibt die fertigen Clips zurück. Alles ohne, dass jemand etwas anklicken muss. n8n wird im Team schon genutzt — dieser Flow ist eine neue, geführte Verbindung."}]}, {"name": "5 · Aussprache-Check (1 Mensch)", "idee": "Die einzige echte Schwachstelle der Automatik: Fehl-Aussprache von Fachbegriffen. Die KI markiert kritische Stellen über die Auto-Untertitel, ein Mensch überfliegt nur diese — spart ~90 % der Zeit.", "tasks": [{"t": "✅ Check 2: Mensch überfliegt markierte Aussprache-Stellen", "done": false, "idee": "Reap erzeugt automatisch Untertitel — die zeigen wortwörtlich, was gesagt (und erkannt) wurde. Stellen, wo das Transkript auffällig klingt (unbekannte Wörter, Zahlen, Fremdwörter), werden markiert. Der Mensch schaut nur diese markierten Stellen an — nicht das ganze Video. Das spart ca. 90 % der normalen Prüf-Zeit und schützt trotzdem vor peinlichen Aussprache-Fehlern in medizinischen Videos, die öffentlich gehen."}, {"t": "Wer macht den Check ❓ (Cutter/Team)", "done": false, "idee": "Noch offen: wer im Team übernimmt den kurzen Aussprache-Check? Option A: der externe Cutter (der eh medizinisches Vokabular kennt). Option B: Emine oder Patricia (nach kurzer Einweisung auf was zu achten ist). Option C: Ramy selbst (schnell, da nur markierte Stellen). Diese Entscheidung bestimmt, wie viel der Cutter noch gebraucht wird und wer in den Ablauf eingebunden werden muss."}]}, {"name": "6 · Auto-Verteilung", "idee": "Geprüftes Video geht über einen Upload-Planer auf alle Plattformen. 1 Freigabe-Klick statt Voll-Autopilot (schützt vor Fehlern/Sperren).", "tasks": [{"t": "Upload-Planer anbinden ❓ (Metricool/Buffer)", "done": false, "idee": "Ein Upload-Planer (z.B. Metricool oder Buffer) nimmt das fertige Video entgegen und kennt die optimalen Posting-Zeiten pro Plattform. Er verbindet sich über offizielle APIs mit Instagram, TikTok, YouTube und Facebook — so müssen keine Passwörter geteilt werden und die Konten bleiben sicher. Noch zu entscheiden: Metricool (stärker für DACH-Markt, integrierte Analytics) oder Buffer (einfacher, günstiger). Beide haben einen 1-Klick-Freigabe-Schritt."}, {"t": "Auto-Upload Insta / TikTok / YouTube / FB", "done": false, "idee": "Nach der Freigabe geht das Video automatisch auf alle vier Plattformen gleichzeitig — mit dem passenden Format (Seitenverhältnis, Länge) und dem vorbereiteten Caption + Hashtags. Ohne Planer müsste man das vier Mal manuell machen. Mit Planer: einmal freigeben, viermal live. Das ist der eigentliche Multiplikator der ganzen Pipeline."}, {"t": "✅ Check 3: 1 Freigabe-Klick", "done": false, "idee": "Der letzte menschliche Eingriff im Kreislauf: Ramy oder Hischam sehen das fertig geschnittene, untertitelte Video mit Caption — und klicken einmal 'Freigeben'. Danach geht es auf alle Plattformen. Kein Voll-Autopilot, weil das bei Medizin-Content zu riskant wäre (Plattform-Sperren, falsche Aussagen, HWG-Verstöße). Aber: nur ein einziger Klick — nicht mehr."}]}, {"name": "7 · Rückkopplung (Kreislauf)", "idee": "Der Kreis schließt sich: Performance der Videos fließt zurück ins Daten-Gehirn. Gewinner-Hooks werden zur Basis für die nächsten Scripts — mit jedem Durchlauf besser.", "tasks": [{"t": "Performance-Daten zurück ins Daten-Gehirn", "done": false, "idee": "Nach dem Upload zieht Apify (oder der Upload-Planer direkt) die Performance-Zahlen: Views, Watch-Time, Likes, Kommentare, Shares. Diese Zahlen fließen automatisch in die gleiche Datenbank zurück, aus der die Content-Ideen entstehen. Ergebnis: das System weiß bald, welche Themen, Hooks und Formate bei Hischams Zielgruppe wirklich ziehen — nicht geraten, sondern gemessen."}, {"t": "Gewinner-Hooks → nächste Scripts", "done": false, "idee": "Claude liest die Performance-Daten und erkennt: welche Hooks haben die meisten Menschen dazu gebracht, weiterzuschauen? Diese Muster werden direkt in die nächste Script-Runde eingebaut. Ein Hook der einmal 100k Views brachte, wird zur Vorlage für die nächsten Videos. So verbessert sich die Qualität der Scripts von Durchlauf zu Durchlauf — ohne dass Ramy oder Hischam das aktiv steuern müssen."}]}], "firm": "zentrum"}, {"id": "command", "name": "Command Center (Team)", "icon": "✅", "img": "", "desc": "Team-Rollout der To-do-App", "systems": [{"name": "Rollout", "tasks": [{"t": "App gebaut & live", "done": true, "idee": "Die To-do-Web-App ist fertig gebaut und live auf GitHub Pages. Luxus-Optik (dunkles Design, Konfetti-Effekte bei Abhaken für Dopamin/Belohnungs-Effekt), Aufgaben anlegen/abhaken, Bereiche organisieren. Kein App-Store nötig — als Link am Handy-Homescreen speicherbar."}, {"t": "Feedback-Knopf + Sprachnachricht", "done": true, "idee": "Der wichtigste Baustein für den Verbesserungs-Loop: ein Feedback-Knopf in der App, der eine Sprachnachricht aufnimmt. Warum Sprache? Mitarbeiter geben ihr Wissen nie raus, wenn sie tippen müssen. Mit Sprache passiert es von selbst. Die Nachricht wird transkribiert und landet in feedback.md. Nächste Stufe (noch offen): Meldungen kommen automatisch bei Ramy an (Telegram-Push oder Command-Center-Anzeige)."}, {"t": "Mitarbeiter-Accounts + Login", "done": false, "idee": "Damit das Team die App wirklich nutzen kann, braucht jeder seinen eigenen Zugang. Emine, Patricia, Manu, Vincent — jeder sieht nur seine Aufgaben, kann Feedback schicken, bekommt neue Leads zugeteilt. Noch nicht gebaut. Hängt zusammen mit 'Server-Speicher' (Daten müssen zentral gespeichert sein, nicht nur im Browser)."}, {"t": "Lead-Eingang (Leads bei Manu)", "done": false, "idee": "Ziel: Neue Leads (ReLounge, Pelvi, Workshop) landen automatisch auf Manuelas To-do-Liste in der App — sie muss nicht mehr in GHL suchen oder Excel öffnen. Technisch: GHL-Workflow → Webhook → Command-Center-API → neuer Eintrag bei Manu. Braucht zuerst: Mitarbeiter-Accounts + eine API, die Einträge entgegennimmt. Ist eine eigene Bau-Phase. Zwischenlösung bis dahin: GHL benachrichtigt Manu direkt per E-Mail/SMS, kein Lead verloren."}, {"t": "Server-Speicher", "done": false, "idee": "Aktuell speichert die App Daten nur lokal im Browser (localStorage). Für echten Team-Betrieb braucht es einen zentralen Server: Aufgaben sollen für alle sichtbar sein, Leads sollen von außen reinkommen, Feedback soll gespeichert bleiben. Noch nicht ausgearbeitet, welcher Server/Dienst das übernimmt. Noch nicht ausgearbeitet. Gehört dazu: Entscheidung Hosting (eigener Server, Supabase, o. ä.) + Datenschutz (DSGVO, EU-Hosting)."}], "idee": "Die App existiert, aber nur Ramy nutzt sie heute. Der Rollout bedeutet: Mitarbeiter bekommen Zugänge, Leads kommen automatisch rein, und die App hat genug Speicher für echte Nutzung. Strategie für die Einführung: in der ersten Woche jeden Feedback-Vorschlag sofort umsetzen und Rückruf geben ('ist verbessert') — so baut sich Vertrauen auf und das Team liefert dauerhaft die besten Ideen. Tutorial-Trick: bewusst einen 'Fehler' (fehlendes Rückgängig) zeigen und vormachen, wie man per Feedback-Knopf eine Verbesserung anfordert."}], "firm": "zentrum", "idee": "Das Command Center ist eine Luxus-To-do-Web-App, die Ramy für sein Team gebaut hat. Grundprinzip: Mitarbeiter verbessern Dinge, wenn es IHRE Arbeit leichter macht — deshalb ist der Feedback-Knopf (Sprachnachricht statt Tippen) das Herzstück. Die App ist fertig und live auf GitHub Pages. Der nächste Schritt ist der Team-Rollout: Mitarbeiter-Accounts, Login und die Verbindung zu echten Leads (Manuelas To-do bekommt neue Leads automatisch). Langfristig: alle eingehenden Leads aus GHL, WhatsApp und anderen Quellen landen direkt in der App, sodass kein Lead verloren geht."}, {"id": "service", "name": "Kundenservice & Betreuung", "icon": "💬", "img": "", "desc": "Onboarding bis Reklamation", "systems": [{"name": "Betreuung", "tasks": [{"t": "WhatsApp-Kundenservice optimieren", "done": false, "idee": "WhatsApp ist der wichtigste Betreuungskanal (Kunden schreiben dort sowieso). Noch nicht strukturiert: kein einheitliches Antwort-System, keine klare Zuständigkeit. Plan: WhatsApp Business API anbinden (Backlog), Standardantworten vorformulieren, Zuständigkeiten klären (Emine/Patricia für Routine, Hischam nur bei medizinisch kritisch). Ideen-Speicher Backlog #10: 'WhatsApp-Begleitung automatisieren — z. B. Entgiftung Tag 1 Wie geht's dir?'"}, {"t": "Onboarding standardisieren (SOP)", "done": false, "idee": "Noch nicht ausgearbeitet. Gehört dazu: eine schriftliche Schritt-für-Schritt-Anleitung (SOP), was mit jedem neuen Kunden ab Tag 1 passiert — Willkommens-Mail, Zugänge, erste Aufgaben, wann Hischam sich meldet. Verhindert, dass Kunden sich verloren fühlen und gibt dem Team klare Handlungsschritte ohne Rückfragen."}, {"t": "Check-in-Automation (Tag 1/7)", "done": false, "idee": "Automatische Nachrichten an Tag 1 und Tag 7 nach Kauf — 'Wie geht es dir? Hast du die ersten Schritte gemacht?' Technisch über GHL-Workflow oder n8n umsetzbar (gleiche Logik wie ReLounge/Pelvi-Follow-up, der schon gebaut ist). Ziel: kein Kunde bricht still ab, ohne dass jemand es merkt. Ist Voraussetzung für die 'Stille-Kunden-Frühwarnung' (Backlog #1)."}, {"t": "Reklamations-/Kündigungs-Flow", "done": false, "idee": "Noch nicht ausgearbeitet. Gehört dazu: ein klarer Prozess für unzufriedene Kunden und Kündigungsgespräche — wer spricht, was wird angeboten (Pause, Downgrade, Kulanz?), wie wird das dokumentiert. Ohne diesen Flow geht Wissen verloren und Konflikte eskalieren unnötig."}], "idee": "Vier Kern-Bausteine des Betreuungs-Systems: (1) WhatsApp-Kundenservice als Hauptkanal strukturieren und optimieren, (2) Onboarding mit einer festen SOP standardisieren (was passiert am Tag 1 nach Kauf?), (3) automatische Check-in-Sequenz an Tag 1 und Tag 7 (über GHL/n8n), (4) klarer Flow für Reklamationen und Kündigungsgespräche. Alle vier Punkte sind noch offen — hier steckt unerschlossenes Potenzial für Ergebnisse und Retention."}], "firm": "zentrum", "idee": "Wenn Kunden nach dem Kauf schlecht betreut werden, gibt es Rückfälle, Beschwerden und Kündigungen — und kein Upselling. Ziel ist ein standardisierter, zum Teil automatisierter Betreuungsablauf vom ersten Tag nach dem Kauf bis zur Reklamation oder Kündigung. Kernidee: WhatsApp als Hauptkanal nutzen (Kunden schreiben sowieso dort), Onboarding mit festen SOPs absichern, und automatische Check-ins an Tag 1 und 7 sicherstellen — so dass kein Kunde im Rückfall allein bleibt. Noch wenig ausgearbeitet; hier liegt einer der größten Hebel für Kundenbindung und Ergebnisse."}, {"id": "team", "name": "Team & Mitarbeiter", "icon": "👥", "img": "", "desc": "Rollen, Schulung, neue Leute", "systems": [{"name": "Aufstellung", "tasks": [{"t": "Rollen klar (Manu, Emine, Patricia, Vincent)", "done": true, "idee": "Rollen sind verteilt: Manuela = Leads nachfassen und Kundenservice (begrenzte Verfügbarkeit — deshalb Automatik als Rückendeckung), Emine = Closing (bereits eingearbeitet, Zoom-Transkript folgt), Patricia = Closing (noch einzuarbeiten), Vincent = Technik und Portal 2.0. Hischam = Arzt, medizinische Verantwortung + Workshop-Hauptredner."}, {"t": "Schulung neue Systeme", "done": false, "idee": "Das Team muss in alle neu gebauten Systeme eingeführt werden: Command Center (To-do-App), GHL-Workflows, Closing-Methodik, Feedback-Knopf. Strategie aus dem Ideen-Speicher: in der Einführungswoche jeden Vorschlag SOFORT umsetzen + Rückruf 'ist verbessert' → baut Vertrauen. Tutorial-Trick: absichtlich einen 'Fehler' zeigen (z. B. fehlendes Rückgängig) und den Feedback-Knopf benutzen. Noch nicht gestartet."}, {"t": "Neue Vertriebler/Closer holen", "done": false, "idee": "Langfristig soll ein kleines Closer-Team aufgebaut werden (Beratungs-Funnel-Stil nach van den Boom). Aktuell macht Hischam/Ramy viel selbst — das ist die Decke. Plan: externe Closer anstellen oder aufbauen, die nach der dokumentierten Closing-Methodik arbeiten (Gewichts-Flow, Preis-Anker, Hyperfokus-Zuhören). Bis dahin: Emine und Patricia vollständig eingearbeitet."}, {"t": "Motivations-System (ohne Konkurrenz)", "done": false, "idee": "Noch nicht ausgearbeitet. Gehört dazu: ein Anreizsystem, das Mitarbeiter motiviert, ohne sie gegeneinander auszuspielen. Aus dem Ideen-Speicher: Dopamin/Belohnungs-Effekte (wie Konfetti im Command Center) + Egoismus als Motor (Verbesserungsvorschläge machen die eigene Arbeit leichter). Konkrete Form (Boni, Gamification, Anerkennung?) noch zu entscheiden."}, {"t": "Rollen-/Aufgabenmatrix", "done": false, "idee": "Noch nicht ausgearbeitet. Gehört dazu: eine übersichtliche Tabelle oder Dokument, das zeigt — wer ist wofür zuständig, welche Aufgaben hat jede Person täglich/wöchentlich, welche Systeme nutzt sie. Verhindert Reibungsverluste wenn Ramy oder Hischam nicht erreichbar sind, und ist Grundlage für jeden neuen Mitarbeiter-Einarbeitungsprozess."}], "idee": "Die Teamstruktur des Zentrums. Rollen sind verteilt, aber Schulungen und System-Übergabe laufen noch. Ziel: jede Person hat eine klare Rolle mit dokumentierten Aufgaben, ist in ihre Systeme eingearbeitet und weiß, was sie täglich zu tun hat — ohne Rückfragen an Ramy oder Hischam."}], "firm": "zentrum", "idee": "Das Team ist das, was Hischam entlastet und das Geschäft skalierbar macht. Aktuell sind die Rollen bekannt (Manu = Leads/Service, Emine = Closing eingearbeitet, Patricia = Closing noch offen, Vincent = Technik), aber Schulungen, neue Vertriebler und eine saubere Aufgabenmatrix fehlen noch. Wichtigstes Prinzip: Egoismus als Motor nutzen — Mitarbeiter verbessern Dinge, wenn es ihre eigene Arbeit leichter macht. Das Motivations-System wird entsprechend so gebaut, dass es Anreize schafft, ohne Konkurrenz untereinander zu erzeugen."}, {"id": "finanzen", "name": "Finanzen & Tracking", "icon": "📈", "img": "", "desc": "Umsatz messbar machen", "systems": [{"name": "Tracking", "tasks": [{"t": "POS/PayPal-Daten ausgewertet", "done": true, "idee": "Die Grundlage ist gelegt: POS (Kasse) und PayPal-Daten fuer 2025 + Jan–Mai 2026 wurden ausgewertet. Ergebnis: ReLounge = #1-Kassenprodukt (50 % POS-Umsatz 2025 = 21.604 €). Pelvi explodiert (2,4 % in 2025 -> 17,9 % in 2026). Medivitan-Spritze = Volumen-Bringer. WICHTIG: Ueberweisungen sind NICHT in diesen Daten — echter Umsatz ist noch hoeher. Das ist der bisher einzige Bereich mit soliden Zahlen."}, {"t": "Umsatz pro Säule tracken", "done": false, "idee": "Aktuell laesst sich nicht sauber sagen, wie viel Umsatz der Workshop, ReLounge, Pelvi, die Praxis-Leistungen oder Nahrungsergaenzung jeweils einbringen — die Daten sind zu verstreut. Ziel: Pro Umsatz-Saule (Workshop, Geraete, Praxis, spaeter Online-Shop) eine eigene Zahl, die woechentlich oder monatlich aktuell ist. Damit kann Ramy sehen: Welches Standbein waechst? Welches schlaeft? Wo gezielt investieren?"}, {"t": "Potenzial-Analyse (KI)", "done": false, "idee": "Noch nicht ausgearbeitet. Gehoert dazu: Mit den echten Zahlen aus Schritt 1+2 analysiert die KI Szenarien — z.B. 'Wenn wir einen oeffentlichen Geraete-Nachmittag anbieten: wie viele Termine moeglich, welcher Umsatz zu erwarten?' oder 'Lohnt sich ein Online-Shop fuer Nahrungsergaenzung bei diesen Margen und Versandkosten?'. Grundlage: Kapazitaeten (Manuela, Hischam, Geraete), aktuelle Auslastung, Deckungsbeitraege. Erst wenn Schritt 1 und 2 laufen, macht diese Analyse Sinn."}, {"t": "Mit GoHighLevel verbinden", "done": false, "idee": "GHL hat alle Leads, Abschluesse und Zahlungs-Workflows. Wenn GHL mit dem Finanzen-Tracking verbunden ist, fliessen neue Zahlungen automatisch in die Umsatz-Uebersicht ein — kein manuelles Eintragen mehr. Konkret: Zahlungs-Webhook (neue Zahlung in GHL = neue Zeile im Tracking-Sheet oder direkt im Portal 2.0). Haengt zusammen mit dem Infra-Bereich (Zahlungs-Webhook) und Portal 2.0 (Vertriebstabelle). Erst sinnvoll, wenn GHL-Workflows sauber laufen."}], "idee": "Ziel: Ramy sieht jede Woche auf einen Blick, wie viel Umsatz welcher Bereich bringt. Heute ist das nicht moeglich — Daten liegen verteilt in POS, PayPal, GHL und Excel. Die vier Aufgaben hier bauen Schritt fuer Schritt eine gemeinsame Umsatz-Wahrheit auf."}], "firm": "zentrum", "idee": "Ramys Kern-Erkenntnis: Der Workshop ist aktuell das EINZIGE Standbein. Das ist riskant. Finanzen & Tracking hat deshalb zwei Aufgaben: (1) Den jetzt laufenden Umsatz messbar machen — pro Saeule (Workshop, ReLounge, Pelvi, Praxis usw.) — damit klar ist, wo Geld reinkommt und wo Potenzial liegt. (2) Die Basis schaffen fuer spaetere KI-gestuetzte Analyse: Lohnt sich ein Geraete-Nachmittag? Lohnt sich der Online-Shop? Entscheidungen auf Basis echter Zahlen, nicht Bauchgefuehl. Stand heute: POS/PayPal-Daten ausgewertet (ReLounge = #1, Pelvi explodiert). Alles andere steht noch aus."}, {"id": "infra", "name": "Automation & Infrastruktur", "icon": "⚙️", "img": "", "desc": "GHL, n8n, Domains, Sicherheit", "systems": [{"name": "Automation", "tasks": [{"t": "GHL-Workflows (Form→Tag→Mail)", "done": true, "idee": "GoHighLevel-Workflows laufen für ReLounge und Pelvi. Ablauf: Formular wird abgeschickt → Tag wird gesetzt (relounge-lead / pelvi-lead) → Workflow startet → interne Benachrichtigung an Manu + Bestätigungs-Mail an den Lead + 2-Tage-Follow-up. Beide Funnels sind live und getestet. Workflow heißt 'relounge workflow' und deckt beide Produkte ab. Offen: reLounge-Formular muss noch den Tag relounge-lead beim Absenden setzen (sonst startet der Workflow nie)."}, {"t": "n8n als Klebstoff", "done": false, "idee": "n8n ist das Automatisierungs-Tool, das alle anderen Systeme verbindet — der 'Klebstoff'. Geplante Einsatzfälle: neues Video im Drive-Ordner erkennen → Reap-Schnitt starten (Video-Pipeline); GHL-Lead → Command-Center-Eintrag bei Manu; Performance-Daten → Daten-Gehirn (Video-Kreislauf); Apify-Daten ziehen + verarbeiten. Entschieden: n8n ist das Haupt-Automatisierungs-Tool (Team kennt es schon). Noch nicht in Betrieb gesetzt."}, {"t": "Zahlungs-Webhook (auto-zuordnen)", "done": false, "idee": "Noch nicht ausgearbeitet. Gehört dazu: Wenn eine Zahlung eingeht (PayPal, Stripe o. ä.), soll sie automatisch dem richtigen Lead/Produkt in GHL zugeordnet werden — kein manuelles Nachpflegen mehr. Voraussetzung für das spätere Umsatz-Tracking im Cockpit."}, {"t": "Daten-Sync (Excel→GHL/Portal)", "done": false, "idee": "Heute liegen Daten verteilt in Notion, GHL und dem Portal — das ist der größte strukturelle Hebel. Ziel: eine gemeinsame Wahrheit. Konkret: Wenn Ramy oder das Team in Google Sheets / Excel etwas einträgt (z. B. Lead-Status), soll es automatisch in GHL und später im Portal ankommen. Noch nicht ausgearbeitet. Hängt zusammen mit: Vincents Portal 2.0 + n8n als Klebstoff."}], "idee": "Die Automatisierungs-Schicht verbindet alle Systeme. GHL übernimmt die Kundenreise (Lead kommt rein → Tag → Workflow → Mail/SMS/Aufgabe). n8n verbindet GHL mit allem anderen (Google Sheets, Telegram, Reap, Apify). Zahlungs-Webhooks und Daten-Sync sind noch offen — ohne sie müssen Daten noch manuell übertragen werden."}, {"name": "Infrastruktur", "tasks": [{"t": "GitHub Pages (Hosting)", "done": true, "idee": "Alle Webseiten (ReLounge-Landingpage, Pelvi-Landingpage, Command Center, Cockpit, Hischam-Strategie-Seite) laufen auf GitHub Pages — kostenlos, stabil, kein eigener Server nötig. Bilder und Assets werden von dort geladen (fester Link, ändert sich nie). Repo: hischamelsobhi123-netizen/relounge-landing (öffentlich). Claude kann direkt per git push Dateien aktualisieren."}, {"t": "Handy-Zugang (ngrok)", "done": true, "idee": "Die Mindmap läuft lokal auf Ramys PC (localhost). Damit Ramy oder Hischam sie auch vom Handy aus — ohne dasselbe WLAN — öffnen können, läuft ein ngrok-Tunnel. Fester Link: https://liquefy-autograph-saucy.ngrok-free.dev/r4my9x2k7qf3w8tz (ändert sich nicht, weil die Domain im ngrok-Account reserviert ist). Autostart per ngrok-start.bat + Verknüpfung im Windows-Startup-Ordner. Hinweis: beim ersten Öffnen kommt eine ngrok-Zwischenseite → einmal 'Visit Site' tippen."}, {"t": "WhatsApp Business API", "done": false, "idee": "Noch nicht ausgearbeitet. Gehört dazu: Die WhatsApp Business API (Nr. 0162 4213357) soll automatische Nachrichten senden können — z. B. sofortige Bestätigung nach Lead-Eingang, Termin-Erinnerungen, 2-Tage-Follow-up, Begleit-Nachrichten (Tag 1 nach Kauf: 'Wie geht's dir?'). Wird auch für die Begleitung im Gesundheits-Programm gebraucht. Datenschutz und DSGVO-Anforderungen müssen mit Vincent geklärt werden, bevor sie live geht."}, {"t": "Domains sauber (mit Vincent)", "done": false, "idee": "Zwei aktive Domains, die sauber verwaltet sein müssen. hischamelsobhi.de (GHL-Domain): trägt E-Mail + Akademie-Subdomain + Kundenportal — DNS NICHT anfassen ohne Rücksprache, sonst Ausfall-Risiko. hischamelsobhi.com: zeigt auf IONOS, HTTPS kaputt — funktioniert NICHT für GHL, ebenfalls nicht anfassen. Ziel: Pelvi-Seite unter hischamelsobhi.de/pelvi von Vincent veröffentlichen lassen (er kennt das Setup). Für einen garantiert festen Mindmap-Link: eigene Domain über Cloudflare (einmalige Anmeldung durch Ramy)."}], "idee": "Die technische Grundlage, auf der alles läuft. GitHub Pages hostet alle Webseiten kostenlos und stabil. ngrok gibt der lokalen Mindmap einen festen Link von überall. WhatsApp Business API und saubere Domains sind die zwei fehlenden Bausteine vor dem Ads-Launch."}], "firm": "zentrum", "idee": "Alles, was im Hintergrund läuft und die anderen Bereiche zusammenhält. GHL (GoHighLevel) ist das CRM und Funnel-System: Leads kommen rein, Workflows schicken automatisch Mails/SMS/Aufgaben. n8n ist der Klebstoff zwischen allen Tools (GHL, Google Sheets, Telegram, Reap, Apify usw.). GitHub Pages hostet alle Webseiten kostenlos. ngrok macht die lokale Mindmap von überall per Handy erreichbar. WhatsApp Business API und saubere Domains fehlen noch — beides blockiert den finalen Launch der Ads."}]};
let DATA=null, view="home", areaIdx=null, sysIdx=null, taskIdx=null, editMode=false, firmTab="zentrum";
const KEY="cockpit_full_v5";
const FIRMS={zentrum:{name:"Zentrum für Gesundheitsmedizin",icon:"🏢"},praxis:{name:"Praxis El-Sobhi",icon:"🏥"}};
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){} }
const esc=(s)=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Punkt-Typen: Haken (done) · Teil-Fortschritt (pct) · Ausklügeln (q = offener Baustein, zählt als 0) */
function isQ(t){ return t.q===true; }
function hasSteps(t){ return t.steps && t.steps.length>0; }
function tProg(t){ if(isQ(t)) return 0; if(hasSteps(t)) return Math.round(100*t.steps.filter(x=>x.done).length/t.steps.length); return (typeof t.pct==='number') ? t.pct : (t.done?100:0); }
function isPct(t){ return typeof t.pct==='number'; }
function sysPct(s){ if(!s.tasks.length) return 0; return Math.round(s.tasks.reduce((n,t)=>n+tProg(t),0)/s.tasks.length); }
function areaPct(a){ let tot=0,n=0; a.systems.forEach(s=>s.tasks.forEach(t=>{tot+=tProg(t);n++;})); return n?Math.round(tot/n):0; }
function areaCount(a){ let n=0; a.systems.forEach(s=>n+=s.tasks.length); return n; }
function sysDoneCount(s){ return s.tasks.filter(t=>tProg(t)>=100).length; }
function col(p){ return p>=66?'var(--green)':p>=33?'var(--amber)':'var(--red)'; }
function rcol(p){ return p>=66?'#43e08f':p>=33?'#f0b54e':'#ff6b63'; }
function ringSVG(p,size){ const r=15.5,c=2*Math.PI*r,off=c*(1-p/100);
  return `<svg class="ring" viewBox="0 0 36 36" style="width:${size}px;height:${size}px">
    <circle cx="18" cy="18" r="${r}" fill="rgba(10,22,34,.55)" stroke="rgba(255,255,255,.12)" stroke-width="3"/>
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="${rcol(p)}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 18 18)" style="transition:stroke-dashoffset .6s"/>
    <text x="18" y="22" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">${p>=100?'✓':p}</text></svg>`; }
function gring(p){ const r=15.5,c=2*Math.PI*r,off=c*(1-p/100);
  document.getElementById('gring').innerHTML=`<circle cx="18" cy="18" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="${rcol(p)}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 18 18)"/>`; }

/* ---------- Navigation mit Browser-History ---------- */
function applyState(st){ view=st.view; areaIdx=st.areaIdx; sysIdx=st.sysIdx; taskIdx=(st.taskIdx==null?null:st.taskIdx); render(); }
function nav(v,a,s,t){ view=v; areaIdx=(a===undefined?areaIdx:a); sysIdx=(s===undefined?sysIdx:s); taskIdx=(t===undefined?taskIdx:t);
  history.pushState({view,areaIdx,sysIdx,taskIdx},'', '#'+v); window.scrollTo(0,0); render(); }
function go(v){ nav(v,null,null,null); }
function goArea(i){ nav('area',i,null,null); }
function goSys(a,s){ nav('system',a,s,null); }
function goTask(ti){ nav('task',areaIdx,sysIdx,ti); }
function goBack(){ if(view==='home') return; history.back(); }
window.onpopstate=(e)=>{ if(e.state){ applyState(e.state); } else { view='home'; render(); } window.scrollTo(0,0); };
function toggleEdit(){ editMode=!editMode; document.body.classList.toggle('edit',editMode); document.getElementById('editBtn').classList.toggle('act',editMode); render(); }

/* ---------- Modal-Helfer ---------- */
function openOv(){ document.getElementById('ov').classList.add('on'); }
function closeModal(){ document.getElementById('ov').classList.remove('on'); }
document.getElementById('ov').onclick=(e)=>{ if(e.target.id==='ov') closeModal(); };
function modal(title, fields, onSave){
  document.getElementById('dlgTitle').textContent=title;
  const body=document.getElementById('dlgBody'); body.innerHTML='';
  fields.forEach((f,i)=>{ const w=document.createElement('div'); w.className='fld';
    let inp = f.type==='ta'?`<textarea id="f${i}">${esc(f.value)}</textarea>`
            : f.type==='big'?`<textarea id="f${i}" class="big">${esc(f.value)}</textarea>`
            : `<input id="f${i}" value="${esc(f.value)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
    w.innerHTML=`<label>${f.label}</label>`+inp+(f.hint?`<div class="hintsmall">${f.hint}</div>`:''); body.appendChild(w); });
  document.getElementById('dlgFoot').innerHTML=`<button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn prim" id="okBtn">Speichern</button>`;
  document.getElementById('okBtn').onclick=()=>{ const vals=fields.map((f,i)=>document.getElementById('f'+i).value.trim());
    if(fields[0].req!==false && vals[0]===''){ document.getElementById('f0').focus(); return; } closeModal(); onSave(vals); };
  openOv(); setTimeout(()=>{const el=document.getElementById('f0'); if(el){el.focus();}},50);
}
function confirmModal(title,msg,onYes){ document.getElementById('dlgTitle').textContent=title;
  document.getElementById('dlgBody').innerHTML=`<p style="color:var(--mut);font-size:14.5px;padding:6px 0">${esc(msg)}</p>`;
  document.getElementById('dlgFoot').innerHTML=`<button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn danger" id="okBtn">Löschen</button>`;
  document.getElementById('okBtn').onclick=()=>{closeModal();onYes();}; openOv(); }

/* Idee-Dokument anzeigen/bearbeiten */
function openIdee(level){
  const obj = level==='area'?DATA.areas[areaIdx]:(level==='system'?DATA.areas[areaIdx].systems[sysIdx]:DATA.areas[areaIdx].systems[sysIdx].tasks[taskIdx]);
  const txt = obj.idee||'';
  const nm = level==='area'?DATA.areas[areaIdx].name:(level==='system'?DATA.areas[areaIdx].systems[sysIdx].name:obj.t);
  document.getElementById('dlgTitle').textContent='💡 Idee dahinter — '+nm;
  document.getElementById('dlgBody').innerHTML = txt
    ? `<div class="ideeview">${esc(txt)}</div>` : `<p style="color:var(--mut);padding:8px 0">Noch keine ausgearbeitete Idee hinterlegt.</p>`;
  document.getElementById('dlgFoot').innerHTML=`<button class="btn" onclick="closeModal()">Schließen</button><button class="btn prim" id="okBtn">✏️ Bearbeiten</button>`;
  document.getElementById('okBtn').onclick=()=>{ closeModal();
    modal('Idee dahinter bearbeiten',[{label:'Die komplette Idee (wird gespeichert & immer wieder aktualisiert)',value:txt,type:'big',req:false}],
      v=>{ obj.idee=v[0]; persist(); render(); }); };
  openOv();
}
/* %-Steller für Teil-Fortschritt */
function openPct(ti){
  const t=DATA.areas[areaIdx].systems[sysIdx].tasks[ti];
  document.getElementById('dlgTitle').textContent='Fortschritt setzen';
  document.getElementById('dlgBody').innerHTML=`<p style="font-weight:700;font-size:15px;padding:4px 0 2px">${esc(t.t)}</p>
    <div style="display:flex;align-items:center;gap:14px;margin-top:6px"><span id="pv" style="font-size:30px;font-weight:800;color:var(--teal);min-width:74px">${tProg(t)}%</span>
    <input type="range" class="slider" id="pr" min="0" max="100" step="5" value="${tProg(t)}"></div>`;
  document.getElementById('pr').oninput=(e)=>{ document.getElementById('pv').textContent=e.target.value+'%'; };
  document.getElementById('dlgFoot').innerHTML=`<button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn prim" id="okBtn">Speichern</button>`;
  document.getElementById('okBtn').onclick=()=>{ t.pct=parseInt(document.getElementById('pr').value,10); delete t.done; persist(); closeModal(); render(); };
  openOv();
}
function openMenu(){ document.getElementById('dlgTitle').textContent='Menü';
  document.getElementById('dlgBody').innerHTML=`<p style="color:var(--mut);font-size:13.5px;padding:4px 0 8px">Stand: ${esc(DATA.updated||'')} · ${DATA.areas.length} Bereiche</p>`;
  document.getElementById('dlgFoot').innerHTML=`<button class="btn danger" id="rb">Auf Original zurücksetzen</button><button class="btn" onclick="closeModal()">Schließen</button>`;
  document.getElementById('rb').onclick=()=>{closeModal();confirmModal('Zurücksetzen?','Deine Änderungen gehen verloren, Original-Stand wird geladen.',()=>{localStorage.removeItem(KEY);location.reload();});}; openOv(); }

/* ---------- Edit-Aktionen ---------- */
function uid(p){ return p+Math.random().toString(36).slice(2,8); }
function addArea(){ modal('Neuer Bereich',[{label:'Name',value:''},{label:'Symbol (Emoji)',value:'📌'},{label:'Kurzbeschreibung',value:'',type:'ta',req:false}],
  v=>{ DATA.areas.push({id:uid('a'),firm:firmTab,name:v[0],icon:v[1]||'📌',img:'',desc:v[2],idee:'',systems:[]});persist();render(); }); }
function editArea(i,ev){ ev&&ev.stopPropagation(); const a=DATA.areas[i];
  modal('Bereich bearbeiten',[{label:'Name',value:a.name},{label:'Symbol',value:a.icon},{label:'Kurzbeschreibung',value:a.desc||'',type:'ta',req:false}],
  v=>{a.name=v[0];a.icon=v[1]||'📌';a.desc=v[2];persist();render();}); }
function delArea(i,ev){ ev&&ev.stopPropagation(); confirmModal('Bereich löschen?','„'+DATA.areas[i].name+'" mit allem Inhalt wird gelöscht.',()=>{DATA.areas.splice(i,1);persist();if(view!=='home')go('home');else render();}); }
function addSys(){ modal('Neues System',[{label:'Name',value:''}],v=>{DATA.areas[areaIdx].systems.push({name:v[0],idee:'',tasks:[]});persist();render();}); }
function editSys(si,ev){ ev&&ev.stopPropagation(); const s=DATA.areas[areaIdx].systems[si];
  modal('System bearbeiten',[{label:'Name',value:s.name}],v=>{s.name=v[0];persist();render();}); }
function delSys(si,ev){ ev&&ev.stopPropagation(); confirmModal('System löschen?','„'+DATA.areas[areaIdx].systems[si].name+'" wird gelöscht.',()=>{DATA.areas[areaIdx].systems.splice(si,1);persist();if(view==='system')go('area');else render();}); }
function addTask(){ modal('Neuer Punkt',[{label:'Text',value:''},{label:'% (leer = Abhaken · Zahl = Teil-Fortschritt · ? = noch auszuklügeln)',value:'',req:false,ph:'z.B. 40 oder ?'}],
  v=>{ const t={t:v[0]}; const x=(v[1]||'').trim(); if(x==='?'){t.q=true;} else if(x!==''){t.pct=Math.max(0,Math.min(100,parseInt(x,10)||0));} else {t.done=false;} DATA.areas[areaIdx].systems[sysIdx].tasks.push(t);persist();render(); }); }
function editTask(ti,ev){ ev&&ev.stopPropagation(); const t=DATA.areas[areaIdx].systems[sysIdx].tasks[ti];
  modal('Punkt bearbeiten',[{label:'Text',value:t.t},{label:'% (leer=Abhaken · Zahl=% · ?=auszuklügeln)',value:isQ(t)?'?':(isPct(t)?String(t.pct):''),req:false}],
  v=>{ t.t=v[0]; const x=(v[1]||'').trim(); delete t.q; delete t.pct; if(x==='?'){t.q=true;delete t.done;} else if(x!==''){t.pct=Math.max(0,Math.min(100,parseInt(x,10)||0));delete t.done;} else {if(typeof t.done!=='boolean')t.done=false;} persist();render(); }); }
function delTask(ti,ev){ ev&&ev.stopPropagation(); DATA.areas[areaIdx].systems[sysIdx].tasks.splice(ti,1);persist();render(); }
function clickTask(ti){ const t=DATA.areas[areaIdx].systems[sysIdx].tasks[ti]; if(isQ(t)){ editTask(ti); } else if(isPct(t)){ openPct(ti); } else { t.done=!t.done; persist(); render(); } }
function ringClick(ti,ev){ ev&&ev.stopPropagation(); const t=DATA.areas[areaIdx].systems[sysIdx].tasks[ti];
  if(isQ(t)||hasSteps(t)){ goTask(ti); } else if(isPct(t)){ openPct(ti); } else { t.done=!t.done; persist(); render(); } }
function setFirm(f){ firmTab=f; render(); }
function curTask(){ return DATA.areas[areaIdx].systems[sysIdx].tasks[taskIdx]; }
function addStep(){ modal('Neuer Zwischenschritt',[{label:'Text',value:''}], v=>{ const t=curTask(); if(!t.steps)t.steps=[]; if(typeof t.done==='boolean')delete t.done; t.steps.push({t:v[0],done:false}); persist(); render(); }); }
function toggleStep(si){ const t=curTask(); t.steps[si].done=!t.steps[si].done; persist(); render(); }
function editStep(si,ev){ ev&&ev.stopPropagation(); const t=curTask(); modal('Schritt bearbeiten',[{label:'Text',value:t.steps[si].t}], v=>{ t.steps[si].t=v[0]; persist(); render(); }); }
function delStep(si,ev){ ev&&ev.stopPropagation(); const t=curTask(); t.steps.splice(si,1); if(!t.steps.length){delete t.steps;t.done=false;} persist(); render(); }

/* ---------- Render ---------- */
function crumb(){ const c=document.getElementById('crumb');
  document.getElementById('backBtn').classList.toggle('hidden',view==='home');
  if(view==='home'){c.innerHTML='';return;}
  const a=DATA.areas[areaIdx];
  if(view==='area'){ c.innerHTML=`<a onclick="go('home')">Übersicht</a> ▸ <span>${esc(a.icon)} ${esc(a.name)}</span>`; }
  else if(view==='system'){ const s=a.systems[sysIdx]; c.innerHTML=`<a onclick="go('home')">Übersicht</a> ▸ <a onclick="goArea(${areaIdx})">${esc(a.name)}</a> ▸ <span>${esc(s.name)}</span>`; }
  else{ const s=a.systems[sysIdx], t=s.tasks[taskIdx]; c.innerHTML=`<a onclick="goArea(${areaIdx})">${esc(a.name)}</a> ▸ <a onclick="goSys(${areaIdx},${sysIdx})">${esc(s.name)}</a> ▸ <span>${esc((t.t||'').slice(0,22))}</span>`; }
}
function render(){
  const app=document.getElementById('app');
  let tot=0,n=0; DATA.areas.forEach(a=>a.systems.forEach(s=>s.tasks.forEach(t=>{tot+=tProg(t);n++;})));
  const g=n?Math.round(tot/n):0; document.getElementById('gpct').textContent=g+'%'; gring(g); crumb();
  if(view==='home'){
    const firmPct=(f)=>{ let tot=0,n=0; DATA.areas.forEach(a=>{ if((a.firm||'zentrum')!==f)return; a.systems.forEach(s=>s.tasks.forEach(t=>{tot+=tProg(t);n++;})); }); return n?Math.round(tot/n):0; };
    let h=`<div class="hero"><div class="k">Persönliches Cockpit</div><h1>Woran wir gerade bauen</h1></div><div class="tabs">`;
    Object.keys(FIRMS).forEach(f=>{ const fc=DATA.areas.filter(a=>(a.firm||'zentrum')===f).length;
      h+=`<div class="tab ${firmTab===f?'active':''}" onclick="setFirm('${f}')">${FIRMS[f].icon} ${esc(FIRMS[f].name)}<span class="tp">${firmPct(f)}% · ${fc} Bereiche</span></div>`; });
    h+=`</div><div class="grid">`;
    DATA.areas.forEach((a,i)=>{ if((a.firm||'zentrum')!==firmTab) return; const p=areaPct(a);
      const thumb=a.img?`<div class="thumb" style="background-image:url('${a.img}')">${ringSVG(p,50)}</div>`:`<div class="thumb"><div class="ic">${esc(a.icon)}</div>${ringSVG(p,50)}</div>`;
      h+=`<div class="tile" style="animation-delay:${i*0.02}s" onclick="goArea(${i})">
        <div class="editctl"><button class="minibtn" onclick="editArea(${i},event)">✏️</button><button class="minibtn del" onclick="delArea(${i},event)">🗑</button></div>
        ${thumb}<div class="tbody"><h3>${esc(a.name)}</h3><div class="desc">${esc(a.desc||'')}</div>
        <div class="meta"><span>${a.systems.length} Systeme${a.idee?' · 💡':''}</span><span class="pct" style="color:${col(p)}">${p}%</span></div>
        <div class="bar"><div style="width:${p}%;background:${col(p)}"></div></div></div></div>`; });
    h+=`<div class="addtile" onclick="addArea()">➕ Bereich hinzufügen</div></div>`; app.innerHTML=h;
    document.getElementById('foot').textContent=editMode?'':'Oben die zwei Firmen · Bereich antippen → Systeme → Punkte. ✏️ zum Bearbeiten.';
  } else if(view==='area'){
    const a=DATA.areas[areaIdx], p=areaPct(a);
    const vic=a.img?`<div class="vic" style="background-image:url('${a.img}')"></div>`:`<div class="vic">${esc(a.icon)}</div>`;
    let h=`<div class="vhead">${vic}<div><h2>${esc(a.name)}</h2><div class="vd">${esc(a.desc||'')}</div></div>
      <div class="vpct"><div class="n" style="color:${col(p)}">${p}%</div><div class="vd">${areaCount(a)} Punkte</div></div></div>
      <button class="ideebtn" onclick="openIdee('area')">💡 Idee dahinter ${a.idee?'lesen':'hinzufügen'}<span class="arrow">›</span></button>
      <div class="syslist">`;
    a.systems.forEach((s,si)=>{ const sp=sysPct(s);
      h+=`<div class="syscard" style="animation-delay:${si*0.04}s" onclick="goSys(${areaIdx},${si})">
        <div class="editctl" style="position:absolute;top:11px;right:11px;left:auto"><button class="minibtn" onclick="editSys(${si},event)">✏️</button><button class="minibtn del" onclick="delSys(${si},event)">🗑</button></div>
        <div class="sh"><h4>${esc(s.name)}</h4>${ringSVG(sp,46)}</div>
        <div class="bar"><div style="width:${sp}%;background:${col(sp)}"></div></div>
        <div class="done">${sysDoneCount(s)}/${s.tasks.length} fertig · ${sp}%</div></div>`; });
    h+=`</div><div class="addrow" onclick="addSys()">➕ System hinzufügen</div>`; app.innerHTML=h; document.getElementById('foot').textContent='';
  } else if(view==='system') {
    const a=DATA.areas[areaIdx], s=a.systems[sysIdx], sp=sysPct(s);
    let h=`<div class="vhead"><div class="vic">${esc(a.icon)}</div><div><h2>${esc(s.name)}</h2><div class="vd">${esc(a.name)}</div></div>
      <div class="vpct"><div class="n" style="color:${col(sp)}">${sp}%</div><div class="vd">${sysDoneCount(s)}/${s.tasks.length} fertig</div></div></div>
      <button class="ideebtn" onclick="openIdee('system')">💡 Idee dahinter ${s.idee?'lesen':'hinzufügen'}<span class="arrow">›</span></button>
      <div class="tasks">`;
    s.tasks.forEach((t,ti)=>{ const p=tProg(t); let cls='',indHTML='',bodyUI='';
      if(isQ(t)){ cls='q';
        indHTML=`<span class="ind" onclick="ringClick(${ti},event)"><b>?</b></span>`;
        bodyUI=`<div class="body"><label>${esc(t.t)}</label><div class="qlabel">❓ noch auszuklügeln</div></div>`;
      } else if(hasSteps(t)){
        indHTML=`<span class="ind" style="border-color:${col(p)}" onclick="ringClick(${ti},event)"><b style="font-size:10px;color:${col(p)}">${p}</b></span>`;
        bodyUI=`<div class="body"><label>${esc(t.t)}</label><div class="pbar"><div style="width:${p}%;background:${col(p)}"></div></div><div class="pnum" style="color:${col(p)}">${t.steps.filter(x=>x.done).length}/${t.steps.length} Schritte · ${p}%</div></div>`;
      } else if(isPct(t)){
        indHTML=`<span class="ind" style="border-color:${col(p)}" onclick="ringClick(${ti},event)"><b style="font-size:10px;color:${col(p)}">${p}</b></span>`;
        bodyUI=`<div class="body"><label>${esc(t.t)}</label><div class="pbar"><div style="width:${p}%;background:${col(p)}"></div></div><div class="pnum" style="color:${col(p)}">${p}% fertig</div></div>`;
      } else { cls=t.done?'done':'';
        indHTML=`<span class="ind" onclick="ringClick(${ti},event)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#06301c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
        bodyUI=`<div class="body"><label>${esc(t.t)}</label></div>${t.idee?'<span class="ideedot">💡</span>':''}<span class="donebadge">ERLEDIGT</span>`;
      }
      h+=`<div class="task ${cls}" style="animation-delay:${ti*0.03}s" onclick="goTask(${ti})">
        ${indHTML}${bodyUI}<span class="tarrow">›</span>
        <span class="tctl"><button class="minibtn" onclick="editTask(${ti},event)">✏️</button><button class="minibtn del" onclick="delTask(${ti},event)">🗑</button></span></div>`; });
    h+=`</div><div class="addrow" onclick="addTask()">➕ Punkt hinzufügen</div>`; app.innerHTML=h; document.getElementById('foot').textContent='';
  } else {
    const a=DATA.areas[areaIdx], s=a.systems[sysIdx], t=s.tasks[taskIdx], p=tProg(t);
    let h=`<div class="vhead"><div class="vic">${esc(a.icon)}</div><div><h2>${esc(t.t)}</h2><div class="vd">${esc(a.name)} · ${esc(s.name)}</div></div>
      <div class="vpct"><div class="n" style="color:${col(p)}">${isQ(t)?'❓':(p>=100?'✓':p+'%')}</div></div></div>
      <div class="ideeblock"><div class="ih">💡 Idee dahinter <button class="minibtn" onclick="openIdee('task')">✏️</button></div>`;
    h+= t.idee ? `<div class="ideeview">${esc(t.idee)}</div>` : `<div class="ideeempty">Noch keine Ausarbeitung hinterlegt.${editMode?' Tippe auf ✏️.':''}</div>`;
    h+=`</div>`;
    if(hasSteps(t) || editMode){
      h+=`<div class="seclabel">Zwischenschritte ${hasSteps(t)?'· '+p+'% fertig':''}</div><div class="tasks">`;
      (t.steps||[]).forEach((st,si)=>{ h+=`<div class="task ${st.done?'done':''}" onclick="toggleStep(${si})">
        <span class="ind"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#06301c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="body"><label>${esc(st.t)}</label></div><span class="donebadge">OK</span>
        <span class="tctl"><button class="minibtn" onclick="editStep(${si},event)">✏️</button><button class="minibtn del" onclick="delStep(${si},event)">🗑</button></span></div>`; });
      h+=`</div><div class="addrow" onclick="addStep()">➕ Zwischenschritt hinzufügen</div>`;
    }
    app.innerHTML=h; document.getElementById('foot').textContent='';
  }
}
function startApp(d){ DATA=d; if(!DATA.areas)DATA.areas=[]; history.replaceState({view:'home',areaIdx:null,sysIdx:null},'','#home'); render(); }
const forceFresh=location.search.indexOf('fresh')>=0;
const cached=forceFresh?null:localStorage.getItem(KEY);
if(cached){ try{ startApp(JSON.parse(cached)); }catch(e){ bootData(); } } else bootData();
function bootData(){ if(window.COCKPIT_DATA){ startApp(JSON.parse(JSON.stringify(window.COCKPIT_DATA))); persist(); } else { loadFresh(); } }
function loadFresh(){ fetch('cockpit-data.json?v='+Date.now()).then(r=>r.json()).then(d=>{startApp(d);persist();})
  .catch(e=>{ if(window.COCKPIT_DATA){ startApp(JSON.parse(JSON.stringify(window.COCKPIT_DATA))); persist(); } else { document.getElementById('app').innerHTML=`<div class="err">⚠️ Daten konnten nicht geladen werden.<br><small>${e}</small></div>`; } }); }
Object.assign(window,{goBack,go,goArea,goSys,goTask,toggle:clickTask,clickTask,ringClick,toggleEdit,addArea,editArea,delArea,addSys,editSys,delSys,addTask,editTask,delTask,addStep,toggleStep,editStep,delStep,openMenu,closeModal,openIdee,setFirm});
</script>
</body>
