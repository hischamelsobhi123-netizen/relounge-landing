<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projekt-Übersicht — Ramy</title>
<style>
  :root{
    --ink:#1b2330; --soft:#465160; --muted:#7b8694; --line:#e2e7ee;
    --bg:#eef1f5; --paper:#fff; --head:#222834;
    --gold:#c69a32; --gold-soft:#f5e9c8;
    --karim:#2f7dd1; --hisham:#2e9e6b; --closer:#b8762a;
    --st-vorber:#e6a019; --st-laeuft:#2e9e6b; --st-idee:#8a94a2; --st-blockiert:#e0564f; --st-paused:#64748b;

  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55}
  .wrap{max-width:900px;margin:0 auto;padding:26px 18px 80px}
  header.top{text-align:center;margin-bottom:8px}
  header.top h1{font-size:25px;margin:0 0 4px;font-weight:800;letter-spacing:.2px}
  header.top p{color:var(--muted);margin:0;font-size:13.5px}
  .legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px}
  .lg{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;color:#fff}
  .lg.v{background:var(--st-vorber)} .lg.l{background:var(--st-laeuft)} .lg.i{background:var(--st-idee)} .lg.b{background:var(--st-blockiert)} .lg.p{background:var(--st-paused)}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:0;margin:0 0 22px;overflow:hidden}
  .card-top{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fafbfc,#fff)}
  .nr{flex:none;width:40px;height:40px;border-radius:11px;background:var(--head);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
  .card-top h2{font-size:18.5px;margin:0;font-weight:760;flex:1;line-height:1.3}
  .badge{flex:none;font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:999px;color:#fff;white-space:nowrap;margin-top:2px}
  .badge.v{background:var(--st-vorber)} .badge.l{background:var(--st-laeuft)} .badge.i{background:var(--st-idee)} .badge.b{background:var(--st-blockiert)} .badge.p{background:var(--st-paused)}

  .meta{display:flex;flex-wrap:wrap;gap:8px;padding:13px 22px;background:#f7f9fb;border-bottom:1px solid var(--line)}
  .m{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 13px;min-width:90px}
  .m i{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .m b{font-size:13.5px;font-weight:750;margin-top:1px}
  .m.prio b{color:var(--gold)}
  .body{padding:6px 22px 20px}
  .sec{padding:14px 0;border-top:1px solid #eef1f5}
  .sec:first-child{border-top:none}
  .sec h3{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin:0 0 8px;display:flex;align-items:center;gap:7px}
  .sec p{margin:0;color:var(--soft);font-size:14.5px}

  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
  .flow .step{background:#f1f4f8;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--soft)}
  .flow .arr{color:var(--muted);font-weight:800}

  .people{display:flex;flex-direction:column;gap:9px}
  .person{display:flex;align-items:flex-start;gap:11px}
  .ava{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
  .person .pn{font-weight:750;font-size:14.5px}
  .person .pr{color:var(--muted);font-size:13.5px}

  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding:11px 12px 11px 46px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fafbfc;font-size:14px;color:var(--ink)}
  .steps li:before{content:counter(s);position:absolute;left:11px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .steps li b{font-weight:750}
  .steps li small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;font-weight:500}
  .closing-note{margin-top:12px;font-size:12.5px;color:var(--muted);font-style:italic}
  .card.dim{opacity:.86}
  .card.dim .nr{background:#9aa3af}
  .sec.todo{color:var(--muted);font-size:13.5px;font-style:italic;padding:14px 0}
  .blocker{background:#fdecea;border:1px solid #f3c4be;border-left:5px solid var(--st-blockiert);border-radius:10px;padding:12px 15px;font-size:14px;color:#8f352c;line-height:1.5}
  .bl-lbl{display:block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--st-blockiert);margin-bottom:4px}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
  @media(max-width:560px){.card-top{flex-wrap:wrap}.badge{order:3}}
</style>
</head>

  const secBlocker=p.blocker?`<div class="sec"><div class="blocker"><span class="bl-lbl">⛔ Blockiert, weil</span>${p.blocker}</div></div>`:'';
  const secSchritte=steps?`<div class="sec"><h3>⏭️ Nächste Schritte</h3><ul class="steps">${steps}</ul>${p.note?`<div class="closing-note">${p.note}</div>`:''}</div>`:'';
  const offen=(!people&&!steps)?`<div class="sec todo">📝 Noch nicht im Detail besprochen — wird beim Diktat ergänzt.</div>`:'';
  return `<div class="card${(st[0]==='i'||st[0]==='p')?' dim':''}">
    <div class="card-top"><div class="nr">${p.nr}</div><h2>${p.titel}</h2><span class="badge ${st[0]}">${st[1]}</span></div>
    ${meta}
    <div class="body">${secWas}${secWer}${secStand}${secBlocker}${secSchritte}${offen}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
