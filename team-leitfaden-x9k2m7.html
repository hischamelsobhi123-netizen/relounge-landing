<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesprächsleitfaden – Termine aus dem Workshop</title>
<style>
  :root{
    --bg:#eef2f5; --card:#ffffff; --ink:#1c2b33; --muted:#5b6b75;
    --line:#e2e8ee; --blue:#157089; --blue-d:#0e5266; --blue-soft:#e7f3f7;
    --coral:#ff6a55; --coral-d:#e5523e;
    --p1:#e4572e; --p2:#e8901c; --p3:#3f9d6d;
    --green-soft:#e9f6ef; --yellow-soft:#fff6e3;
    --shadow:0 6px 22px rgba(20,50,70,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    font-size:18px;line-height:1.55;}
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 80px;}
  header.top{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:10px 0 12px;margin-bottom:6px;}
  h1{font-size:1.45rem;margin:.1em 0 .5em;letter-spacing:-.01em;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .tab{flex:1;min-width:160px;border:2px solid var(--line);background:#fff;
    color:var(--muted);font-weight:700;font-size:1rem;padding:13px 12px;
    border-radius:14px;cursor:pointer;transition:.15s;text-align:center;}
  .tab.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:var(--shadow);}
  .hint{color:var(--muted);font-size:.92rem;margin:6px 2px 16px;}

  /* search */
  .search{width:100%;padding:14px 16px;font-size:1.05rem;border:2px solid var(--line);
    border-radius:14px;margin-bottom:18px;background:#fff;}
  .search:focus{outline:none;border-color:var(--blue);}

  /* group + tiles */
  .grouplabel{display:flex;align-items:center;gap:9px;font-weight:800;
    font-size:1.02rem;margin:20px 4px 10px;}
  .dot{width:13px;height:13px;border-radius:50%;display:inline-block;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px;}
  .tile{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--blue);
    border-radius:14px;padding:14px 16px;cursor:pointer;transition:.13s;box-shadow:var(--shadow);}
  .tile:hover{transform:translateY(-2px);border-left-color:var(--coral);}
  .tile .nm{font-weight:800;font-size:1.12rem;}
  .tile .th{color:var(--muted);font-size:.9rem;margin-top:3px;}
  .tile.p1{border-left-color:var(--p1)} .tile.p2{border-left-color:var(--p2)} .tile.p3{border-left-color:var(--p3)}
  .badge{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:20px;
    color:#fff;margin-left:6px;vertical-align:middle;}
  .badge.p1{background:var(--p1)} .badge.p2{background:var(--p2)} .badge.p3{background:var(--p3)}
  .badge.man{background:#3a6ea5}

  /* detail */
  .back{display:inline-flex;align-items:center;gap:7px;background:#fff;border:2px solid var(--line);
    color:var(--blue-d);font-weight:700;font-size:1rem;padding:10px 16px;border-radius:12px;cursor:pointer;margin-bottom:14px;}
  .back:hover{border-color:var(--blue);}
  .dname{font-size:1.7rem;font-weight:800;letter-spacing:-.01em;margin:0 0 2px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;box-shadow:var(--shadow);margin:14px 0;}
  .card h3{margin:0 0 12px;font-size:1.04rem;text-transform:uppercase;letter-spacing:.04em;color:var(--blue-d);}

  /* bars */
  .bars{display:grid;gap:9px;}
  .bar{display:grid;grid-template-columns:140px 1fr 42px;align-items:center;gap:10px;font-size:.92rem;}
  .bar .track{background:#eef1f4;border-radius:8px;height:13px;overflow:hidden;}
  .bar .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#5bb0c6,#157089);}
  .bar.hi .fill{background:linear-gradient(90deg,#ff8a76,#e4572e);}
  .bar .pct{text-align:right;font-weight:700;color:var(--muted);}

  /* einstieg */
  .say{background:var(--green-soft);border:1px solid #cfe9da;border-radius:14px;padding:18px 20px;
    font-size:1.18rem;line-height:1.5;position:relative;}
  .say.blue{background:var(--blue-soft);border-color:#c5e3eb;}
  .say.coral{background:#fff0ed;border-color:#ffd5cc;}
  .say::before{content:"„";font-size:2.4rem;color:var(--blue);line-height:0;position:absolute;top:20px;left:8px;opacity:.25;}
  .say em{font-style:normal;background:#fff;padding:0 4px;border-radius:4px;box-shadow:inset 0 -8px 0 rgba(255,106,85,.18);}

  /* leitfragen */
  ol.q{list-style:none;counter-reset:q;margin:0;padding:0;display:grid;gap:11px;}
  ol.q li{counter-increment:q;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px 14px 54px;position:relative;font-size:1.1rem;}
  ol.q li::before{content:counter(q);position:absolute;left:14px;top:13px;width:28px;height:28px;
    background:var(--blue);color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--blue-d);background:var(--blue-soft);
    padding:1px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;}

  .note{background:var(--yellow-soft);border:1px solid #f4e2b8;border-radius:12px;padding:13px 16px;font-size:.98rem;}
  .note b{color:#9a6b00;}

  /* accordion */
  details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:11px 0;box-shadow:var(--shadow);overflow:hidden;}
  summary{cursor:pointer;padding:16px 18px;font-weight:800;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"▾";color:var(--muted);transition:.2s;}
  details[open] summary::after{transform:rotate(180deg);}
  .acc-body{padding:2px 18px 18px;}
  .step{margin:0 0 14px;}
  .step .lbl{font-weight:800;color:var(--blue-d);font-size:.86rem;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .step .txt{background:#f8fafb;border-left:4px solid var(--blue);border-radius:8px;padding:11px 14px;font-size:1.05rem;}
  .arrow{color:var(--muted);font-size:.9rem;margin:4px 2px 0;font-style:italic;}

  table.obj{width:100%;border-collapse:collapse;font-size:1rem;}
  table.obj td{border-bottom:1px solid var(--line);padding:11px 8px;vertical-align:top;}
  table.obj td:first-child{font-weight:700;width:42%;color:var(--blue-d);}

  .rules{display:grid;gap:9px;margin:6px 0 0;}
  .rule{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:1.04rem;}
  .rule b{color:var(--blue-d);}
  .pill{display:inline-block;background:var(--coral);color:#fff;font-weight:800;border-radius:20px;padding:5px 14px;font-size:.95rem;}

  .hide{display:none!important;}
  footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:30px;}
  @media(max-width:560px){
    body{font-size:17px} .wrap{padding:14px 12px 70px}
    .bar{grid-template-columns:108px 1fr 38px;font-size:.86rem}
    ol.q li{font-size:1.04rem}
  }
</style>
</head>

<div class="wrap">

  <header class="top">
    <h1>📞 Gesprächsleitfaden – Termine setzen</h1>
    <div class="tabs">
      <button class="tab active" id="tabA" onclick="showTab('A')">📋 Fragebogen-Teilnehmer</button>
      <button class="tab" id="tabB" onclick="showTab('B')">⏱️ Längste Teilnehmer</button>

  <!-- ============ ANSICHT A: DETAIL ============ -->
  <div id="viewDetailA" class="hide"></div>

  <!-- ============ ANSICHT B: LÄNGSTE TEILNEHMER ============ -->
  <div id="viewB" class="hide"></div>

  <footer>Intern · Zentrum für Gesundheit · Stand 06/2026</footer>
</div>

  ["2 · Workshop-Anker (sie ins Gefühl holen)",`Bevor wir da reinschauen – wie war der Workshop für dich? Was ist bei dir am meisten hängengeblieben?`,"Zuhören. Was sie sagt, brauchst du gleich."],

   "Nicht dagegenhalten – entlasten und den Termin entspannt framen."],
  ["🟠 Pfad C – sie sieht keinen Bedarf („hab ich im Griff“)","coral",
   `Schön, dass du das sagst – und ehrlich, das ist sogar gut. Dann geht's bei dir nicht ums „Reparieren“, sondern eher ums Feintunen. Darf ich kurz fragen: Was hat dich denn überhaupt zum Workshop und zur Analyse gebracht? Irgendwas war ja da.`,
   "Einmal sanft umdrehen. Kommt ein echter Punkt → zurück zu Pfad B."]
];}

  ["„Keine Zeit.“","Versteh ich – deshalb sind's auch nur 30 Minuten, und das geht abends oder am Wochenende. Was wär dir lieber?"],
  ["„Was kostet das?“","Der Termin ist komplett kostenlos. Da schauen wir erst mal, ob wir überhaupt der richtige Weg für dich sind."],
  ["„Muss ich überlegen / mit Mann reden.“","Klar. Lass uns den Termin trotzdem locker halten – du kannst jederzeit absagen. Solang der Workshop frisch ist, bringt er dir am meisten."],
  ["„Bin schon bei einem Arzt.“","Stark, dass du dran bist. Genau deshalb lohnt der Blick – wir schauen, ob was fehlt. Kostet dich nichts außer 30 Minuten."]
];

const PRIOLBL={1:["🔴 Priorität 1 – sofort anrufen","var(--p1)"],2:["🟠 Priorität 2 – hohe Belastung","var(--p2)"],3:["🟡 Priorität 3 – Einstieg sauber wählen","var(--p3)"]};
const WLAB=["Erschöpfung","Stress/Schlaf","Alltag","Vorgeschichte"];
const vorname=n=>n.split(" ")[0];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- Liste rendern ---------- */
function renderList(){
  const term=(document.getElementById('search').value||"").toLowerCase();
  const box=document.getElementById('list'); box.innerHTML="";
  [1,2,3].forEach(pr=>{
    const items=P.filter(x=>x.p===pr && x.n.toLowerCase().includes(term));
    if(!items.length) return;
    const gl=PRIOLBL[pr];
    const lab=document.createElement('div'); lab.className='grouplabel';
    lab.innerHTML=`<span class="dot" style="background:${gl[1]}"></span>${gl[0]}`;
    box.appendChild(lab);
    const grid=document.createElement('div'); grid.className='tiles';
    items.forEach(x=>{
      const i=P.indexOf(x);
      const top=WLAB[x.w.indexOf(Math.max(...x.w))];
      const t=document.createElement('div'); t.className=`tile p${x.p}`;
      t.onclick=()=>openDetail(i);
      t.innerHTML=`<div class="nm">${esc(x.n)}${x.mann?'<span class="badge man">Mann</span>':''}</div>
        <div class="th">Einstieg über: <b>${top}</b></div>`;
      grid.appendChild(t);
    });
    box.appendChild(grid);
  });
}

/* ---------- Detail rendern ---------- */
function openDetail(i){
  const x=P[i], vn=vorname(x.n);
  const bars=x.w.map((v,k)=>`<div class="bar ${v>=70?'hi':''}"><span>${WLAB[k]}</span>
     <span class="track"><span class="fill" style="width:${v}%"></span></span><span class="pct">${v}</span></div>`).join("");
  const qs=x.q.map(q=>`<li>${esc(q[0])}<span class="tag">${q[1]}</span></li>`).join("");

  document.getElementById('viewDetailA').innerHTML=`
    <button class="back" onclick="closeDetail()">← Zurück zur Namensliste</button>

    <div class="card"><h3>1 · Dein Einstieg (Auswertung anteasern – nicht erklären!)</h3>
      <div class="say ${x.ein}">${x.e}</div></div>

      <ol class="q">${qs}</ol>
      <p class="arrow" style="margin-top:12px">Eine nach der anderen. Zuhören, nachhaken („Erzähl mal …“). Sobald sie ihren Punkt bestätigt: aufhören zu graben.</p></div>

  `;
  document.getElementById('viewListA').classList.add('hide');
  document.getElementById('viewDetailA').classList.remove('hide');
  window.scrollTo(0,0);
}

async function unlock(pw){
  try{
    const raw=Uint8Array.from(atob(ENC),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    const e=new TextEncoder();
    const bk=await crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
    P=JSON.parse(new TextDecoder().decode(pt));
    return true;
  }catch(err){return false;}
}
function initGate(){
  if(!window.crypto||!crypto.subtle){
    document.body.innerHTML='<div style="max-width:520px;margin:90px auto;font-family:Segoe UI,system-ui,sans-serif;padding:24px;text-align:center;color:#1c2b33"><div style="font-size:2.4rem">🔒</div><h2>Bitte über den Link öffnen</h2><p style="color:#5b6b75">Diese Seite muss über ihre Internet-Adresse (https://…) geöffnet werden, nicht als heruntergeladene Datei.</p></div>';
    return;
  }
  const ov=document.createElement('div');
  ov.id='gate';
  ov.style.cssText='position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#157089,#0e5266);display:flex;align-items:center;justify-content:center;font-family:Segoe UI,system-ui,sans-serif';
  ov.innerHTML=`<div style="background:#fff;border-radius:18px;padding:34px 28px;max-width:390px;width:90%;box-shadow:0 14px 44px rgba(0,0,0,.32);text-align:center">
    <div style="font-size:2.4rem">🔒</div>
    <h2 style="margin:.25em 0;color:#0e5266">Gesprächsleitfaden</h2>
    <p style="color:#5b6b75;margin:.2em 0 1.3em;font-size:.95rem">Interner Zugang – bitte Passwort eingeben.</p>
    <input id="gpw" type="password" placeholder="Passwort" autocomplete="off"
      style="width:100%;padding:14px 15px;font-size:1.08rem;border:2px solid #e2e8ee;border-radius:12px;margin-bottom:10px;box-sizing:border-box">
    <div id="gerr" style="color:#e4572e;font-size:.9rem;min-height:18px;margin-bottom:8px"></div>
    <button id="gbtn" style="width:100%;padding:15px;font-size:1.08rem;font-weight:700;background:#ff6a55;color:#fff;border:none;border-radius:12px;cursor:pointer">Öffnen</button>
  </div>`;
  document.body.appendChild(ov);
  const go=async()=>{
    const pw=document.getElementById('gpw').value;
    const err=document.getElementById('gerr'); err.textContent='';
    document.getElementById('gbtn').textContent='…';
    const ok=await unlock(pw);
    if(ok){ renderList(); renderB(); ov.remove(); }
    else { err.textContent='Falsches Passwort.'; document.getElementById('gbtn').textContent='Öffnen'; }
  };
  document.getElementById('gbtn').onclick=go;
  document.getElementById('gpw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>document.getElementById('gpw').focus(),100);
}
initGate();
