<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firmen-Cockpit</title>
<style>
  :root{
    --bg:#0a1622; --bg2:#0f2034; --card:#13283f; --card2:#16314c;
    --teal:#2fd4bd; --gold:#e3b765; --ink:#eaf2f8; --mut:#8aa3b8;
    --line:rgba(255,255,255,.08); --red:#ff6b63; --amber:#f0b54e; --green:#43e08f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#16314c,#0a1622 60%);color:var(--ink);
    min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:90px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  button{font-family:inherit}
  .top{position:sticky;top:0;z-index:30;background:rgba(10,22,34,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topin{max-width:1080px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:11px}
  .iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:all .15s;flex:0 0 auto}
  .iconbtn:hover{border-color:rgba(47,212,189,.45);background:var(--card2)}
  .iconbtn.hidden{visibility:hidden;pointer-events:none}
  .iconbtn.act{background:var(--teal);color:#06241f;border-color:var(--teal);font-weight:800}
  .brand{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal)}
  .crumb{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
  .crumb a{color:var(--teal);cursor:pointer;text-decoration:none;white-space:nowrap}
  .crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gpill{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;flex:0 0 auto}
  .gpill b{font-size:13.5px;color:var(--teal)}
  .editbar{background:linear-gradient(90deg,rgba(47,212,189,.14),rgba(47,212,189,.04));border-bottom:1px solid rgba(47,212,189,.25);text-align:center;font-size:12.5px;color:var(--teal);padding:7px;font-weight:700;display:none}
  body.edit .editbar{display:block}
  .hero{padding:24px 0 4px;text-align:center}
  .hero .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .hero h1{font-size:24px;font-weight:800;margin-top:6px}
  .tabs{display:flex;gap:11px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 22px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:800;font-size:15px;cursor:pointer;transition:all .15s}
  .tab:hover{border-color:rgba(47,212,189,.45)}
  .tab.active{background:linear-gradient(135deg,var(--teal),#1f9e8f);color:#06241f;border-color:var(--teal);box-shadow:0 8px 22px rgba(47,212,189,.22)}
  .tab .tp{font-size:11.5px;font-weight:800;opacity:.8}
  .task.q{cursor:pointer;border-style:dashed;border-color:rgba(227,183,101,.4);opacity:1}
  .task.q:hover{border-color:var(--gold)}
  .task.q .ind{border-color:var(--gold);background:rgba(227,183,101,.08)}
  .task.q .ind b{color:var(--gold);font-size:15px;font-weight:800}
  .task.q label{color:var(--ink)}
  .task.q .qlabel{font-size:10.5px;color:var(--gold);font-weight:800;letter-spacing:.06em;margin-top:5px;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:15px;margin-top:18px}
  .tile{position:relative;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;animation:rise .4s ease backwards}
  .tile:hover{transform:translateY(-4px);border-color:rgba(47,212,189,.4);box-shadow:0 14px 34px rgba(0,0,0,.4)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
  .thumb{height:104px;background:linear-gradient(135deg,#1c3a5a,#15485f);background-size:cover;background-position:center;position:relative}
  .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,22,34,.05),rgba(10,22,34,.78))}
  .thumb .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;z-index:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
  .ring{position:absolute;top:10px;right:10px;z-index:2}
  .tbody{padding:13px 15px 15px}
  .tbody h3{font-size:15.5px;font-weight:800;line-height:1.25}
  .tbody .desc{font-size:12.5px;color:var(--mut);margin-top:3px;min-height:16px}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--mut)}
  .bar{height:7px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;margin-top:8px}
  .bar>div{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .pct{font-weight:800;font-size:13.5px}
  .editctl{position:absolute;top:9px;left:9px;display:none;gap:6px;z-index:5}
  body.edit .editctl{display:flex}
  .minibtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(10,22,34,.8);color:var(--ink);font-size:13px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px);transition:all .15s}
  .minibtn:hover{border-color:var(--teal)}
  .minibtn.del:hover{border-color:var(--red);color:var(--red)}
  .addtile{display:none;align-items:center;justify-content:center;gap:9px;min-height:200px;border:2px dashed rgba(47,212,189,.35);border-radius:18px;color:var(--teal);font-weight:700;cursor:pointer;background:rgba(47,212,189,.04);transition:all .15s;font-size:15px}
  .addtile:hover{background:rgba(47,212,189,.1);border-color:var(--teal)}
  body.edit .addtile{display:flex}
  .syslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
  .syscard{position:relative;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px 17px;cursor:pointer;transition:transform .12s,border-color .12s;animation:rise .35s ease backwards}
  .syscard:hover{transform:translateY(-3px);border-color:rgba(47,212,189,.35)}
  .syscard .sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .syscard h4{font-size:15.5px;font-weight:800;padding-right:56px}
  .syscard .done{font-size:12.5px;color:var(--mut);margin-top:7px}
  .addrow{display:none;align-items:center;justify-content:center;gap:8px;padding:15px;border:2px dashed rgba(47,212,189,.35);border-radius:14px;color:var(--teal);font-weight:700;cursor:pointer;background:rgba(47,212,189,.04);transition:all .15s;margin-top:12px}
  .addrow:hover{background:rgba(47,212,189,.1)}
  body.edit .addrow{display:flex}
  .tasks{margin-top:16px;display:flex;flex-direction:column;gap:11px}
  .task{position:relative;display:flex;align-items:center;gap:15px;padding:15px 18px;font-size:15px;cursor:pointer;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;transition:transform .14s,border-color .18s,box-shadow .18s,opacity .25s;animation:rise .3s ease backwards}
  .task:hover{transform:translateY(-2px);border-color:rgba(47,212,189,.4);box-shadow:0 8px 22px rgba(0,0,0,.28)}
  .task .ind{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);flex:0 0 auto;display:grid;place-items:center;transition:all .22s;background:rgba(255,255,255,.02)}
  .task .ind svg{opacity:0;transform:scale(.4);transition:all .22s}
  .task .body{flex:1;min-width:0}
  .task label{cursor:pointer;color:var(--ink);font-weight:600;line-height:1.35;transition:color .25s;display:block}
  .task .pbar{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:8px}
  .task .pbar>div{height:100%;border-radius:4px;transition:width .4s}
  .task .pnum{font-size:12px;color:var(--mut);margin-top:5px;font-weight:700}
  .task .donebadge{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--green);border:1px solid rgba(67,224,143,.35);border-radius:999px;padding:3px 9px;opacity:0;transition:opacity .25s;white-space:nowrap;flex:0 0 auto}
  .task.done{border-color:rgba(67,224,143,.28);opacity:.74}
  .task.done .ind{background:var(--green);border-color:var(--green);box-shadow:0 0 14px rgba(67,224,143,.4)}
  .task.done .ind svg{opacity:1;transform:scale(1)}
  .task.done label{color:var(--mut)}
  .task.done .donebadge{opacity:1}
  .task .tctl{display:none;gap:6px;flex:0 0 auto}
  body.edit .task .tctl{display:flex}
  body.edit .task .donebadge{display:none}
  .vhead{display:flex;align-items:center;gap:16px;margin-top:20px}
  .vhead .vic{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#1c3a5a,#15485f);display:grid;place-items:center;font-size:30px;flex:0 0 auto;background-size:cover;background-position:center}
  .vhead h2{font-size:22px;font-weight:800}
  .vhead .vd{font-size:13.5px;color:var(--mut);margin-top:2px}
  .vhead .vpct{margin-left:auto;text-align:right}
  .vhead .vpct .n{font-size:26px;font-weight:800}
  .ideebtn{margin-top:14px;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(160deg,rgba(227,183,101,.1),rgba(227,183,101,.03));border:1px solid rgba(227,183,101,.28);border-radius:14px;padding:14px 16px;color:var(--gold);font-weight:700;cursor:pointer;font-size:14.5px;transition:all .15s}
  .ideebtn:hover{background:rgba(227,183,101,.16);border-color:rgba(227,183,101,.5)}
  .ideebtn .arrow{margin-left:auto;color:var(--mut)}
  .tarrow{color:var(--mut);font-size:21px;flex:0 0 auto;font-weight:700;opacity:.45;transition:all .15s}
  .task:hover .tarrow{opacity:1;color:var(--teal)}
  body.edit .tarrow{display:none}
  .ideedot{flex:0 0 auto;font-size:14px;opacity:.85}
  .ideeblock{margin-top:14px;background:linear-gradient(160deg,rgba(227,183,101,.1),rgba(227,183,101,.03));border:1px solid rgba(227,183,101,.28);border-radius:16px;padding:16px 18px}
  .ideeblock .ih{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:800;font-size:14.5px;margin-bottom:10px}
  .ideeblock .ih .minibtn{margin-left:auto}
  .ideeempty{color:var(--mut);font-size:14px;font-style:italic}
  .seclabel{margin-top:22px;margin-bottom:-2px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:800}
  .ov{position:fixed;inset:0;background:rgba(6,14,22,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
  .ov.on{display:flex}
  .dlg{background:linear-gradient(160deg,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1}}
  .dlg h3{padding:18px 20px 4px;font-size:17px;font-weight:800}
  .dlg .dbody{padding:8px 20px 4px}
  .fld{margin-top:12px}
  .fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600}
  .fld input,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 13px;font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
  .fld input:focus,.fld textarea:focus{border-color:var(--teal)}
  .fld textarea{resize:vertical;min-height:72px;line-height:1.5}
  .fld textarea.big{min-height:240px}
  .hintsmall{font-size:11.5px;color:var(--mut);margin-top:4px}
  .dlgfoot{display:flex;gap:10px;padding:16px 20px 20px;justify-content:flex-end;flex-wrap:wrap}
  .btn{padding:11px 18px;border-radius:11px;font-size:14.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:all .15s}
  .btn:hover{border-color:var(--teal)}
  .btn.prim{background:var(--teal);color:#06241f;border-color:var(--teal)}
  .btn.danger{background:rgba(255,107,99,.15);border-color:rgba(255,107,99,.4);color:var(--red)}
  .ideeview{white-space:pre-wrap;line-height:1.6;font-size:14.5px;color:#cfe0ee}
  .slider{width:100%;margin-top:10px;accent-color:var(--teal)}
  .footnote{text-align:center;color:var(--mut);font-size:12px;margin-top:24px;padding:0 16px}
  .err{margin-top:30px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--mut);text-align:center;font-size:14px}
</style>
</head>
<body>
<div class="top">
  <div class="topin">
    <button class="iconbtn" id="backBtn" onclick="goBack()" title="Zurück">←</button>

<script>
window.COCKPIT_DATA={"updated": "2026-06-01", "title": "Firmen-Cockpit", "areas": [{"id": "prio", "firm": "zentrum", "name": "🔥 Bis Workshop (6./7. Juni)", "icon": "🔥", "img": "", "desc": "Die 3 Top-Prioritäten — alles andere wartet", "idee": "FOKUS bis zum nächsten Workshop am 6./7. Juni: NUR diese 3 Dinge — dafür aber komplett.\n\n1) LANDINGPAGE GEGENTESTEN: neue Workshop-Landingpage mit Claude, zuerst mit demselben Text, der schon eine gute Conversion-Rate hat. Claude analysiert die bestehende Seite und bestimmt die gezielten Verbesserungen.\n2) VIDEO-OFFENSIVE: KI-Automatik + Skripte + Schnitt-Tool einmal durchgehen, dann 5 Tage lang 5 Videos/Tag auf ALLEN Plattformen — viral gehen, Traffic auf die Landingpage.\n3) CLOSING FREI ZUM LAUFEN BRINGEN: Closing soll bei allen Vertrieblern frei funktionieren, Team wird geschult.\n\nÜber den Traffic der Video-Offensive → Leute auf die Landingpage → daraus weiteres planen. Ziel: bis zum Workshop maximieren.", "systems": [{"name": "1 · Landingpage gegentesten", "idee": "Eine neue Workshop-Landingpage mit Claude bauen, um sie gegen die bestehende zu testen. ZUERST mit demselben Text (gute Conversion-Rate), nur Design/Struktur gezielt verbessern. Claude analysiert die bestehende LP und sagt genau, was besser werden muss.", "tasks": [{"t": "Bestehende Workshop-Landingpage analysieren (Claude)", "done": false}, {"t": "Gezielte Verbesserungen bestimmen (Claude entscheidet)", "done": false}, {"t": "Neue LP bauen (gleicher Text + Verbesserungen)", "done": false}, {"t": "A/B gegen die bestehende testen", "done": false}]}, {"name": "2 · Video-Offensive (5/Tag, alle Plattformen)", "idee": "Die nächsten 5 Tage maximal Traffic über organische Kurzvideos. Erst KI-Automatik + Skripte + Schnitt-Tool (Reap) durchgehen, dann 5 Videos/Tag auf Insta/TikTok/YouTube/FB. Evtl. Serie 'Eine Minute Medizin' abdrehen. Viral gehen → Traffic auf die Landingpage. Verknüpft mit dem Bereich Video-Automatisierung.", "tasks": [{"t": "KI-Automatik + Skripte + Schnitt-Tool (Reap) durchgehen", "done": false}, {"t": "Video-Skripte erstellen (Serie 'Eine Minute Medizin')", "done": false}, {"t": "Videos drehen + schneiden", "done": false}, {"t": "5 Videos/Tag auf allen Plattformen posten (5 Tage)", "done": false}, {"t": "Traffic → Landingpage messen + weiteres planen", "done": false}]}, {"name": "3 · Closing frei zum Laufen bringen", "idee": "Das Closing soll bis zum Workshop bei ALLEN frei funktionieren. Die dokumentierte Methodik ins ganze Team bringen (Patricia, Vincent, neue Vertriebler) und aus den Zoom-Transkripten pro Person trainieren. Verknüpft mit Vertrieb & Closing.", "tasks": [{"t": "Closing-Methodik ins ganze Team (Patricia, Vincent, neue)", "done": false}, {"t": "Zoom-Transkripte → Einwandbehandlung pro Person auswerten", "done": false}, {"t": "Team-Training durchführen", "done": false}]}]}, {"id": "workshop", "name": "Workshop & Akquise", "icon": "🎓", "img": "assets-relounge/hischam-opt.jpg", "desc": "Webinar/Workshop als Haupt-Akquise-Kanal", "systems": [{"name": "Workshop 6./7. Juni", "tasks": [{"t": "Block 3 + 4 inhaltlich fertig", "done": true, "idee": "Block 3 erklaert das System (Drei-Gaerten-Metapher: Alarm/Bunker/Crash, Reihenfolge ist das Geheimnis, Epigenetik, echte Patientinnen-Stories). Block 4 fuehrt durch 8 Phasen vom Verstehen zum Angebot: Wertanker 11.290 € → Preis 2.997 €, 28-Tage-Garantie, Future-Pacing, NLP-Sprache. Beides fertig und dokumentiert in der Workshop-Wissensbasis."}, {"t": "Webinar-Ablauf + Closing dokumentiert", "done": true, "idee": "Der Gesamtablauf des Webinars ist verschriftlicht: 6 Bloecke, 90 Minuten, O-Ton-Saetze, Timing-Architektur, CTA-Strategie (erst kostenloser Gespraechs-Link, 20 Sek spaeter Stoffwechsel-Check-Link). Dazu: das 1-zu-1-Closing-Gespraech (6 Bloecke, Fragen in Reihenfolge, 30/70-Sprechregel, Kern-Schmerz vor Hoffnung). Beides liegt in outputs/workshop-wissensbasis/."}, {"t": "Sommer-Reset 30 (Folie + Text)", "done": true, "idee": "Neues Zwischen-Angebot (890 €, 100 % anrechenbar auf den 6-Monats-Weg) fuer Teilnehmer, die nicht sofort 2.997 € zahlen wollen. Wird als Folie 52b direkt nach der Drei-Wege-Folie eingebaut. Schuetzt die Preis-Leiter: 490 € (Diagnose) → 890 € (30 Tage) → 2.997 € (6 Monate). Fertig dokumentiert in outputs/workshop-wissensbasis/einschub-sommer-reset.md."}, {"t": "Mitarbeiter schulen (Emine, Patricia)", "done": false, "idee": "Emine und Patricia muessen wissen, was im Webinar passiert, damit sie den Chat betreuen und die Links punktgenau posten. Kern-Aufgabe: sobald Hischam den Satz 'Beide Links sind jetzt im Chat' sagt, posten. Am Ende nochmal posten. Emine ist bereits in die Closing-Methodik eingearbeitet – Patricia steht noch aus."}, {"t": "Fragebögen Runde 2 einsammeln", "done": false, "idee": "Runde-2-Frageboegen wurden verschickt, um das Soll-System besser zu verstehen (Wissen aus den Koepfen der Mitarbeiter). Die Antworten stehen noch aus. Erst wenn Runde 2 abgeschlossen ist, gilt das Verstehen als vollstaendig – dann kommt der Bau."}, {"t": "Generalprobe / Technik-Check", "done": false, "idee": "Vor dem echten Webinar einen kompletten Durchlauf machen: Links testen, Chat-Funktion pruefen, Ton/Bild, Folien-Timing, Emine/Patricia auf Postings vorbereiten. Noch nicht ausgearbeitet. Gehoert dazu: Zoom-Link aktiv, Buchungslinks A + B einsatzbereit, Studio-Setup gecheckt."}], "idee": "Das Webinar fuer den 6./7. Juni ist inhaltlich fertig (Block 3 + 4, Webinar-Ablauf, Sommer-Reset-Folie). Jetzt muessen Mitarbeiter geschult werden und die Technik muss reibungslos laufen."}, {"name": "Workshop Juli (Ads-Kampagne)", "tasks": [{"t": "Konkurrenz-Analyse gemacht", "done": true, "idee": "Vollständige Konkurrenz-Analyse für die Workshop-Nische (Abnehmen / Stoffwechsel / Hormone, Frauen 40+).\n\nWER WURDE ANALYSIERT:\n• Jan Bahmann = die Blaupause — fast identisches Modell (Webinar -> 6-Monats-Begleitung, Frauen 40+), aber nur COACH, kein Arzt.\n• Aktive Werber (live in der Meta-Werbebibliothek):\n   - Daniel van den Boom: 'Wunschgewicht in den Wechseljahren', sehr aktiv, Video-Hooks + Einzel-Testimonials.\n   - Easylife Deutschland: 177 aktive Anzeigen (!), Hook 'Stoffwechselanalyse kostenlos (statt 59 €)'.\n   - DAA Weiden: '6-Wochen Hormonbalance-Programm – nur bis 13.6.' (Verknappung) + kostenloser Hormon-Test.\n   - Quantum Leap: Quiz-Funnel ('Bauchfett ab 40 – Quiz').\n• Weitere Coaches: Agnes Lasota, Doreen Buceta-Hager, Daniela Dworzak, Körperverwandlung, MetaFlow u.a.\n\nWAS SICH HERAUSGESTELLT HAT (Gewinner-Muster):\n1. ALLE nutzen einen kostenlosen Quiz / Test / Analyse als Lead-Magnet — und WIR haben das 9-Fragen-Stoffwechseltyp-Quiz aus dem Webinar schon!\n2. Video-Ads dominieren überall (bestätigt die KI-Video-Pipeline).\n3. Einzel-Testimonials als eigene Anzeigen ('Das sagt Sandra über…').\n4. Stärkste Hooks: Wechseljahre/Menopause + 'Bauchfett ab 40'.\n5. Verknappung/Deadline treibt die Anmeldung.\n\nUNSER UNFAIRER VORTEIL: Fast NIEMAND in der Nische ist ein echter Arzt — alles Coaches/Ketten. 'Echter Arzt + echte Laborwerte + Ursachen' ist die unbesetzte Position.\n\nVolle Details: outputs/konkurrenz-deepdive.md + branchen-accounts-tracking.md"}, {"t": "LP-A1 'Welcher Typ' gebaut", "done": true, "idee": "Die erste Haupt-Landingpage ist fertig: outputs/lp-a1-workshop-haupt.html. Hook: 'Welcher Stoffwechsel-Typ bist du?' (die 3 Gaerten-Typen). Zielgruppe: diaet-frustrierte Frauen 35–65. Kern-Regel der Seite: Neugier wecken, Inhalt NICHT verraten. Teilnehmerin soll denken 'Das MUSS ich erfahren', nicht 'Das weiss ich schon'."}, {"t": "LP-A2 + Regionale LP", "done": false, "idee": "Noch zu bauen: LP-A2 mit Hook 'Die richtige Reihenfolge (7 Schritte)' fuer systematisch denkende Frauen. Regionale LP fuer Einzugsgebiet Uchte (~120 km Umkreis: Braunschweig/Wolfsburg im Osten, Muenster im Suedwesten, Bremen/Oldenburg im Norden, Hameln im Sueden). Regionale Leads = doppelter Wert (Workshop online + koennen in die Praxis)."}, {"t": "Pixel + GHL-Workflow je Kampagne", "done": false, "idee": "Fuer jede der 3 Kampagnen muss der Funnel sauber verdrahtet sein: Pixel trackt Anmeldungen, GHL-Workflow schickt Bestaetigung + Erinnerung + Follow-up. Pixel anlegen kann Claude NICHT selbst (kein MCP-Werkzeug) – das macht Vincent. Alternativ: 1 Pixel + 3 getrennte Conversions/Regeln pro LP-URL (weniger Aufwand). Mit Vincent absprechen."}, {"t": "Kampagnen scharf schalten", "idee": "Die fertigen Kampagnen live schalten. Vorher müssen mehrere Zwischenschritte sitzen — erst wenn alle erledigt sind, gilt der Punkt als fertig.", "steps": [{"t": "Pixel anlegen (Vincent / selbst)", "done": false}, {"t": "Landingpages in GHL hosten", "done": false}, {"t": "Video-Creatives drehen + schneiden", "done": false}, {"t": "Anzeigen-Muster (Vorschau) bestätigen", "done": false}, {"t": "Budget + Targeting setzen", "done": false}, {"t": "Live schalten", "done": false}]}], "idee": "Fuer den Juli-Workshop (~5./6. Juli, Datum noch bestaetigen) laeuft die Ads-Kampagne ab dem 6./7. Juni – 4-5 Wochen Vorlauf. Geplant sind 3 Kampagnen mit je eigenem Pixel und eigener Landingpage: Haupt-LP ('Welcher Typ?'), Variante ('7 Schritte') und regionale LP (120 km Umkreis Uchte). Regionale Leads sind doppelt wert, weil sie auch in die Praxis kommen koennen."}, {"name": "Workshop-Material & Wissensbasis", "tasks": [{"t": "2 Workshops ausgewertet (Tag 2)", "done": true, "idee": "Beide Sonntag-Verkaufstage (Workshop A + Workshop B vom 19. April) sind transkribiert und ausgewertet. Ergebnis: Workshop-Auswertungen (Epigenetik-Weg, 3-Wege-Modell Basis/Vertiefung/Ursache, Paketlogik, O-Toene). Verdichtet in einer 'Was funktioniert immer'-Liste (14-Punkte Erfolgs-Skelett)."}, {"t": "Erfolgs-Skelett (14 Punkte)", "done": true, "idee": "Die 14 wiederholbaren Elemente, die in BEIDEN Workshops funktioniert haben – unabhaengig vom Publikum. Dokumentiert in outputs/workshop-wissensbasis/workshop-verdichtung.md. Dient als Vorlage fuer jeden weiteren Workshop, fuer Ads-Texte und fuer das Closing-Training neuer Mitarbeiter."}, {"t": "Tag 1 (Samstag) auswerten", "done": false, "idee": "Tag 1 (Samstag) beider bisherigen Workshops wurde noch nicht ausgewertet. Dort passiert der Lern- und Verstaendnis-Teil (Block 1–3). Auswertung wuerde zeigen, was die Teilnehmer am meisten bewegt, welche Formulierungen sitzen, und welche Einwaende entstehen – wertvoller Input fuer Landingpages und Video-Hooks."}], "idee": "Aus dem kompletten Workshop-/Webinar-Material wurde eine dauerhafte Wissensbasis destilliert (outputs/workshop-wissensbasis/). Ziel: Basis fuer Ads, Closing-Training, Workshop-Wiederholung und Landingpages. Bisher nur Tag-2-Auswertungen (Verkaufstag) – Tag 1 (Samstag, Inhalts-Tag) beider bisherigen Workshops ist noch offen."}], "firm": "zentrum", "idee": "Der Workshop ist der einzige Akquise-Kanal fuer die 6-Monats-Begleitung (2.997 €). Das Webinar laeuft 90 Minuten: erst Verstaendnis (Warum hapert es?), dann Live-Analyse (9 Fragen, welcher Stoffwechsel-Typ bist du?), dann Closing. Der Schluessel ist nicht das THEMA, sondern die REIHENFOLGE der Bloecke. Naechste Termine: 6./7. Juni (fast fertig vorbereitet) und Juli-Workshop (Ads-Kampagne laeuft dafuer ab ~7. Juni). Ziel: ca. 300 Anmeldungen → 70–100k Umsatz pro Workshop."}, {"id": "vertrieb", "name": "Vertrieb & Closing", "icon": "🤝", "img": "assets-relounge/team-opt.jpg", "desc": "Closing-Rate erhöhen, Verkaufswege ausbauen", "systems": [{"name": "Closing-Methodik", "tasks": [{"t": "Methodik dokumentiert (Standort, Gewichts-Flow, Preis-Anker)", "done": true, "idee": "Die Methodik ist vollstaendig verschriftlicht in outputs/closing-methodik.md + outputs/workshop-wissensbasis/04-closing-bedarfsanalyse.md. Enthalten: Grundhaltung (Therapeut, nicht Verkaeufer), alle 4 Closing-Schritte mit genauen Formulierungen, der vollstaendige 6-Bloecke-Bedarfsanalyse-Leitfaden (60 Min), Ankersaetze, Dos/Don'ts und Checkliste nach dem Gespraech."}, {"t": "Emine eingearbeitet (Transkript Einwandbehandlung)", "done": true, "idee": "Emine hat die Methodik bereits durchgearbeitet. Basis war das reale Zoom-Transkript und die Einwandbehandlungs-Logik (Geld-Einwand = Vertrauens-Frage; Partner-Einwand; Zeit-Einwand). Das ist der Beweis, dass die Methodik lehrbar ist — dasselbe jetzt mit Patricia und Vincent."}, {"t": "Patricia einarbeiten", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Zoom-Transkript von Patricias echten Gespraechen auswerten, staerkste Schwachstellen identifizieren (z.B. zu fruehes Abbiegen zum Preis, Einwand-Behandlung), dann 1:1 Schulung anhand der Methodik + Leitfaden aus closing-methodik.md. Erst danach gilt Patricia als eigenstaendig einsatzfaehig."}, {"t": "Vincent einarbeiten", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Vincent hat bisher eher eine technische Rolle. Wenn er Closing uebernehmen soll, braucht er das vollstaendige Onboarding: Methodik lesen, Beispiel-Transkripte hoeren/lesen, Rolle-spielen, dann mit echtem Gespraech unter Begleitung starten."}, {"t": "Neue Vertriebler einarbeiten (laufend)", "done": false, "idee": "Noch nicht ausgearbeitet. Gehört dazu: ein wiederholbares Onboarding-System fuer neue Closer (Leitfaden + Transkript-Bibliothek + Rollenspielen + erste begleitete Gespraeche). Ziel: neue Person braucht max. 2 Wochen bis zum ersten eigenen Closing. Das ist der Skalierungs-Hebel fuer den Beratungs-Funnel."}, {"t": "Zoom-Transkripte -> Einwandbehandlung pro Person auswerten", "done": false, "idee": "Echte Zoom-Gespraeche werden mit Whisper transkribiert und dann analysiert: Wo bricht jede Person ein? Welche Einwaende kommen am haeufigsten? Wo wird zu frueh zum Preis gesprungen? Wo fehlt der Future-Pace? Das ergibt ein Personenprofil fuer Emine, Patricia und Vincent — individuelle Staerken und blinde Flecken — und fuehrt zu gezieltem, nicht generischem Training."}], "idee": "Die Closing-Methodik von Hischam/Ramy ist dokumentiert und hat sich in echten Gespraechen bewaehrt. Kern: Der Closer arbeitet wie ein Therapeut, nicht wie ein Verkaeufer. Die Kundin wird schon warm durch den Workshop — im Closing-Gespraech geht es darum, zu verstehen ob und wie das Programm INDIVIDUELL passt. Vier Schritte: (1) Standort klaeren ('Workshop Tag 1+2 gesehen?'), (2) Gewichts-Flow (aktuell → Wunsch → Differenz → laengere Begleitung begruenden), (3) Hoechstgewicht-Frage (oeffnet die tiefe Geschichte), (4) Preis-Anker (5.000 € zeigen, dann 2.997 € wirkt guenstig). Dazu der vollstaendige 6-Bloecke-Leitfaden (Bedarfsanalyse-Gespraech, 60 Min): Ankommen → IST/Geschichte → Schmerz → Wunsch → Hindernisse → Spiegel → Angebot. Jetzt muss die Methodik ins ganze Team — Person fuer Person, anhand echter Zoom-Transkripte."}, {"name": "Beratungs-Funnel (van den Boom-Stil)", "tasks": [{"t": "Konzept + Vorbild analysiert", "done": true, "idee": "Vollstaendige Analyse von danielvandenboom.de liegt vor (outputs/umsatz-strategie.md). Aufgebaut in 4 Stufen: Hero-Versprechen fuer Frauen 40+ → Vertrauen (1000+ Kundinnen, Fallstudien mit Namen/Zahlen, Presse) → CTA 'Kostenlos beraten' (5x auf der Seite) → 3-Stufen-Onboarding (Fragebogen → 15-Min-Vorgespräch → 60-Min-Beratung). Entscheidung Weg (a) Workshop oder (b) Closer ist noch offen."}, {"t": "Funnel-Website bauen", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Entscheidung Weg (a) oder (b) treffen, dann Seiten-Aufbau nach van den Boom-Muster aber mit aerztlicher Autoritaet: Hero-Video Hischam (echter Arzt, 25+ Jahre, 2000+ Patientinnen) → Fallstudien (Marion -20 kg, Michael -25 kg) → CTA Erstgespraech (kostenlos, 40 Min) → Buchungssystem (GHL). Claude kann die Seite in GHL bauen."}, {"t": "Vertriebler/Closer anstellen", "done": false, "idee": "Noch nicht erledigt. Gehört dazu (fuer Weg b): eine dedizierte Closer-Rolle definieren (Stundensatz oder Provision), Anforderungsprofil schreiben, einstellen und dann mit der bewiesenen Closing-Methodik einarbeiten. Solange das Team (Emine, Patricia, Vincent) das abdecken kann, ist externer Closer optional — aber der Beratungs-Funnel braucht Kapazitaet."}], "idee": "Das ist das zweite Verkaufsbein neben dem Workshop. Vorbild: danielvandenboom.de — eine Website, die durch ein Video warm macht, dann zu einem kostenlosen Beratungsgespraech fuehrt, wo ein Closer das High-Ticket-Coaching abschliesst. Analyse ist fertig. Zwei moegliche Wege: (a) Funnel fuehrt zum Workshop (skaliert den bestehenden Kanal), (b) Funnel fuehrt direkt zu einem Closer (eigenstaendiger Verkaufsweg, mehr Kontrolle, sofortiger Umsatz ohne Workshop-Termin). Unser Vorteil gegenueber van den Boom: Hischam ist echter Arzt (van den Boom ist Coach). Noch in Bau."}, {"name": "Angebots-Struktur", "tasks": [{"t": "6-Monats-Weg 2.997 € + Raten", "done": true, "idee": "Preis und Raten sind festgelegt und dokumentiert (02-block4.md). Einmalzahlung 2.997 €. Ratenzahlung 24 × 140 € = 3.360 € (Aufschlag 363 € = Zinslast). Enthalten: Anamnese, 5-Achsen-Labor, Fahrplan, WhatsApp-Begleitung, woechentlicher Gruppencall, monatlich 1:1 aerztlich, Ernaehrungsmanager, Community, Bonus-Module, 28-Tage-Garantie. Extras: Paar-Modul 50 % (1.498,50 €), optional TCM-Regulation."}, {"t": "Paket-Inhaltsliste (2.997/3.997/4.997)", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Die drei Pakete muessen sauber voneinander abgegrenzt werden — was ist in jedem Paket MEHR als im darunter. Aktuell ist nur 2.997 € klar. 3.997 und 4.997 sind Platzhalter. Wichtig fuer das Closing: Der Closer muss auf Anhieb erklaeren koennen, was genau drin ist — ohne nachfragen. Dieses Dokument ist ein 'schneller Gewinn' (Backlog #7)."}, {"t": "28-Tage-Challenge / Sommer-Reset", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Der Sommer-Reset 890 € ist als Zwischenprodukt geplant (guenstiger Einstieg unter dem 6-Monats-Weg). Folie und Text sind fertig. Was noch fehlt: genaue Inhalts-Beschreibung, wie es im Closing eingesetzt wird (als Alternative bei Preis-Einwand? als eigenstaendiges Angebot?) und wie der Uebergang vom Sommer-Reset in den 6-Monats-Weg aussieht."}], "idee": "Die Angebots-Struktur ist das Herzstuck des Closings — was genau verkauft wird und wie es praesentiert wird. Aktuell steht der 6-Monats-Weg fuer 2.997 € (dokumentiert). Aber die genaue Inhalts-Liste der Pakete (was ist in 2.997, was in 3.997, was in 4.997 €?) ist noch nicht sauber ausgearbeitet — das erzeugt Verwirrung im Team ('Hieroglyphen'). Der Wert-Anker im Workshop macht es richtig: Einzelteile rechnerisch 11.290 €, Paket-Preis 2.997 € — und die Reihenfolge der 7 Stufen ist das eigentliche Geheimnis."}], "firm": "zentrum", "idee": "Ziel ist eine dauerhaft hohe Closing-Rate — und die bewährte Methodik ins GANZE Team bringen, nicht nur bei einer Person. Aktuell laeuft das Closing fast ausschliesslich ueber den Workshop als einzigen Verkaufskanal. Zwei neue Wege kommen dazu: der Beratungs-Funnel (van den Boom-Stil, Website mit Video) und eine saubere Angebots-Struktur mit klar definierten Paketen. Fundament bleibt: echter Arzt + Therapeuten-Mindset + bewiesene Closing-Methodik."}, {"id": "relounge", "name": "ReLounge (Liege)", "icon": "🛋️", "img": "assets-relounge/hero-opt.jpg", "desc": "#1-Kassenprodukt · Probe → Pakete", "idee": "ReLounge ist das #1-Kassenprodukt (rund 50 % vom POS-Umsatz 2025). Bewiesenes Geschäftsmodell: günstige Probe-Sitzung (~30 €) als Türöffner → Pakete (5er ~218 €, 10er-Vorteil ~400 €). ~146 Proben führten zu ~91 Paketkäufen — die Probe ist der bewiesene Türöffner.\n\nSTAND (wichtig für die %-Logik): Die TECHNIK ist fertig — Hightech-Landingpage live in GHL, Formular funktioniert, Leads landen in GHL. ABER der LAUNCH fehlt: die Werbung läuft noch nicht, ein paar Funnel-Feinheiten und echte Bewertungen fehlen. Also: technisch fast fertig, aber noch nicht 'hochgebracht'.\n\nNÄCHSTER GROSSER SCHRITT: Funnel sauber zu Ende (Formular-Tag, dt. Bestätigung + DSGVO, schöne Mails, Ende-zu-Ende-Test) → Meta-Pixel → Ads scharf schalten. Prinzip Speed-to-Lead = #1-Hebel (Manuela begrenzt → Automatik muss den Rückruf antreiben).\n\n❓ ZU KLÄREN: Welche echten Patienten-Bewertungen dürfen wir verwenden? · Startdatum für die Ads? · Ist die URL /relounge final, oder macht Vincent noch was an der Domain?", "systems": [{"name": "Technik & Funnel (fast fertig)", "idee": "Die Landingpage + der GHL-Funnel. Seite ist live, Formular funktioniert, Leads landen in GHL. Es fehlen noch ein paar Funnel-Feinheiten, bevor die Ads scharf gehen dürfen.", "tasks": [{"t": "Hightech-Landingpage gebaut", "done": true, "idee": "Die Landingpage ist fertig gebaut und live — auf hischamelsobhi.de/relounge (GHL-Hosting). Design mit Arztpraxis-Optik + Personal Branding Hischam, echte Fotos aus assets-relounge/. Angebot: 29,90 € Probe-Sitzung. CRO-Verbesserungen eingebaut: Hero mit 3 Mini-Antworten, Karte + Entfernung, Selbsttest-Quiz, Vertrauens-Leiste, Stufen-Grafik 1-2-3, Formular-first 'wir rufen zurück'."}, {"t": "Live in GHL auf hischamelsobhi.de/relounge", "done": true, "idee": "Die Seite ist über Go High Level (GHL) gehostet und unter der finalen URL hischamelsobhi.de/relounge erreichbar (HTTP 200 bestätigt). Bilder werden von einem öffentlichen GitHub-Pages-Repo gehostet (github.com/hischamelsobhi123-netizen/relounge-landing), damit der Link für Ads fix bleibt. Die .de-Domain trägt auch E-Mail + Kundenportal — DNS wird NICHT angefasst."}, {"t": "GHL-Formular eingebaut, Absenden funktioniert → Leads in GHL", "done": true, "idee": "Das GHL-Formular (ID bTfBja2xxGK06TpXG8HW) ist in die Landingpage eingebettet. Beim Absenden landen neue Leads automatisch als Kontakte in GHL. Das ist die Basis, auf der alle folgenden Automatisierungsschritte aufbauen."}, {"t": "Formular setzt Tag 'relounge-lead' beim Absenden (sonst startet der Workflow nie)", "done": false, "idee": "Der große Retargeting-Workflow 'Relounge und Pelvi Workflow' in GHL startet NUR, wenn der Tag relounge-lead gesetzt wird. Solange das Formular diesen Tag nicht beim Absenden setzt, passiert nach dem Lead-Eingang gar nichts — keine SMS, keine Mail, keine Aufgabe für Manuela. Lösung: in den Formular-Einstellungen ODER per kleinem 'Form→Tag'-Workflow einstellen."}, {"t": "Deutsche Bestätigung + DSGVO-Haken im Formular", "done": false, "idee": "Nach dem Absenden soll der Nutzer eine deutsche Bestätigungsmeldung sehen ('Wir melden uns in Kürze!'). Außerdem braucht das Formular einen DSGVO-Einwilligungs-Haken (Pflichtfeld), damit die Leads rechtlich sauber sind und Ads auf die Seite geschaltet werden dürfen."}, {"t": "Kern-Workflow: Rückruf-Aufgabe + Sofort-SMS + Bestätigungs-Mail", "pct": 50, "idee": "Der Workflow in GHL ist zur Hälfte fertig. Er soll drei Dinge tun, sobald ein Lead reinkommt: (1) automatisch eine Aufgabe für Manuela anlegen (Rückruf), (2) dem Lead sofort eine SMS schicken ('Wir haben deine Anfrage — melden uns gleich'), (3) eine Bestätigungs-Mail senden. Besonders (1) ist der Speed-to-Lead-Hebel, weil Manuela nur begrenzt verfügbar ist."}, {"t": "E-Mails schöner machen (Branding-Vorlagen mit Bild)", "done": false, "idee": "Die automatischen Mails sehen aktuell nach Standard-GHL aus. Plan: die vorhandenen Workshop-E-Mail-Vorlagen (mit Bildern + Branding) duplizieren, auf 'reLounge Bestätigung' + 'reLounge Erinnerung' umbenennen, das reLounge-Foto von GitHub Pages einbinden — dann im Workflow als Vorlage auswählen. Macht einen professionelleren ersten Eindruck beim Lead."}, {"t": "Ende-zu-Ende-Test", "done": false, "idee": "Bevor Ads geschaltet werden, muss der komplette Weg einmal durchgespielt werden: Formular ausfüllen → Lead landet in GHL → Tag relounge-lead gesetzt → Workflow startet → Rückruf-Aufgabe erscheint bei Manuela → SMS geht raus → Bestätigungs-Mail kommt an. Erst wenn das alles klappt, ist der Funnel bereit für bezahlten Traffic."}]}, {"name": "Marketing & Launch (offen)", "idee": "Was fehlt, damit die Werbung scharf geht und Leads sauber nachgefasst werden. Hier liegt der eigentliche Umsatz-Hebel.", "tasks": [{"t": "Echte Patienten-Bewertungen statt Platzhalter", "done": false, "idee": "Auf der Landingpage stehen aktuell Platzhalter-Testimonials. Echte Bewertungen von Patienten steigern das Vertrauen stark — besonders wichtig, da die Google-Bewertungen der Praxis gemischt sind ('fühlt sich nicht ernst genommen'). Zu klären: Welche Patienten dürfen wir namentlich zitieren? Einwilligung einholen. Erst dann echte Testimonials einsetzen."}, {"t": "Meta-Pixel + Lead-Event einbauen", "done": false, "idee": "Damit Facebook-Ads wissen, welche Nutzer das Formular abgeschickt haben, muss ein Meta-Pixel auf der Seite feuern — und zwar genau beim Absenden (Lead-Event). Ohne das: Ads laufen blind, kein Retargeting möglich, kein echter CPL mess bar. Der Pixel wird als Custom Value in GHL hinterlegt (für reLounge + Pelvi getrennt). Stand: Pixel-Zugriff für das Konto 'Relounge Liege' ist über das MCP-Tool eingeschränkt — Ramy muss das direkt in GHL einrichten."}, {"t": "Termin-Erinnerungen 24h/2h + No-Show-Reaktivierung", "done": false, "idee": "Wer einen Probe-Termin bucht, soll 24 Stunden und 2 Stunden vorher automatisch eine Erinnerung bekommen (SMS oder Mail). Wer trotzdem nicht erscheint (No-Show), bekommt eine Reaktivierungs-Nachricht ('Alles ok? Möchten Sie einen neuen Termin?'). Beides reduziert Ausfälle und holt verlorene Leads zurück — ohne manuellen Aufwand für Manuela."}, {"t": "Upsell-Follow-up (3er/5er/10er-Paket)", "done": false, "idee": "Nach der Probe-Sitzung soll automatisch ein Follow-up rausgehen, das zum Paket-Kauf einlädt. Die Daten zeigen: 146 Proben → 91 Paketkäufe, das beliebteste ist das 5er (38×). Ein gezieltes Angebot per SMS/Mail direkt nach der Probe (solange das Erlebnis noch frisch ist) soll diese Conversion weiter steigern."}, {"t": "Google-Bewertungs-Anfrage automatisieren (kontert gemischte Reviews)", "done": false, "idee": "Die Praxis hat gemischte Google-Bewertungen — Kritik wie 'fühlt sich nicht ernst genommen'. Plan: nach einer erfolgreichen Sitzung (oder nach Paket-Kauf) automatisch eine Nachricht senden, die zufriedene Patienten freundlich um eine Google-Bewertung bittet. Mehr positive Bewertungen bauen Vertrauen auf und kontern die negativen — wichtig, da die Landingpage Google-Bewertungen zitieren soll."}, {"t": "Ads scharf schalten", "done": false, "idee": "Noch keine Ads aktiv für reLounge (die alten Kampagnen 'Relounge/HiTop 13.04 Landing Page' sind pausiert, WITH_ISSUES, 6.059 € Spend / 181 Leads). Werbekonto: 'Relounge Liege' (ID 562471560036726). Bevor Ads starten: Pixel einbauen, Ende-zu-Ende-Test, DSGVO-Haken, echte Bewertungen. Dann: neue Kampagne auf die fertige Hightech-Landingpage. Claude kann Kampagnen via Meta-MCP-Connector schalten, wenn Ramy das Okay gibt."}, {"t": "Excel-/Pipeline-Tracking automatisieren", "done": false, "idee": "Aktuell wird die Lead-Tabelle ('Relounge Hitop Recruiting Kontakte' in Google Drive) manuell gepflegt — Status ist Freitext-Chaos, nicht zählbar, mit Doppel-Einträgen. Plan: Leads aus GHL automatisch in eine saubere Pipeline-Ansicht überführen (Stufen: Lead→Kontaktiert→Gebucht→Erschienen→Paket). Noch offen, welches Tool den Sync übernimmt (n8n als Klebstoff geplant). ⚠️ Wichtig: sensible Patientendaten von Marketing-Leads trennen (DSGVO — mit Vincent klären)."}]}], "firm": "praxis"}, {"id": "pelvi", "name": "BetterPelvi (Stuhl)", "icon": "🪑", "img": "assets-pelvi/stuhl-dunkel.jpg", "desc": "Beckenboden-Stuhl · stark wachsend", "systems": [{"name": "Landingpage & Funnel", "tasks": [{"t": "Landingpage komplett gebaut", "done": true, "idee": "Die Landingpage ist fertig und live: https://hischamelsobhi123-netizen.github.io/relounge-landing/landingpage-pelvi.html — auch als GHL-Embed-Datei (outputs/ghl-embed-pelvi.html) bereit. Texte von betterpelvi.com. Angebot: 29,90 € Probe. Aufgebaut wie reLounge, auf Beckenboden umgeschrieben. Enthält: emotionaler Hero ('Wieder unbeschwert lachen, niesen & leben.'), Hightech-Sektion mit pulsierender SVG-Grafik + live Zähler auf 12.500, Vorher/Während/Nachher-Grafiken (SVG), Schichten-Erklärung, 6 Studien-Karten, Frauen+Männer-Block, sticky Sprung-Leiste, Mini-FAQ, Diskret-Vertrauensblock, HWG-Feinschliff (Versprechen → 'Ziel/kann', Footer-Disclaimer)."}, {"t": "Funnel live & getestet (pelvi-lead)", "done": true, "idee": "Der komplette Funnel wurde am 2026-05-31 / 2026-06-01 durchgetestet und funktioniert: Formular 'Pelvi Probe Neu' → Kontakt in GHL → Tag pelvi-lead gesetzt (Tagger-Workflow 'formular eingereicht pelvi') → Workflow 'Relounge und Pelvi Workflow' startet → interne Mail an Manu (mit Name/Telefon/E-Mail des Leads) geht raus → Bestätigungsmail an Lead → 2-Tage-Follow-up wartet. Das ist das Fundament, auf dem die Ads aufgebaut werden."}, {"t": "Interne Mail + Bestätigung + Follow-up", "done": true, "idee": "Alle drei Mails sind aktiv im Workflow: (1) Interne Benachrichtigung an Manu (Betreff + Kontaktdaten des Leads, vorher 'Skipped' weil kein Empfänger → jetzt gefixt), (2) Bestätigungsmail an den Lead, (3) 2-Tage-Follow-up ('Wir würden uns freuen...'). Das stellt sicher, dass kein Lead verloren geht, auch wenn Manuela nicht sofort erreichbar ist."}, {"t": "Eigene Domain (über Vincent)", "done": false, "idee": "Ziel: Pelvi-Seite unter hischamelsobhi.de/pelvi veröffentlichen (analog zu /relounge). Das soll Vincent übernehmen, da er das .de-Setup kennt und kein DNS-Risiko eingeht (die .de-Domain trägt auch E-Mail + Kundenportal). Bis dahin ist der GitHub-Pages-Link ad-tauglich und wird genutzt. Die .com-Domain funktioniert NICHT (HTTPS tot, zeigt auf IONOS) — nicht anfassen."}, {"t": "Echte Testimonials", "done": false, "idee": "Auf der Seite stehen aktuell Platzhalter-Testimonials — ausdrücklich als solche markiert. Vor Ad-Schaltung müssen echte Bewertungen von Patienten rein. Zu klären: Welche Patienten dürfen wir namentlich zitieren (schriftliche Einwilligung nötig)? Nur freigegebene Testimonials verwenden — HWG-konform, keine Heilversprechen durch Zitate."}], "idee": "Die Pelvi-Landingpage wurde nach dem gleichen Muster wie reLounge gebaut und ist live. Der komplette Funnel ist getestet — von der Seite bis zur internen Manu-Benachrichtigung. Das ist der fertigste Teil des Pelvi-Bereichs."}, {"name": "Vor Ads", "tasks": [{"t": "HWG-Rechtsprüfung", "done": false, "idee": "Das Heilmittelwerbegesetz (HWG) regelt streng, was man in der Werbung für medizinische Geräte versprechen darf. Die Pelvi-Seite enthält Aussagen über Beckenboden-Training, Inkontinenz, Blasenschwäche, Männergesundheit und Studienergebnisse. All das muss von einem Fachanwalt für Medizinrecht oder der Ärztekammer geprüft werden, bevor Ads geschaltet werden. Auf der Seite wurde bereits ein HWG-Feinschliff gemacht ('Ziel/kann' statt Versprechen, Footer-Disclaimer, 'schematische Darstellung'), aber die finale Rechtsprüfung steht noch aus."}, {"t": "Meta-Pixel/Tracking", "done": false, "idee": "Damit Facebook-Ads wissen, welche Nutzer das Formular abgeschickt haben, muss ein Meta-Pixel auf der Seite feuern — beim Absenden als Lead-Event. Werbekonto: 'Relounge Liege' (ID 562471560036726) — dasselbe Konto wie reLounge. Der Pixel wird als Custom Value in GHL hinterlegt. Ohne Pixel: Ads laufen blind, kein Retargeting möglich, kein echter CPL messbar. ⚠️ Für dieses Konto ist der Creative-Detail-Abruf und Datasets/Pixel über das MCP-Tool eingeschränkt — Ramy richtet das direkt in GHL ein."}, {"t": "KI-Animation Beckenboden-Muskulatur", "done": false, "idee": "Geplant ist ein kurzes KI-animiertes Video, das zeigt, wie die Beckenboden-Muskulatur beim Training aktiviert wird — Muskulatur dunkelrot hervorheben. Dieses Video soll als Creative für die Ads dienen und das Gerät visuell erklären, ohne dass Hischam dafür filmen muss. Tool-Planung: Creatify (Varianten-Testing) oder ähnlich. Noch nicht ausgearbeitet: welches KI-Video-Tool genau, wie lang das Video sein soll, welcher Stil (medizinisch-seriös oder zugänglich-einfach). Gehört dazu: KI-Video-Pipeline-Entscheidung (Reap + Creatify, bereits recherchiert)."}, {"t": "Ads schalten", "done": false, "idee": "Aktuell läuft nur eine alte Pelvi-Kampagne über ein Facebook-internes Formular (kein externer Link), nicht auf die neue Landingpage. Zahlen (lifetime): FB-Formular 27 €/Lead, alte Landingpage 33 €/Lead, neue Hightech-LP noch ohne Daten. Die neue Hightech-Landingpage soll die Grundlage für die neuen Ads sein — nach HWG-Check, Pixel und echten Testimonials. Werbekonto: 'Relounge Liege' (ID 562471560036726). Claude kann Kampagnen via Meta-MCP-Connector schalten, wenn Ramy das Okay gibt und die Vor-Ads-Schritte erledigt sind."}], "idee": "Vier offene Punkte, die vor dem Schalten von Werbung erledigt sein müssen. Der wichtigste ist der HWG-Check — ohne den darf keine Werbung mit Wirkaussagen (Beckenboden, Inkontinenz, Blasenschwäche) laufen."}], "firm": "praxis", "idee": "BetterPelvi ist der Beckenboden-Stuhl in der Praxis — ein eigenes Gerät neben der ReLounge. Das Modell ist dasselbe: günstige Probe-Sitzung (29,90 €) als Türöffner, dann Pakete (10er 490 €, 40er-Block bis 1.120 €). Das Gerät wächst stark: 2,4 % POS-Anteil in 2025 → 17,9 % in 2026. Technologie: rPMS (repetitive periphere Magnetstimulation), über 12.500 Kontraktionen/Sitzung, vollbekleidet, ~28 Min, nicht-invasiv.\n\nSTAND: Funnel ist komplett live und getestet. Landingpage gebaut, Formular 'Pelvi Probe Neu' eingebunden, Tagger-Workflow setzt Tag pelvi-lead, der Retargeting-Workflow 'Relounge und Pelvi Workflow' läuft durch (interne Mail an Manu + Bestätigungsmail + 2-Tage-Follow-up). Das ist der Stand, den reLounge noch nicht erreicht hat.\n\nNÄCHSTER SCHRITT: Vor Ad-Schaltung → HWG-Rechtsprüfung (Wirkaussagen klären), Meta-Pixel einbauen, echte Testimonials nachliefern. Dann eigene Domain /pelvi über Vincent veröffentlichen (bis dahin: GitHub-Link ist ad-tauglich).\n\n❓ ZU KLÄREN: HWG-Prüfung (Fachanwalt Medizinrecht / Ärztekammer) · Kontraktions-Zahl offiziell (12.500 steht so, Hersteller-Aussage) · welche echten Testimonials dürfen wir zeigen?"}, {"id": "ads", "name": "Ads & Marketing", "icon": "📣", "img": "", "desc": "Facebook/Meta-Ads, Tracking, Konkurrenz", "systems": [{"name": "Kampagnen Juli", "tasks": [{"t": "2-3 Kampagnen geplant (Pixel je Kampagne)", "done": true, "idee": "Die Kampagnen-Struktur ist fertig durchdacht: 3 Kampagnen, je eigener Pixel (oder URL-getrennte Conversions als schlankere Variante), je eigene Landingpage. Dokumentiert in outputs/auftrag-hischam-ads-juli.md. Machbarkeit geprueft: Claude kann Kampagnen/AdSets/Creatives ueber MCP (Konto Leadmagnet) anlegen. Pixel anlegen = Vincent."}, {"t": "Regionales Targeting (120km Uchte)", "done": false, "idee": "Separate Kampagne mit Umkreis-Targeting fuer Frauen in ~120 km um Uchte. Mehrere Kreise noetig fuer flaechendeckende Abdeckung: Braunschweig/Wolfsburg im Osten, Muenster im Suedwesten, Bremen/Oldenburg im Norden, Hameln im Sueden. Regionale Leads sind doppelt wert: online-Webinar-Teilnehmer + koennen auch in die Arztpraxis kommen (Blutabnahme, ReLounge, Pelvi, Therapie)."}, {"t": "Retargeting (Juli) + Lookalike", "done": false, "idee": "Auf die ~1.700 bestehenden Leads (aus bisherigen Kampagnen) eine Retargeting-Kampagne fahren. Parallel: Lookalike-Audience auf Basis dieser 1.700 (braucht 5 Wochen Vorlauf). DSGVO-Frage mit Vincent klaeren, bevor Retargeting laeuft. Bewusst auf Juli verschoben – Vorlauf-Zeit reicht nicht fuer Juni."}, {"t": "AT/CH-Optimierung", "done": false, "idee": "Oesterreich und Schweiz haben hoehere Kaufkraft als Deutschland. Der Workshop laeuft online (kein Standort relevant) → DACH-weite Schaltung macht Sinn. Bisher noch keine eigenen Kampagnen oder kreativen Anpassungen fuer AT/CH. Noch nicht ausgearbeitet. Gehoert dazu: Sprache/Dialekt-Anpassung (Schweiz: kein 'ß'), ggf. separate AdSets mit eigenem Budget."}], "idee": "3 Kampagnen geplant fuer den Juli-Workshop: Kampagne 1 (LP 'Welcher Typ'), Kampagne 2 (LP '7 Schritte'), Kampagne 3 (regional ~120 km Uchte). Jede Kampagne bekommt einen eigenen Pixel und eine eigene Landingpage. Start: ab ~7. Juni (4–5 Wochen Vorlauf). Retargeting (auf die ~1.700 bestehenden Leads) ist bewusst auf Juli verschoben – DSGVO mit Vincent klaeren."}, {"name": "Tracking & Analyse", "tasks": [{"t": "Meta-Connector verbunden", "done": true, "idee": "Der Meta-Ads-MCP-Connector ist aktiv und abfragbar fuer Konto 'Leadmagnet' (ID 1176709736988872). Claude kann damit echte Zahlen ziehen: Impressionen, Klicks, Ausgaben, Leads, CPL. Konto 'Coaching Hischam El-Sobhi' ist von Facebook gesperrt (ungewoehnliche Aktivitaet) – Ads dort pausiert."}, {"t": "Lead vs. Event geklärt (echte CPL)", "done": true, "idee": "Hischams Frage 'Warum zeigt FB 5–11 Euro, meine Tabelle 16 Euro?' ist beantwortet: FB zaehlt 'Events' = Pixel-Feuer (Browser-Signal, doppelt, Attributions-Anspruch, teils geschaetzt). Die echte Zahl = entdoppelte Namensliste in GHL = ~16 Euro/Lead. Dokumentiert in outputs/analyse-tracking-leads-vs-events-2026-05-31.md. 16 Euro liegt weit unter Schmerzgrenze – kein Grund zur Panik."}, {"t": "Eine Wahrheits-Zahl (GHL)", "done": false, "idee": "Ziel: jede Woche eine einzige, verbindliche Zahl. Quelle: GHL (entdoppelte Namensliste). Aktuell noch manuell → spaeter Automatik via n8n. Diese Zahl entscheidet, ob Kampagnen laufen oder gestoppt werden – nicht die FB-Zahl. UTM-Parameter pro Anmelde-Link wuerde spaeter zeigen, welche Quelle/Kampagne die besten Leads liefert."}, {"t": "Wöchentlich 3 echte Zahlen ziehen", "done": false, "idee": "Setup-Ziel: jede Woche automatisch (oder halbautomatisch) 3 Zahlen aus GHL ziehen – 1) echte Leads diese Woche, 2) Show-Up-Rate (Zoom-Report), 3) CAC (Cost per Acquisition, echte Abschluesse). Erst dann kann datenbasiert optimiert werden. Spaeter: n8n-Automatik. Noch nicht ausgearbeitet. Gehoert dazu: Zoom-Report anpassen, GHL-Pipeline-Stufen definieren."}], "idee": "Das Kern-Problem: Drei Datenquellen (FB-Zahl, GHL, Excel-Tabelle) zeigen verschiedene Zahlen. Die FB-Zahl (5–11 Euro/Lead) ist FALSCH als Entscheidungsgrundlage – sie zaehlt Pixel-Feuer, nicht echte Menschen. Die verbindliche Zahl ist die entdoppelte Namensliste in GHL (~16 Euro/Lead, weit unter Schmerzgrenze 40–50 Euro). Jetzt braucht es eine einzige Wahrheits-Zahl pro Woche."}, {"name": "Konkurrenz & Creatives", "tasks": [{"t": "Konkurrenz-Analyse (4 Player tief)", "done": true, "idee": "Tiefenanalyse von 4 aktiven Werbern in der Meta-Bibliothek: Daniel van den Boom (35 Anzeigen, Video-Dauerlaeufer + Einzel-Testimonials), Easylife (177 Anzeigen, Massenskalierung eines Hook-Gewinners), Quantum Leap (24 Anzeigen, Quiz-Funnel), DAA Weiden (15 Anzeigen, Deadline-Verknappung). Kernmuster: alle nutzen kostenlosen Test/Quiz als Einstieg, Video dominiert, Gewinner-Hook monatelang skalieren. Voll dokumentiert in outputs/konkurrenz-deepdive.md."}, {"t": "Ad-Skripte (7 Pakete) gebaut", "done": true, "idee": "7 schaltfertige Meta-Ad-Pakete in outputs/ad-skripte.md. Jedes Paket enthaelt: Regie-Anweisung fuer Hischam beim Drehen, On-Screen-Text, Primary Text, Headline, Button-Text. Formate: 3-Typen-A/B (mit/ohne Typen-Namen), Testimonial-Ad, Wetter-/Anlass-Format, Nachschub-Baukasten fuer endlosen Nachschub aus Workshop-O-Toenen. Neugier-Regel beachtet: LP verraat nicht den Inhalt."}, {"t": "Quiz-Lead-Magnet aus 9-Fragen-Quiz", "done": false, "idee": "Das 9-Fragen-Stoffwechseltyp-Quiz aus dem Webinar (Garten-Typen A/B/C/M) kann als eigenstaendiger Lead-Magnet geschaltet werden – VOR dem Workshop. Damit holt man Frauen, die sich noch nicht fuer ein Webinar anmelden wuerden, aber ihre Ergebnisse sehen wollen. Alle 4 Hauptkonkurrenten nutzen genau dieses Muster. Hischams Version ist staerker: 'ausgewertet vom Arzt' statt vom Studio. Noch zu bauen: Quiz-Landingpage + Ergebnis-Seiten (A/B/C/M) + GHL-Workflow."}], "idee": "Die Nische ist klar: alle Hauptkonkurrenten (van den Boom, Easylife, Quantum Leap, DAA) nutzen einen kostenlosen Quiz/Test als Lead-Magnet und fahren Video-Ads. Hischam hat beides schon: das 9-Fragen-Stoffwechseltyp-Quiz aus dem Webinar + 7 fertige Ad-Skript-Pakete. Der groesste Vorteil gegenueber allen: echter Arzt + echte Laborwerte (Konkurrenz = Coaches/Ketten). Das Quiz als eigenstaendiger Lead-Magnet VOR dem Workshop ist der naechste logische Schritt."}], "firm": "zentrum", "idee": "Das Ziel: buchende Frauen gewinnen – nicht nur Klicks. Der Workshop-Funnel laeuft ueber Meta-Ads (DACH-weit + regional). Aktuell laeuft eine erfolgreiche Kampagne ('Workshop Juni – Kopie', ~12–16 Euro/Lead). Ab ~7. Juni startet die Kampagne fuer den Juli-Workshop. Engpass ist NICHT der Lead-Preis (weit unter Schmerzgrenze), sondern Show-Up-Rate und Closing. Verbindliche Zahl = GHL (nicht die FB-Zahl, die Events = Pixel-Feuer statt echte Namen zaehlt)."}, {"id": "programm", "name": "Gesundheits-Programm", "icon": "🌱", "img": "", "desc": "6-Monats-Begleitung (Essence-System)", "systems": [{"name": "Kern-Leistung", "tasks": [{"t": "5-Säulen-Modell Coaching", "done": true, "idee": "Das Fundament des Programms ist fertig. Die 5 Saulen sind: (1) Ernaehrungsmedizin (Versorgung, nicht Diaet), (2) Darm & Vitalstoffe (das Fundament), (3) Hormone & Nervensystem (die Steuerebene), (4) Mentale Gesundheit, (5) Bewegung (zum richtigen Zeitpunkt). Die Reihenfolge der 7 Schritte ('Selbstakzeptanz → Neuprogrammierung → Hormone als Verbuendete → Ernaehrung → Disziplin → Blockaden → neues Ich') ist der Kern-Unterschied zur Konkurrenz. Dokumentiert in outputs/workshop-wissensbasis/02-block4.md."}, {"t": "Laboranalyse (Metabolic-Check)", "done": true, "idee": "Die aerztliche Laboranalyse ist Teil des Pakets und der staerkste Unterschied zu jedem Coach. Fuenf Achsen werden geprueft: Cortisol-Tagesprofil (Stresshormone), TSH/fT3/fT4/Antikoerper (Schilddruese), HbA1c/Nuechterninsulin (Insulin/Blutzucker), Vitamin D/B12/Eisen/Magnesium/Zink/Omega-3 (Vitalstoffe), CRP/GGT/ALT/AST (Entzuendung/Leber). Das Basislabor ist im 2.997-€-Paket enthalten. Spezialdiagnostik (Mikrobiom, erweiterte Genetik) kann extra vereinbart werden."}, {"t": "Gruppencalls + 1:1 (Team)", "done": true, "idee": "Woechentliche Gruppencalls (26 Wochen) und monatliche 1:1-aerztliche Gespraeche sind im Paket enthalten. Die Gruppencalls laufen online — was ein Vorteil ist: mehr Kontakt dort, wo der Alltag der Patientin passiert, und mehr Gemeinschaft unter Teilnehmerinnen. Das 'Online'-Argument wird bewusst als Staerke geframt, nicht als Schwaeche."}, {"t": "Ernährungsmanager (digital, 2000+ Rezepte)", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Ein digitales Tool, das die Teilnehmerin durch ihre individuelle Ernaehrung fuehrt — 2000+ Rezepte, angepasst an ihren Stoffwechseltyp und ihren Alltag. Nicht fuer die Frau mit unbegrenzter Zeit, sondern fuer die mit echtem Alltag. Dieses Tool ist im Wert-Anker mit 1.200 € bewertet (Teil der 11.290-€-Rechnung im Workshop). Status: noch nicht gebaut/integriert."}, {"t": "Akademie/Kurse strukturieren", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Eine strukturierte Kurs-Bibliothek fuer Teilnehmer — Video-Module zu den 5 Saeulen, Ernaehrungsmodule, Schlaf/Stress-Module, Bonus-Inhalte. Im Wert-Anker als 'Bonus-Module' mit 1.400 € bewertet. Ziel: Teilnehmer koennen jederzeit auf Inhalte zurueckgreifen, ohne Hischam oder das Team zu belasten."}], "idee": "Was der Kunde im 6-Monats-Weg konkret bekommt. Drei Bausteine sind aktiv: das 5-Saeulen-Coaching-Modell, die aerztliche Laboranalyse (5 Achsen: Cortisol, Schilddruese, Insulin/Blutzucker, Vitalstoffe, Entzuendung/Leber) und die laufende Begleitung durch Gruppen- und Einzelgespraeche. Zwei Bausteine fehlen noch: der digitale Ernaehrungsmanager und die strukturierte Akademie/Kurse."}, {"name": "Begleitung", "tasks": [{"t": "WhatsApp-Begleitung (bis 28 Tage)", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Ein standardisiertes System fuer die WhatsApp-Begleitung in den ersten 28 Tagen (dem intensivsten Programmabschnitt). Wer sendet was wann? Template-Nachrichten fuer typische Situationen (erste Woche, Rueckfall, kein Rueckmeldung). Automatisierte Erstmeldungen ('Entgiftung Tag 1: Wie geht's dir?') erhoehen Betreuungs-Qualitaet ohne mehr Personalaufwand. Verknuepft mit WhatsApp Business API (noch nicht live) und GHL."}, {"t": "Erinnerungs-System (Tag 1/7/…)", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Automatische Check-in-Meldungen an definierten Tagen (Tag 1, Tag 7, Tag 14, Tag 28, Woche 12 usw.). Ziel: Teilnehmer spueren Betreuung auch dann, wenn kein Gruppencall und kein 1:1 ist. Technisch ueber GHL-Workflows oder n8n realisierbar. Verhindert das stille Abgleiten (Stille-Kunden-Fruehwarnung)."}, {"t": "Rückfallprophylaxe", "done": false, "idee": "Noch nicht erledigt. Gehört dazu: Der Programmabschnitt Woche 13-26 (laut Block-4-Struktur) ist inhaltlich auf Rueckfallprophylaxe und neue Identitaet ausgerichtet. Das braucht konkrete Materialien: wie erkennt die Teilnehmerin fruehzeitig, dass sie abrutscht? Was tut sie dann? Welche Signale sendet sie ans Team? Dieses System ist noch nicht verschriftlicht oder als Kurs-Modul ausgebaut."}], "idee": "Das, was den Unterschied macht zwischen 'Wissen kaufen' und 'Weg gehen'. Die 6-Monats-Begleitung hat drei Kontaktpunkte: WhatsApp (taeglich erreichbar, bis 28 Tage intensiv), Erinnerungs-System (automatisierte Checks an kritischen Tagen) und Rueckfallprophylaxe (Woche 13-26 des Programms). Alle drei sind noch nicht vollstaendig ausgebaut — das ist der groesste offene Baustein. Kernaussage aus Block 4: 'Tragen passiert im Alltag — Montag 7 Uhr, Mittwoch 3 Uhr nachts, Sonntag 19 Uhr. Wenn der Alltag sich biegt, hast du eine Hand.'"}], "firm": "zentrum", "idee": "Das Kern-Produkt des Zentrums: eine 6-monatige aerztliche Begleitung fuer 2.997 €. Kein Coaching, keine Diaet — sondern ein strukturiertes System mit 5 Saeulen (Ernaehrungsmedizin, Darm/Vitalstoffe, Hormone/Nervensystem, Mentale Gesundheit, Bewegung). Unfairer Vorteil: Hischam ist echter Arzt, liest Blutwerte und verschreibt Medikamente — das kann kein Coach. Die Reihenfolge ist das Geheimnis: erst Schilddruese/Insulin stabilisieren, dann Vitalstoffe, dann Ernaehrung anpassen. Aktuell laeuft das Programm, aber Teile der Begleitung (WhatsApp-System, Erinnerungen, Akademie) sind noch nicht vollstaendig ausgebaut."}, {"id": "nahrung", "name": "Nahrungsergänzung", "icon": "💊", "img": "", "desc": "Großes, noch unausgeklügeltes Projekt", "systems": [{"name": "❓ Erst ausklügeln: die ganze Idee", "idee": "Diese Punkte sind noch keine Aufgaben zum Abhaken — sie muessen zuerst durchdacht und entschieden werden. Jeder Baustein wird hier ausgearbeitet, bis daraus konkrete Schritte werden.", "tasks": [{"t": "Welche Produkte? Eigene Rezeptur oder White-Label?", "q": true, "idee": "Hier muss entschieden werden: Welche Produkte sollen verkauft werden — Vitamin-D, Magnesium, Omega-3, Stoffwechsel-Komplex? Und: eigene Rezeptur (dauert laenger, hoeherer Aufwand, einzigartig) oder White-Label (fertiger Hersteller gibt sein Produkt mit eigenem Branding raus, schneller + guenstiger)? Die Entscheidung haengt von Budget, Zeitplan und dem gewuenschten Alleinstellungsmerkmal ab. Zur Orientierung: Was empfiehlt Hischam im Workshop schon heute? Das sind die naheliegendsten Produkte."}, {"t": "Branding entwickeln (Name, Optik, Arzt-Gesicht)", "q": true, "idee": "Beim Branding geht es um vier Dinge: (1) Name der Marke — einpraegsam, medizinisch-serioeos, zur Zielgruppe passend. (2) Optik — Logo, Farben, Verpackungsdesign, das Vertrauen ausstrahlt. (3) Arzt-Gesicht — Hischams Foto und Name als zentrales Vertrauens-Element auf Verpackung und Website. (4) Abgrenzung zu anderen Supplement-Anbietern (kein Discounter-Look). Erst wenn diese vier Punkte entschieden sind, koennen Verpackungen und Website gebaut werden."}, {"t": "Hersteller/Supplier für eigene Marke finden", "q": true, "idee": "Es braucht einen Hersteller, der Nahrungsergaenzungsmittel nach eigener Rezeptur oder als White-Label produziert und die Verpackung mit dem eigenen Branding befuellt. Zu klaerende Punkte: Mindestmengen (oft 500–1.000 Stueck), Zertifizierungen (GMP), Lieferzeiten, Preise pro Einheit, ob der aktuelle Vor-Ort-Supplier auch Online-Mengen liefern kann. Erst dann laesst sich die Marge berechnen."}, {"t": "Online-Shop: Plattform + Aufbau", "q": true, "idee": "Hier muss entschieden werden, WO verkauft wird: eigener Shop (z.B. Shopify, WooCommerce) oder Marktplatz (Amazon, eigene GHL-Bestell-Seite). Shopify ist schnell startbereit, WooCommerce flexibler. GHL kann einfache Produkte direkt abwickeln (passt zur bestehenden Infrastruktur). Zu klaeren: Bezahlung (PayPal, Karte), Bestellverwaltung, Ruecksendungen, Anbindung ans Lager/Versand."}, {"t": "Marketing-Strategie (Kanäle, Ads, über den Arzt)", "q": true, "idee": "Der groesste Hebel ist die bestehende Reichweite: Workshop-Teilnehmer, Praxis-Patienten, Social-Media-Follower von Hischam. Das sind bereits warme Kontakte, die dem Arzt vertrauen. Zu entscheiden: (1) Empfehlung im Workshop einbauen ('Das nehme ich selbst') — sofort Umsatz ohne Ads. (2) Meta-Ads gezielt auf warme Zielgruppe (Retargeting bestehender Leads). (3) Organischer Content (Hischam erklaert, warum er dieses Produkt empfiehlt). Reihenfolge: erst warme Kanaele nutzen, dann Ads."}, {"t": "Rechtliches: Health-Claims / HWG für Supplements", "q": true, "idee": "Nahrungsergaenzungsmittel duerfen in Deutschland keine Heilversprechen tragen (HWG = Heilmittelwerbegesetz, HCVO = Health-Claims-Verordnung EU). Was erlaubt ist: allgemeine Naehrstoff-Bezuege ('Vitamin D traegt zur normalen Funktion des Immunsystems bei'). Was verboten ist: konkrete Krankheits-Bezuege ('heilt Rueckenschmerzen'). Zu klaeren mit Fachanwalt: Texte auf Verpackung, Webseite, Ads. Das ist kein optionaler Schritt — ohne rechtliche Pruefung darf nichts veroeffentlicht werden."}, {"t": "Logistik & Versand", "q": true, "idee": "Zu entscheiden: Wer versendet? Optionen: (a) Selbst (Lager in der Praxis, Pakete selbst einschicken — guenstig, aber zeitaufwaendig), (b) Fulfillment-Dienstleister (z.B. Byrd, DHL Fulfillment — hoeherer Preis, komplett ausgelagert), (c) Dropshipping direkt vom Hersteller. Ausserdem: Retourenabwicklung, Verpackungsmaterial, Versandkosten ab wann kostenlos, Lieferzeiten. Faustregel: fuer den Start (klein) ist Selbstversand moeglich, ab ~100 Bestellungen/Monat lohnt Fulfillment."}]}, {"name": "Basis (läuft schon)", "idee": "Das, was es heute schon gibt — die Ausgangslage. Nahrungsergaenzungsmittel werden direkt in der Praxis verkauft, ein Supplier ist vorhanden. Das ist der Beweis, dass Nachfrage da ist. Alles Weitere (Online, Branding, Ads) baut darauf auf.", "tasks": [{"t": "Vor-Ort-Verkauf in der Praxis", "done": true, "idee": "Schon vorhanden: Nahrungsergänzung wird in der Praxis direkt an Patienten verkauft — die Basis, auf der die eigene Marke aufbauen soll."}, {"t": "Supplier (für Vor-Ort) vorhanden", "done": true, "idee": "Für den aktuellen Vor-Ort-Verkauf gibt es bereits Lieferanten. Für die eigene Marke muss aber ein passender Hersteller / White-Label-Supplier neu gefunden werden (siehe Baustein oben)."}]}], "firm": "praxis", "idee": "STAND: Bisher werden Nahrungsergaenzungsmittel NUR vor Ort in der Praxis verkauft (Supplier vorhanden). Sonst nichts — kein Branding, kein Online-Shop, kein Marketing, kein Online-Verkauf. Ein RIESIGER, noch unausgeklueegelter Bereich.\n\nDIE VISION (Zentrum): Eine eigene Nahrungsergaenzungs-MARKE mit dem Gesicht des Arztes -> hohe Glaubwuerdigkeit + Marge. Ueber Workshop/Praxis/Reichweite 'fast versichert profitabel'.\n\nWICHTIG: Das ist KEINE Checkliste — die ganze Idee muss erst AUSGEKLUEGELT werden. Unten steht, was ueberhaupt entschieden/entwickelt werden muss (offene Bausteine), nicht zum Abhaken.\n\nVerknuepft: Praxis (Vor-Ort-Verkauf = Basis) + Zentrum-Vision (Online-Marke)."}, {"id": "heft", "name": "Gesundheitsanalyse-Heft", "icon": "🩺", "img": "", "desc": "Kennenlerngespräche skalieren", "systems": [{"name": "Heft entwickeln", "tasks": [{"t": "Konzept ausgearbeitet", "done": true, "idee": "Das vollständige Konzept ist fertig und dokumentiert. Kernidee: persönliches Heft mit 6 Bausteinen (Anamnese, Stressprofil, Laborwerte allgemein + individuell, Metaboliccheck, Stoffwechsel-Boxen, Zusammenfassung). Ablauf im Funnel: im Closing versprechen → nach Kauf aushändigen → bei Fragen kürzerer Termin mit Hischam ODER Emine/Patricia mit Skript. Volles Konzept: outputs/konzept-gesundheitsanalyse-heft.md."}, {"t": "Kennenlern-Transkripte auswerten", "done": false, "idee": "Aus ~100 Kennenlerngespräch-Transkripten die wiederkehrende Struktur herausarbeiten: Was fragt Hischam immer? (Beruf, Ziele, Alltagsprobleme, Lebenssituation, Schlaf …) Diese Fragen werden das Gerüst des Hefts, damit das Heft das Gespräch quasi nachbaut und die häufigsten Fragen vorab systematisch abdeckt. Noch nicht gestartet — Claude braucht dafür die Audios oder Transkripte."}, {"t": "Heft-Struktur (Anamnese+Labor+Plan)", "done": false, "idee": "Die eigentliche Heft-Vorlage bauen: 6 Bausteine (Anamnese, Stressprofil/Tagesprofil, Laborwerte allgemein erklärt, individuelle Laborinterpretation, Metaboliccheck-Messungen, Stoffwechsel-Boxen/Einordnung, Zusammenfassung + To-do). Allgemeiner Teil skaliert für alle; individueller Teil wird je Patient befüllt. Außerdem: Ampel-/Triage-System (rote Flags = Diabetes/Prädiabetes/Schilddrüse/Gicht zwingend zum Arzt; grüne = Heft + Personal reicht). Noch nicht gestartet."}, {"t": "Laborwert-Interpretation automatisiert", "done": false, "idee": "Einmal eine Laborwert-Bibliothek bauen: pro Wert (GPT, GOT, Gamma-GT, TSH …) ein allgemeiner Erklärtext + bei Abweichung ein vorformulierter individueller Einordnungstext. KI befüllt dann den Patienten-Teil automatisch, Hischam gibt frei. Noch nicht gestartet — braucht zuerst anonymes Beispiel-Labor als Muster."}, {"t": "Rechtlich mit Hischam abklären", "done": false, "idee": "Das Heft spielt im Zentrum für Gesundheitsmedizin (KEINE Arztpraxis). 'Vom Arzt erstellt' und Diagnose-Sprache müssen rechtlich sauber formuliert sein — keine Heilversprechen, kein Übersehen von medizinisch kritischen Befunden. Hischam und ggf. Rechtsberatung müssen das freigeben, bevor das Heft live geht."}], "idee": "Die Entwicklung des Hefts läuft in zwei Phasen: erst die Struktur aus den Kennenlerngespräch-Transkripten destillieren (welche Fragen kommen immer?), dann den Heft-Aufbau bauen (Anamnese + Laborwert-Bibliothek allgemein + individuelle Einordnung + Metaboliccheck + Stoffwechsel-Boxen + Zusammenfassung). Parallel: rechtliche Abgrenzung mit Hischam klären (Zentrum für Gesundheitsmedizin, KEINE Arztpraxis — Diagnose-Sprache sauber halten). KI bereitet vor, Hischam gibt frei — das ist nicht verhandelbar."}], "firm": "zentrum", "idee": "Hischam führt pro Workshop 20–25 Kennenlerngespräche à 30–40 Min — das ist ein riesiger Zeitfresser und verhindert Skalierung. Die Lösung: ein schön gestaltetes, persönliches 'Deine Gesundheitsanalyse'-Heft, das dem Patienten nach dem Kauf ausgehändigt wird. Es enthält Anamnese, Stressprofil, allgemeine Laborwert-Erklärungen, individuelle Interpretation, Metaboliccheck-Messungen, Stoffwechsel-Einordnung und eine Zusammenfassung — alles strukturiert nach den häufigsten Fragen aus ~100 Kennenlerngespräch-Transkripten. Arzt-Branding bleibt: Hischam gibt das Heft final frei, aber Routinefragen übernehmen Emine/Patricia mit Skript. Schon im Closing versprechen: 'Du bekommst eine schriftliche Gesundheitsanalyse vom Arzt.' Verbindung zur Skalierung: weniger Arzt-Zeit pro Kopf, trotzdem individuelle ärztliche Betreuung."}, {"id": "portal", "name": "Patientenportal 2.0", "icon": "🏥", "img": "", "desc": "Gemeinsame Wahrheit (Vincent baut)", "systems": [{"name": "Portal", "tasks": [{"t": "Portal 2.0 entwickeln", "done": false, "idee": "Der Aufbau der gemeinsamen Grundstruktur. Entschieden werden muss: welche Daten werden zentralisiert (Kontakte, Leads, Patienten, Umsatz), wer hat welchen Zugriff (Ramy / Vincent / Manu / Emine / Patient), auf welcher Basis wird gebaut (eigene Anwendung oder Erweiterung bestehender Tools). Vincents 3 Akzeptanz-Kriterien muessen erfuellt sein: nicht vom Alltagsgeschaeft ablenken, nicht mehr Arbeit als vorher, einfach starten."}, {"t": "Vertriebstabelle + Statistiken", "done": false, "idee": "Eine zentrale Tabelle, die zeigt: Wer ist gerade wo im Verkaufs-Prozess? Wie viele Leads, wie viele Erstgespraeche, wie viele Abschluesse? Woher kommen die Leads (Kanal)? Was ist die Closing-Rate? Das ersetzt die aktuell zersplitterten Excel-/GHL-/Notion-Aufzeichnungen. Ziel: Ramy sieht auf einen Blick die echten Zahlen — ohne suchen."}, {"t": "Befunde-Integration (Lab/IgG/BioVis)", "done": false, "idee": "Laborwerte aus verschiedenen Quellen (z.B. Lab, IgG-Test, BioVis-Darmanalyse) sollen direkt im Portal abrufbar sein — nicht mehr als PDFs per Mail hin- und herschicken. Zu klaeren: Wie kommen die Daten ins Portal (manueller Upload, automatische Schnittstelle)? In welchem Format? Wer darf welche Befunde sehen (Datenschutz)? Das ist der erste Schritt zur KI-gestuetzten Auswertung spaeter."}, {"t": "Patient-Frontend (Pläne/Videos/Upload)", "done": false, "idee": "Der Patient bekommt einen eigenen Bereich: sein persoenlicher Plan (Ernaehrung, Bewegung, Supplements), Videos aus der Akademie, Upload-Moeglichkeit fuer eigene Befunde oder Fortschrittsfotos. Ziel: weniger Rueckfragen per WhatsApp, mehr Eigenverantwortung beim Patienten, besseres Ergebnis. Muss einfach bedienbar sein (auch fuer aeltere Patienten)."}], "idee": "Der Kern des Portals: eine gemeinsame Datenbasis, auf die Ramy, Vincent und das Team jederzeit zugreifen koennen. Vier Bausteine muessen rein: das Portal selbst (Grundgeruest), eine Vertriebstabelle mit echten Zahlen, die Befunde-Integration (Labordaten aus Lab/IgG/BioVis direkt im Portal abrufbar) und ein Patient-Frontend (Patient sieht seinen eigenen Plan, Videos, kann Dokumente hochladen). Reihenfolge: erst Grundgeruest + Vertriebstabelle, dann Befunde, dann Patient-Frontend."}, {"name": "KI im Portal", "tasks": [{"t": "KI-Transkription Anamnese", "done": false, "idee": "Hischam fuehrt Erstgespraeche — die KI schreibt sie automatisch mit und erstellt daraus eine strukturierte Anamnese. Basis: Whisper (Transkriptions-Tool ist schon gebaut). Was fehlt: Integration ins Portal, sodass das Transkript direkt beim richtigen Patienten landet und nach Schluesselthemen (Symptome, Medikamente, Ziele) strukturiert wird. Spart Hischam viel Tipp-Zeit."}, {"t": "KI-Chatbot mit Wissensbasis", "done": false, "idee": "Ein Chatbot, der haefige Patientenfragen automatisch beantwortet — basierend auf Hischams echtem Wissen (Workshop-Inhalte, FAQ, Programm-Informationen). Patienten muessen nicht mehr auf Hischam warten fuer einfache Fragen ('Wann nehme ich Vitamin D ein?'). Grenze: medizinische Einzelfallentscheidungen trifft immer Hischam, nicht der Bot. Basis: Workshop-Wissensbasis ist schon angelegt."}, {"t": "Stille-Kunden-Frühwarnung", "done": false, "idee": "Der wichtigste KI-Hebel im Portal (Backlog-Prioritaet #1). Das System erkennt automatisch, welche Patienten/Kunden abtauchen — keine Anmeldung mehr, keine Reaktion auf Mails, kein Fortschritt gemeldet. Fruehwarnung: das Team bekommt eine Meldung und kann aktiv nachfassen, bevor der Kunde abspringt. Zaehlt direkt auf Kundenbindung und Umsatz ein."}], "idee": "Drei KI-Funktionen, die spaeter ins Portal eingebaut werden — wenn das Grundgeruest steht. Sie sparen Hischam und dem Team Zeit und erhoehen die Qualitaet der Betreuung. Reihenfolge: erst Portal-Basis, dann KI drauflegen."}], "firm": "praxis", "idee": "Das Problem: Die Daten der Firma sind heute auf drei Orte verteilt — Notion, GHL und das alte Portal. Niemand hat gerade einen vollstaendigen Ueberblick. Portal 2.0 ist die Loesung: EINE gemeinsame Wahrheit fuer alle Bereiche — Vertrieb, Finanzen, Patienten, Stille-Kunden. Vincent baut es. Das ist der groesste strukturelle Hebel fuer die Firma. Alles andere (Automatisierungen, KI, Auswertungen) wird spaeter darauf aufgesetzt."}, {"id": "ki", "name": "KI-Systeme & Bots", "icon": "🤖", "img": "", "desc": "Die selbst-bauende Infrastruktur", "systems": [{"name": "Schon gebaut", "tasks": [{"t": "Mindmap (digitaler Zwilling, 3 Seiten)", "done": true, "idee": "Die Mindmap ist der digitale Zwilling beider Firmen. Seite 1 = Firmen-Bereiche (Zentrum + Praxis, mit Firmen-Boxen, Box-Springen per Pfeiltasten, Mausrad-Zoom). Seite 2 = 'Was Claude baut' (Backlog, Schon gebaut, Bis-Workshop, Ideen-Eingang für Ramys ~30 Ideen/Tag). Seite 3 = Hischams Ideen und To-dos (für ihn am Handy nachschaubar). Fester Handy-Link über ngrok: https://liquefy-autograph-saucy.ngrok-free.dev/r4my9x2k7qf3w8tz — ändert sich nicht mehr."}, {"t": "Command Center (To-do-App)", "done": true, "idee": "Eine Luxus-To-do-Web-App fürs Team. Live auf GitHub Pages. Enthält Feedback-Knopf + Sprachnachricht-Funktion, damit Mitarbeiter Verbesserungsvorschläge per Sprache einschicken können — ohne tippen zu müssen. Noch nicht für alle Mitarbeiter freigeschaltet (Accounts + Login fehlen noch). Details unter dem Bereich 'Command Center (Team)'."}, {"t": "Transkriptions-Tool (Whisper)", "done": true, "idee": "Ein lokales, offline laufendes Tool, das Audio-Dateien (Workshops, Zoom-Calls, Hischam-Sprachnotizen) per OpenAI Whisper in Text umwandelt. Läuft auf Ramys PC, keine Cloud-Abhängigkeit, kein Datenschutz-Risiko für Patienten-Audios. Basis für alle weiteren Auswertungen: Workshop-Analyse, Closing-Analyse, Kennenlerngespräche, Video-Pipeline-Untertitel."}, {"t": "Jarvis Telegram-Bot", "done": true, "idee": "Persönlicher Notiz-Assistent von Ramy (@ramy1bot). Ramy schickt ihm Sprachnotizen oder Texte — der Bot transkribiert und speichert sie strukturiert. Läuft über die Claude-API. Verbindet die zwei Firmen: Zentrum für Gesundheitsmedizin und Arztpraxis El-Sobhi. Wichtig beim lokalen Start: Sandbox aus + .env override=True, sonst Timeout/Auth-Fehler."}, {"t": "Feedback-Knopf → feedback.md", "done": true, "idee": "Ein oranges Fragezeichen-Symbol (❓) auf allen drei Mindmap-Seiten. Wer etwas auffällt, klickt drauf, schreibt eine kurze Meldung — die landet automatisch in telegram-bot/feedback.md (neueste oben, mit Datum + Seite). Getestet und funktioniert. Schwachstelle: Meldungen kommen nur in der Datei an, noch nicht automatisch bei Ramy aufs Handy oder in seine To-do-Liste."}], "idee": "Diese Werkzeuge sind fertig und laufen bereits. Sie bilden das Fundament für alle weiteren KI-Systeme."}, {"name": "Pflicht-Systeme (hohe Prio)", "tasks": [{"t": "Feedback → Ramys Handy/To-do", "done": false, "idee": "Der Feedback-Knopf (Mindmap + Command Center) schreibt heute nur in eine Datei — Ramy sieht das nicht, wenn er nicht aktiv nachschaut. Ziel: feedback.md wird automatisch weitergeleitet, sobald ein Eintrag reinkommt — per Telegram-Push auf Ramys Handy ODER als neuer Eintrag in seiner täglichen To-do-Liste im Command Center. Beispiel: Hischams Dad tippt einen Fehler ein → Ramy sieht es sofort."}, {"t": "Monitoring-Bot (prüft alle Systeme)", "done": false, "idee": "Ein Bot, der regelmäßig alle laufenden Systeme prüft: Mindmap erreichbar? Jarvis-Bot antwortet? ngrok-Tunnel läuft? GHL-Formulare senden? Wenn etwas kaputt ist, meldet er es sofort an Ramy. Ohne diesen Bot ist die gesamte Infrastruktur fragil — ein stiller Ausfall kostet echte Leads. War schon im Backlog (Prio 3), jetzt auf hohe Prio hochgestuft."}], "idee": "Zwei Systeme, die Ramy als dringlich eingestuft hat, weil ohne sie der Rest fragil bleibt. Feedback versickert, wenn es nicht bei Ramy ankommt. Und wenn ein Bot still abstürzt und niemand es merkt, verliert die Firma echte Leads."}, {"name": "Dieses Cockpit", "tasks": [{"t": "Daten-Gehirn (cockpit-data.json)", "done": true, "idee": "Die zentrale Datei, die ALLES enthält: 16 Bereiche, darunter alle Systeme und Aufgaben, jeweils mit Fortschritt-% und vorhandenen Idee-Feldern. Sie liegt im Projekt-Ordner und wird von der Cockpit-App geladen. Eine Datenquelle speist sowohl Cockpit als auch (später) Mindmap — kein doppeltes Pflegen. Gebaut am 2026-06-01 aus der Vollanalyse aller Claude-Chats."}, {"t": "Hightech-App (mehrstufig)", "done": false, "idee": "Die eigentliche App über den Daten. Drei Drill-Down-Ebenen: Bereichs-Kacheln (mit Bild + %-Ring, rot→grün) → System-Übersicht → Aufgaben-Detail. Breadcrumb zum Zurückspringen, dunkles High-Tech-Design, Animationen. Als Link am Handy-Homescreen speicherbar (Web-App, kein App-Store). Prototyp (outputs/cockpit.html) ist gebaut — die finale mehrstufige Version steht noch aus."}, {"t": "Hosting + Zugangscode", "done": false, "idee": "Das Cockpit muss dauerhaft erreichbar sein — auf GitHub Pages (wie die Landingpages), mit kryptischem Link (nicht auffindbar für Fremde) + einfachem Zugangscode im Frontend. Das reicht für den Start. Wenn echte Umsatz-Zahlen reinkommen: echtes Login über Netlify/Vercel. Hosting-Repo ist bereits vorhanden (relounge-landing)."}, {"t": "Auto-Update durch Claude", "done": false, "idee": "Wenn Claude in einer Session etwas erledigt (z. B. eine Landingpage baut), aktualisiert er cockpit-data.json direkt und pusht sie per git ins GitHub-Repo. Die App lädt die Datei neu → Fortschritt im Cockpit steigt automatisch. Ramy muss nichts tun. Das ist der Kernmechanismus, der das Cockpit zum 'selbst-aktualisierenden Gehirn' macht."}], "idee": "Das Cockpit ist das Steuerungs-Zentrum für alle Firmen-Bereiche — eine mehrstufige Web-App (fühlt sich an wie eine App), die Ramy jederzeit am Handy oder PC öffnen kann. Drei Ebenen: Kacheln-Übersicht (alle Bereiche mit %-Ring) → Systeme eines Bereichs → Aufgaben-Detail. Das Besondere: Claude schreibt Fortschritte automatisch in die zentrale Datei (cockpit-data.json) und pusht sie ins GitHub-Repo — die App zeigt sofort den neuen Stand, ohne dass Ramy etwas tun muss."}], "firm": "zentrum", "idee": "Alle KI-Werkzeuge, die Claude und Ramy gemeinsam gebaut haben, um die Firma selbst zu steuern. Das Ziel ist ein 'selbst-aktualisierendes Ge
