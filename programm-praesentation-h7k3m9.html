<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dein Programm Schritt für Schritt — für das Setting-Gespräch</title>
<style>
  :root{
    --ink:#1b2330; --soft:#46505c; --muted:#7c8694; --line:#e4e8ee;
    --bg:#0e1116; --paper:#ffffff; --cream:#faf7f0;
    --gold:#c69a32; --gold-d:#a07d22; --gold-soft:#f5ecd4;
    --green:#2e9e6b; --green-soft:#e8f6ef; --red:#d9534f;
    --blue:#2f7dd1; --teal:#2aa6a0; --violet:#7a5cc7; --amber:#e6a019;
    --shadow:0 18px 50px rgba(10,14,22,.30);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .stage{position:fixed;inset:0;display:grid;place-items:center;padding:26px}
  .deck{position:relative;width:min(1180px,97vw);height:min(730px,93vh);background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
  .slide{position:absolute;inset:0;padding:40px 52px;opacity:0;visibility:hidden;transition:opacity .35s ease;overflow-y:auto;display:flex;flex-direction:column}
  .slide.on{opacity:1;visibility:visible}
  .slide::-webkit-scrollbar{width:8px}.slide::-webkit-scrollbar-thumb{background:#d8dee6;border-radius:8px}

  .kicker{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
  h1{font-size:36px;line-height:1.1;margin:0 0 11px;font-weight:830;letter-spacing:-.3px}
  h2{font-size:27px;line-height:1.15;margin:0 0 9px;font-weight:800;letter-spacing:-.2px}
  .lead{font-size:16.5px;color:var(--soft);line-height:1.55;max-width:760px}
  .big{font-size:18.5px;line-height:1.5}
  p{margin:0 0 10px}
  .quote{font-size:21px;font-weight:750;line-height:1.4;font-style:italic;border-left:5px solid var(--gold);padding:5px 0 5px 19px;margin:7px 0;max-width:820px}

  .cover{background:radial-gradient(120% 120% at 80% -10%,#1c2330,#0e1116);color:#fff;text-align:center;align-items:center;justify-content:center}
  .cover .kicker{color:var(--gold)} .cover h1{color:#fff;font-size:42px;max-width:900px} .cover .lead{color:#c5ccd6}
  .logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:900;color:#fff;font-size:24px;margin-bottom:20px;box-shadow:0 10px 30px rgba(198,154,50,.4)}

  .section{background:linear-gradient(135deg,var(--cream),#fff)}
  .secnum{font-size:13px;font-weight:900;color:#fff;background:var(--gold);min-width:80px;height:46px;padding:0 16px;border-radius:13px;display:inline-grid;place-items:center;margin-bottom:16px;letter-spacing:1px}
  .seclist{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
  .seclist span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:650;color:var(--soft)}

  /* claim */
  .claim{margin:auto 0}
  .claimq{font-size:30px;font-weight:830;line-height:1.25;letter-spacing:-.3px;max-width:880px;margin-bottom:6px}
  .claimq b{color:var(--gold-d)}
  .claimsub{font-size:16.5px;color:var(--soft);line-height:1.5;max-width:720px;margin-bottom:16px}
  .claimstats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
  .cs{background:var(--cream);border:1px solid var(--line);border-radius:15px;padding:17px 16px;text-align:center}
  .cs b{display:block;font-size:27px;font-weight:850;color:var(--gold-d);line-height:1;margin-bottom:5px}
  .cs span{font-size:13px;color:var(--soft);font-weight:600;line-height:1.3}

  .vrow{display:grid;grid-template-columns:270px 1fr;gap:30px;align-items:center;margin:auto 0}
  .vart{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;place-items:center;aspect-ratio:1/1}
  .vart svg{width:100%;height:100%}
  .vc h2{margin-bottom:6px}
  .vintro{font-size:16px;color:var(--soft);line-height:1.5;margin-bottom:11px}
  .checks{list-style:none;margin:0 0 9px;padding:0}
  .checks li{font-size:14.7px;line-height:1.45;margin:6px 0;padding-left:24px;position:relative;font-weight:540}
  .checks li:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:900;font-size:15px}
  .notline{font-size:13px;color:var(--muted);font-style:italic;border-left:3px solid var(--line);padding-left:11px}
  .nutzen{margin-top:11px;background:var(--ink);color:#fff;border-radius:11px;padding:10px 15px;font-size:14.3px;line-height:1.45}
  .nutzen b{color:var(--gold)}

  /* foto slide */
  .foto{display:grid;grid-template-columns:0.92fr 1.08fr;gap:30px;align-items:center;margin:auto 0}
  .foto.rev{grid-template-columns:1.08fr 0.92fr}
  .foto.rev .fimg{order:2}
  .fimg{width:100%;height:100%;max-height:480px}
  .fimg img{width:100%;height:100%;max-height:480px;object-fit:cover;border-radius:18px;border:1px solid var(--line);box-shadow:0 14px 34px rgba(10,14,22,.18)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
  .stat{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 15px;text-align:center}
  .stat b{display:block;font-size:23px;font-weight:850;color:var(--gold-d);line-height:1}
  .stat span{font-size:12px;color:var(--soft);font-weight:600}

  /* map */
  .map{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:4px 0 12px}
  .pillar{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .pillar .ph{padding:10px 12px;color:#fff;font-weight:800;font-size:14px}
  .pillar.d .ph{background:var(--blue)} .pillar.e .ph{background:var(--green)} .pillar.b .ph{background:var(--violet)} .pillar.g .ph{background:var(--gold-d)}
  .pillar ul{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#fff;flex:1}
  .pillar li{font-size:12.7px;color:var(--ink);padding-left:14px;position:relative;line-height:1.3}
  .pillar li:before{content:'•';position:absolute;left:2px;color:var(--gold);font-weight:900}
  .foundation{background:var(--ink);color:#fff;border-radius:13px;padding:12px 18px;text-align:center;font-size:14px;font-weight:600}
  .foundation b{color:var(--gold)}

  /* system diagram */
  .sysdiag{display:grid;place-items:center;margin:2px 0}
  .sysdiag svg{width:100%;max-width:660px;height:auto}
  .syswirk{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:8px}
  .ww{background:var(--cream);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:11px;padding:11px 14px;font-size:13.8px;line-height:1.4;color:var(--ink)}
  .ww b{color:var(--gold-d)}

  /* 5 Säulen */
  .saeulen{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin:7px 0}
  .sa{border:1px solid var(--line);border-radius:14px;padding:15px 13px;background:var(--cream);display:flex;flex-direction:column;gap:7px}
  .sa .si{width:40px;height:40px;color:var(--gold-d)}
  .sa b{font-size:14.5px;font-weight:780;line-height:1.2}
  .sa span{font-size:12.5px;color:var(--soft);line-height:1.4}
  .sa .num{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:1px}

  /* Ablauf 4 Schritte */
  .ablauf{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:8px 0}
  .ab{border:1px solid var(--line);border-radius:15px;background:var(--cream);padding:16px 15px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .ab .abn{width:34px;height:34px;border-radius:10px;background:var(--gold);color:#fff;font-weight:900;font-size:15px;display:grid;place-items:center;margin-bottom:10px}
  .ab b{font-size:14.7px;font-weight:790;line-height:1.2;margin-bottom:6px}
  .ab ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
  .ab li{font-size:12.3px;color:var(--soft);line-height:1.32;padding-left:13px;position:relative}
  .ab li:before{content:'›';position:absolute;left:0;color:var(--gold);font-weight:900}
  .abtag{margin-top:auto;padding-top:9px;font-size:11px;font-weight:700;color:var(--gold-d)}

  /* Online-Ablauf */
  .onflow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0}
  .of{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
  .of .ofi{width:38px;height:38px;color:var(--blue)}
  .of b{font-size:13px;font-weight:780;line-height:1.2}
  .of span{font-size:11.5px;color:var(--soft);line-height:1.35}
  .onbanner{margin-top:11px;background:linear-gradient(135deg,#1c2330,#0e1116);color:#fff;border-radius:13px;padding:14px 18px;font-size:15px;line-height:1.45;font-weight:600}
  .onbanner b{color:var(--gold)}
  .onnote{margin-top:9px;font-size:13px;color:var(--muted);font-style:italic}

  /* Blutbild Achsen */
  .achsen{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:5px 0 11px}
  .ax{border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column}
  .ax .axh{padding:9px 11px;color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:5px}
  .ax.s1 .axh{background:var(--amber)} .ax.s2 .axh{background:var(--violet)} .ax.s3 .axh{background:var(--red)} .ax.s4 .axh{background:var(--green)} .ax.s5 .axh{background:var(--blue)}
  .ax .axb{padding:10px 11px;background:#fff;flex:1}
  .ax .val{font-size:11.5px;font-weight:700;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:3px 7px;display:inline-block;margin:0 4px 4px 0}
  .ax .dis{display:block;margin-top:5px;font-size:11px;color:var(--muted);line-height:1.3;font-style:italic}
  .krankheit{background:var(--gold-soft);border:1px solid #e6d39a;border-radius:11px;padding:11px 16px;font-size:14px;color:#5e4912;font-weight:600;line-height:1.45}
  .krankheit b{color:var(--gold-d)}

  /* detail3 */
  .d3{display:grid;grid-template-columns:190px 1fr;gap:26px;align-items:start;margin:auto 0}
  .d3 .di{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;place-items:center;aspect-ratio:1/1}
  .d3 .di svg{width:100%;height:100%}
  .blk{margin-bottom:11px}
  .blk .bl{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;display:inline-block;padding:2px 9px;border-radius:6px}
  .blk.was .bl{background:var(--blue);color:#fff} .blk.warum .bl{background:var(--amber);color:#fff} .blk.effekt .bl{background:var(--green);color:#fff}
  .blk .tx{font-size:14.5px;line-height:1.5;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
  .chips span{font-size:12px;font-weight:650;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--soft)}

  /* 28-Tage 2 Phasen */
  .phasen{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
  .pha{border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
  .pha .phh{padding:13px 16px;color:#fff;font-weight:820}
  .pha.p1 .phh{background:linear-gradient(135deg,#5aa9c9,#3d83a6)} .pha.p2 .phh{background:linear-gradient(135deg,#2e9e6b,#1f7d52)}
  .pha .phh small{display:block;font-weight:600;opacity:.92;font-size:12px;margin-top:2px}
  .pha .phb{padding:13px 16px;background:#fff;flex:1}
  .pha .phb p{font-size:13.7px;color:var(--soft);line-height:1.45;margin:0 0 7px}
  .pha .phb b{color:var(--ink)}
  .resetfoot{background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:13.7px;color:var(--soft);font-style:italic}
  .resetfoot b{color:var(--gold-d);font-style:normal}

  /* Ernährungs-Stufen */
  .stufen{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0;align-items:end}
  .stf{border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column}
  .stf .sh{background:var(--green);color:#fff;font-weight:800;font-size:13px;padding:8px 11px}
  .stf:nth-child(1) .sh{opacity:.55}.stf:nth-child(2) .sh{opacity:.68}.stf:nth-child(3) .sh{opacity:.8}.stf:nth-child(4) .sh{opacity:.9}
  .stf .sb{background:#fff;padding:10px 12px;font-size:12.7px;color:var(--soft);line-height:1.4;flex:1}
  .stf .sn{font-size:10px;font-weight:800;color:var(--green);letter-spacing:1px;padding:8px 11px 0;background:#fff}

  /* App gallery */
  .apptop{margin-bottom:4px}
  .appfns{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
  .appfns span{font-size:13px;font-weight:650;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:6px 13px;color:var(--soft)}
  .appgal{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:8px}
  .gitem{display:flex;flex-direction:column;gap:5px}
  .gitem img{width:100%;height:170px;object-fit:cover;object-position:top;border-radius:12px;border:1px solid var(--line);box-shadow:0 7px 18px rgba(10,14,22,.13);background:#fff}
  .gitem span{font-size:12px;font-weight:650;color:var(--soft);text-align:center}

  /* App ist / ist nicht */
  .istnicht{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
  .col{border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
  .col .colh{padding:11px 15px;font-weight:820;font-size:14.5px;color:#fff}
  .col.no .colh{background:var(--muted)} .col.yes .colh{background:var(--green)}
  .col ul{list-style:none;margin:0;padding:12px 15px;display:flex;flex-direction:column;gap:7px;background:#fff;flex:1}
  .col li{font-size:13.2px;line-height:1.35;padding-left:21px;position:relative;color:var(--ink)}
  .col.no li:before{content:'✕';position:absolute;left:0;color:var(--muted);font-weight:900}
  .col.yes li:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:900}
  .altbox{margin-top:10px;background:var(--gold-soft);border:1px solid #e6d39a;border-radius:11px;padding:11px 16px;font-size:13.7px;color:#5e4912;line-height:1.45}
  .altbox b{color:var(--gold-d)}

  /* iGYM workout katalog (animiert) */
  .igymtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:3px}
  .soonbadge{display:inline-block;background:var(--violet);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:4px 12px;letter-spacing:.5px}
  .wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:9px 0}
  .wcard{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(10,14,22,.07)}
  .wcard .wfig{height:96px;background:linear-gradient(135deg,#f3f6fa,#e9eef5);display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line)}
  .wcard .wfig .gif{position:absolute;top:7px;right:8px;font-size:9.5px;font-weight:800;color:var(--violet);background:#fff;border:1px solid #e3dbf2;border-radius:5px;padding:2px 6px;letter-spacing:.5px}
  .wcard .wfig svg{width:62px;height:78px}
  .wcard .wb{padding:11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .wcard .wt{font-size:13.5px;font-weight:790;line-height:1.2}
  .wtags{display:flex;flex-wrap:wrap;gap:4px}
  .wtags span{font-size:10px;font-weight:700;border-radius:5px;padding:2px 6px;background:var(--cream);border:1px solid var(--line);color:var(--soft)}
  .wtags .lv{background:#f1ecfa;border-color:#e0d4f5;color:var(--violet)}
  .wmeta{margin-top:auto;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:650;padding-top:5px;border-top:1px dashed var(--line)}
  .exsvg{stroke:var(--ink);fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .exsvg .body{transform-box:fill-box;transform-origin:50% 100%}
  .exsvg .arm{transform-box:fill-box;transform-origin:50% 0%}
  @keyframes exbob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(7px) scaleY(.9)}}
  @keyframes exsway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  @keyframes exjump{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes exwave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(20deg)}}
  .ex-bob .body{animation:exbob 1.5s ease-in-out infinite}
  .ex-sway .body{animation:exsway 2.1s ease-in-out infinite}
  .ex-jump .body{animation:exjump .85s ease-in-out infinite}
  .ex-wave .arm{animation:exwave 1.3s ease-in-out infinite}

  /* iGYM programme */
  .filterbar{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0}
  .filterbar span{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--soft)}
  .filterbar span.act{background:var(--violet);color:#fff;border-color:var(--violet)}
  .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0}
  .pcard{border:1px solid var(--line);border-radius:13px;background:var(--cream);padding:13px 14px;display:flex;flex-direction:column;gap:7px}
  .pcard b{font-size:13.7px;font-weight:790;line-height:1.22}
  .pcard .ptags{display:flex;flex-wrap:wrap;gap:4px}
  .pcard .ptags span{font-size:10px;font-weight:700;border-radius:5px;padding:2px 6px;background:#fff;border:1px solid var(--line);color:var(--soft)}
  .pcard .pm{margin-top:auto;display:flex;gap:10px;font-size:11px;color:var(--muted);font-weight:650;padding-top:6px;border-top:1px dashed #e0d8c4}

  /* App-Zukunft Roadmap */
  .road{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:8px 0}
  .rc{border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
  .rc .rh{padding:11px 15px;font-weight:820;font-size:14px;color:#fff;display:flex;align-items:center;gap:7px}
  .rc.now .rh{background:var(--green)} .rc.soon .rh{background:var(--violet)} .rc.wip .rh{background:var(--amber)}
  .rc ul{list-style:none;margin:0;padding:12px 15px;display:flex;flex-direction:column;gap:8px;background:#fff;flex:1}
  .rc li{font-size:13px;line-height:1.35;padding-left:16px;position:relative;color:var(--ink)}
  .rc li:before{content:'•';position:absolute;left:2px;color:var(--gold);font-weight:900}
  .rc li small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}

  /* live calls */
  .calls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
  .call{border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
  .call .ch{padding:13px 16px;color:#fff;font-weight:820;display:flex;align-items:center;justify-content:space-between}
  .call.c1 .ch{background:linear-gradient(135deg,#2e9e6b,#1f7d52)} .call.c2 .ch{background:linear-gradient(135deg,#7a5cc7,#5b3fa0)}
  .call .ch .t{font-size:13px;font-weight:800;background:rgba(255,255,255,.2);border-radius:8px;padding:4px 10px}
  .call .cb{padding:13px 16px;background:#fff;flex:1}
  .call .cb b{font-size:15px;display:block;margin-bottom:4px}
  .call .cb span{font-size:13.3px;color:var(--soft);line-height:1.45}
  .callfoot{background:var(--ink);color:#fff;border-radius:12px;padding:12px 17px;font-size:14px;line-height:1.45;margin-top:3px}
  .callfoot b{color:var(--gold)}

  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-top:6px}
  .lcard{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
  .lcard .ic{width:34px;height:34px}
  .lcard b{font-size:13.7px;font-weight:780;display:block;margin-bottom:2px}
  .lcard span{font-size:12.5px;color:var(--soft);line-height:1.38}

  .pakete{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:6px}

  .pk ul{list-style:none;margin:0;padding:13px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
  .pk li{font-size:12.8px;padding-left:19px;position:relative;line-height:1.3}
  .pk li:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:900}
  .pk.feat{box-shadow:0 0 0 3px var(--gold)}
  .badge{display:inline-block;background:#fff;color:var(--gold-d);font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 10px;margin-top:5px}

  /* Patientenportal — Intro mit Browser-Mockup */
  .portal{display:grid;grid-template-columns:1.02fr .98fr;gap:28px;align-items:center;margin:auto 0}
  .pmock{border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 14px 34px rgba(10,14,22,.16);background:#fff}
  .pmock .ptop{background:#1b2330;padding:8px 12px;display:flex;align-items:center;gap:6px}
  .pmock .ptop i{width:9px;height:9px;border-radius:50%;background:#485060;display:inline-block}
  .pmock .ptop .purl{margin-left:9px;font-size:11px;color:#aeb6c4;font-weight:600}
  .pmock .pbody{padding:14px 16px}
  .pmock .pprog{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.5px;display:flex;justify-content:space-between;margin-bottom:6px}
  .pmock .ptrack{height:8px;background:var(--cream);border-radius:99px;overflow:hidden;margin-bottom:12px}
  .pmock .ptrack i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--gold),var(--gold-d))}
  .pmock .pstep{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.3px}
  .pmock .pstep:last-child{border-bottom:0}
  .pmock .pstep .pc{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:800}
  .pmock .pstep.done .pc{background:var(--green)} .pmock .pstep.now .pc{background:var(--blue)} .pmock .pstep.lock .pc{background:#c9d0db}
  .pmock .pstep.lock{color:var(--muted)}

  /* Portal-Weg in 4 Phasen */
  .pweg{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:8px 0}
  .pwp{border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column}
  .pwp .pwh{padding:9px 12px;color:#fff;font-weight:800;font-size:12.5px}
  .pwp.f1 .pwh{background:var(--gold-d)} .pwp.f2 .pwh{background:var(--blue)} .pwp.f3 .pwh{background:var(--violet)} .pwp.f4 .pwh{background:var(--green)}
  .pwp ol{list-style:none;margin:0;padding:9px 11px;display:flex;flex-direction:column;gap:6px;background:#fff;flex:1;counter-reset:s}
  .pwp li{font-size:11.8px;line-height:1.3;color:var(--ink);padding-left:23px;position:relative;min-height:17px}
  .pwp li:before{content:counter(s);counter-increment:s;position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:var(--cream);border:1px solid var(--line);font-size:9px;font-weight:800;color:var(--soft);display:grid;place-items:center}
  .pwegfoot{background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:13.7px;line-height:1.45;margin-top:4px}
  .pwegfoot b{color:var(--gold)}

  /* IgG-Kette */
  .kette{display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr 20px 1fr 20px 1fr;gap:0;align-items:stretch;margin:9px 0}
  .kn{border:1px solid var(--line);border-radius:12px;background:var(--cream);padding:11px 11px;display:flex;flex-direction:column;gap:5px;text-align:center}
  .kn .kt{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gold-d)}
  .kn b{font-size:13px;font-weight:780;line-height:1.18}
  .kn span{font-size:11px;color:var(--soft);line-height:1.3}
  .kn.hi{background:var(--gold-soft);border-color:#e6d39a}
  .kn.app{background:var(--ink);color:#fff} .kn.app .kt{color:var(--gold)} .kn.app span{color:#c5ccd6}
  .karrow{display:grid;place-items:center;font-size:18px;color:var(--muted);font-weight:800}
  .kettebox{margin-top:11px;background:var(--gold-soft);border:1px solid #e6d39a;border-radius:12px;padding:12px 16px;font-size:14px;color:#5e4912;line-height:1.5}
  .kettebox b{color:var(--gold-d)}

  /* Verlaufsdiagramm */
  .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:8px 0}
  .vc2{border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px 13px;box-shadow:0 6px 16px rgba(10,14,22,.06)}
  .vc2 .vt{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
  .vc2 .vt .trend{float:right;font-size:11px;font-weight:800}
  .vc2 svg{width:100%;height:118px;display:block}
  .vfoot{background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:13.7px;line-height:1.45;margin-top:3px}
  .vfoot b{color:var(--gold)}
  .vnote{font-size:11px;color:var(--muted);font-style:italic;margin-top:6px}

  .bar{position:fixed;left:0;right:0;bottom:0;height:54px;display:flex;align-items:center;gap:12px;padding:0 22px;background:rgba(14,17,22,.86);backdrop-filter:blur(8px);color:#fff;z-index:40}
  .btn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;width:40px;height:34px;font-size:17px;cursor:pointer;transition:.15s;display:grid;place-items:center}
  .btn:hover{background:var(--gold);border-color:var(--gold)}
  select{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;max-width:320px}
  select option{color:#1b2330}
  .count{margin-left:auto;font-size:13px;color:#c5ccd6;font-weight:600}
  .prog{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-d));z-index:50;transition:width .3s}
  @media (max-width:880px){.slide{padding:22px 18px}.deck{height:92vh}
    .vrow,.map,.modell,.pakete,.cards,.saeulen,.achsen,.d3,.foto,.foto.rev,.syswirk,.stufen,.ablauf,.onflow,.phasen,.istnicht,.appgal,.wgrid,.pgrid,.road,.calls,.claimstats,.portal,.pweg,.vgrid{grid-template-columns:1fr}

    .foto.rev .fimg{order:0}h1{font-size:25px}.cover h1{font-size:27px}h2{font-size:21px}.stage{padding:6px}}

/* Mini-Liniendiagramm mit Ampel-Zonen für das Verlaufsdiagramm */
function lineChart(o){
 const w=320,h=150,pad={l:30,r:12,t:10,b:22},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
 const min=o.min,max=o.max,v=o.vals;
 const X=i=>pad.l+(v.length>1?i*(iw/(v.length-1)):iw/2);
 const Y=val=>pad.t+ih*(1-(val-min)/(max-min));
 const zones=(o.zones||[]).map(z=>{const y1=Y(z.from),y2=Y(z.to);return `<rect x="${pad.l}" y="${Math.min(y1,y2).toFixed(1)}" width="${iw}" height="${Math.abs(y2-y1).toFixed(1)}" fill="${z.color}"/>`}).join('');
 const d=v.map((val,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(val).toFixed(1)}`).join(' ');
 const pts=v.map((val,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(val).toFixed(1)}" r="10" fill="${o.color}"/><text x="${X(i).toFixed(1)}" y="${(Y(val)+3.2).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">${val}</text>`).join('');
 const xl=(o.labels||[]).map((l,i)=>`<text x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="8.5" fill="#9aa3b1">${l}</text>`).join('');
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${zones}<path d="${d}" fill="none" stroke="${o.color}" stroke-width="2.4"/>${pts}${xl}</svg>`;
}

const deck=document.getElementById('deck');
function ico(n,c){return `<span style="color:${c||'var(--gold)'};display:block;width:100%;height:100%">${I[n]||''}</span>`}
function render(){deck.innerHTML=S.map((s,i)=>`<section class="slide${s.type==='cover'?' cover':''}${s.type==='section'?' section':''}" data-i="${i}">${H(s)}</section>`).join('')}
function H(s){
  if(s.type==='cover')return `<div class="logo">${s.logo}</div><div class="kicker">${s.kicker}</div><h1>${s.title}</h1><p class="lead">${s.subtitle}</p>`;
  if(s.type==='section')return `<div style="margin:auto 0"><div class="secnum">${s.num}</div><h1>${s.title}</h1><p class="lead">${s.subtitle}</p>${s.list?`<div class="seclist">${s.list.map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>`;
  if(s.type==='text')return `<div style="margin:auto 0">${s.kicker?`<div class="kicker">${s.kicker}</div>`:''}<h2>${s.title}</h2>${s.body}</div>`;
  if(s.type==='claim')return `<div class="claim"><div class="kicker">${s.kicker}</div><div class="claimq">${s.q}</div><div class="claimsub">${s.sub}</div><div class="claimstats">${s.stats.map(t=>`<div class="cs"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div></div>`;
  if(s.type==='visual')return `<div class="vrow"><div class="vart">${ico(s.icon,s.color)}</div><div class="vc"><div class="kicker">${s.kicker}</div><h2>${s.title}</h2><div class="vintro">${s.intro}</div><ul class="checks">${s.checks.map(c=>`<li>${c}</li>`).join('')}</ul>${s.not?`<div class="notline">${s.not}</div>`:''}${s.nutzen?`<div class="nutzen">→ ${s.nutzen}</div>`:''}</div></div>`;
  if(s.type==='foto')return `<div class="foto${s.rev?' rev':''}"><div class="fimg"><img src="${ENM+s.img}" alt="" loading="lazy"></div><div><div class="kicker">${s.kicker}</div><h2>${s.title}</h2>${s.stats?`<div class="stats">${s.stats.map(st=>`<div class="stat"><b>${st[0]}</b><span>${st[1]}</span></div>`).join('')}</div>`:''}<div class="vintro">${s.intro}</div><ul class="checks">${s.checks.map(c=>`<li>${c}</li>`).join('')}</ul>${s.nutzen?`<div class="nutzen">→ ${s.nutzen}</div>`:''}</div></div>`;
  if(s.type==='detail')return `<div class="d3"><div class="di">${ico(s.icon,s.color)}</div><div><div class="kicker">${s.kicker}</div><h2>${s.title}</h2><div class="blk was"><span class="bl">Was wird gemacht</span><div class="tx">${s.was.tx}${s.was.chips?`<div class="chips">${s.was.chips.map(c=>`<span>${c}</span>`).join('')}</div>`:''}</div></div><div class="blk warum"><span class="bl">Warum</span><div class="tx">${s.warum}</div></div><div class="blk effekt"><span class="bl">Dein Effekt</span><div class="tx">${s.effekt}</div></div>${s.not?`<div class="notline">${s.not}</div>`:''}</div></div>`;
  if(s.type==='ablauf')return `<div class="kicker">${s.kicker}</div><h2>${s.title}</h2>
     <div class="ablauf">${s.items.map(a=>`<div class="ab"><div class="abn">${a.n}</div><b>${a.t}</b><ul>${a.li.map(x=>`<li>${x}</li>`).join('')}</ul><div class="abtag">${a.tag}</div></div>`).join('')}</div>
     <p class="lead" style="margin-top:6px">Klar, sicher, in deinem Tempo — du weißt immer, wo du gerade stehst und was als Nächstes kommt.</p>`;

render();

let idx=0;const slides=[...document.querySelectorAll('.slide')];
const prog=document.getElementById('prog'),count=document.getElementById('count'),jump=document.getElementById('jump');
jump.innerHTML=S.map((s,i)=>`<option value="${i}">${i+1}. ${(s.title||'Folie').replace(/<[^>]+>/g,'')}</option>`).join('');
function show(n){idx=Math.max(0,Math.min(S.length-1,n));slides.forEach((el,i)=>el.classList.toggle('on',i===idx));prog.style.width=((idx+1)/S.length*100)+'%';count.textContent=`${idx+1} / ${S.length}`;jump.value=idx;}
document.getElementById('prev').onclick=()=>show(idx-1);
document.getElementById('next').onclick=()=>show(idx+1);
jump.onchange=e=>show(+e.target.value);
document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){show(idx+1);e.preventDefault();}if(['ArrowLeft','PageUp'].includes(e.key)){show(idx-1);e.preventDefault();}if(e.key==='Home')show(0);if(e.key==='End')show(S.length-1);if(e.key==='f'||e.key==='F')document.getElementById('fs').click();});
deck.addEventListener('click',e=>{if(e.target.closest('a,button,select'))return;const r=deck.getBoundingClientRect();(e.clientX-r.left>r.width*0.5)?show(idx+1):show(idx-1);});
show(0);
</script>
